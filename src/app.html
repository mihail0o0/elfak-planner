<title>Planer ispita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/*FONTS*/
/* Layout: radni sto — levo filteri, u sredini kalendar, desno izabrani dan. Stil: Remenex (squircle, Chillax + Instrument Sans) */
:root {
  --bg: #f7f7f7;
  --surface: #ffffff;
  --tile: #f3f4f8;
  --tile-hover: #eceefa;
  --line: rgb(2 8 43 / .09);
  --line-strong: rgb(2 8 43 / .18);
  --ink: #02082b;
  --ink-2: rgb(2 8 43 / .70);
  --ink-3: rgb(2 8 43 / .48);
  --brand: #1a3ffb;
  --brand-hover: #2f51ff;
  --brand-fg: #1a3ffb;
  --on-brand: #ffffff;
  --brand-soft: #eef1ff;
  --brand-soft-2: #e2e8ff;
  --brand-line: rgb(26 63 251 / .35);
  --orange: #f77d44;
  --danger: #e0463a;
  --danger-soft: #fdeeec;
  --heat-base: #f3f4f8;
  --toast-bg: #02082b;
  --toast-fg: #f8f9ff;
  --backdrop: rgb(2 8 43 / .38);
  --shadow-card: 0 4px 25px -10px rgb(0 0 0 / .17);
  --shadow-pop: 0 24px 60px -20px rgb(2 8 43 / .35), 0 4px 25px -10px rgb(0 0 0 / .17);
  --shadow-btn: inset 0 4px 4px rgb(255 255 255 / .23), 3px 4px 11px rgb(150 150 150 / .10), 0 6px 16px -8px rgb(26 63 251 / .55);
  --shadow-btn-2: 0 4px 25px -10px rgb(0 0 0 / .17), 3px 4px 11px rgb(150 150 150 / .10);
  --shadow-press: 0 2px 5px rgb(0 0 0 / .20);
  --drop: drop-shadow(0 8px 14px rgb(0 0 0 / .07));
  --r1: #0ea5a4; --r2: #f77d44; --r3: #8b5cf6; --r4: #e5487a; --r5: #d4a600; --r6: #16a34a;
  --f-head: "Chillax", "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --rad-xs: 10px; --rad-sm: 14px; --rad-md: 18px; --rad-lg: 24px; --rad-xl: 32px; --rad-pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0b10; --surface: #13151c; --tile: #1c1f28; --tile-hover: #262a35; --line: rgb(248 249 255 / .08); --line-strong: rgb(248 249 255 / .18);
  --ink: #f8f9ff; --ink-2: rgb(248 249 255 / .72); --ink-3: rgb(248 249 255 / .48);
  --brand: #1a3ffb; --brand-hover: #3555ff; --brand-fg: #8ea0ff; --on-brand: #ffffff; --brand-soft: rgb(80 105 255 / .14); --brand-soft-2: rgb(80 105 255 / .22); --brand-line: rgb(142 160 255 / .38);
  --orange: #ff9a6a; --danger: #ff7b6e; --danger-soft: rgb(255 123 110 / .14); --heat-base: #1c1f28;
  --toast-bg: #f8f9ff; --toast-fg: #02082b; --backdrop: rgb(4 5 8 / .62);
  --shadow-card: 0 4px 25px -10px rgb(0 0 0 / .6), inset 0 0 0 1px rgb(248 249 255 / .05);
  --shadow-pop: 0 24px 60px -20px rgb(0 0 0 / .8), inset 0 0 0 1px rgb(248 249 255 / .07);
  --shadow-btn: inset 0 4px 4px rgb(255 255 255 / .23), 3px 4px 11px rgb(0 0 0 / .25), 0 6px 18px -8px rgb(26 63 251 / .8);
  --shadow-btn-2: inset 0 1px 0 rgb(248 249 255 / .06), 3px 4px 11px rgb(0 0 0 / .25);
  --shadow-press: 0 2px 5px rgb(0 0 0 / .5);
  --drop: drop-shadow(0 8px 14px rgb(0 0 0 / .35));
  --r1: #2dd4bf; --r2: #ff9a6a; --r3: #b69cff; --r4: #ff7aa5; --r5: #f5cf3a; --r6: #4ade80;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a0b10; --surface: #13151c; --tile: #1c1f28; --tile-hover: #262a35; --line: rgb(248 249 255 / .08); --line-strong: rgb(248 249 255 / .18);
  --ink: #f8f9ff; --ink-2: rgb(248 249 255 / .72); --ink-3: rgb(248 249 255 / .48);
  --brand: #1a3ffb; --brand-hover: #3555ff; --brand-fg: #8ea0ff; --on-brand: #ffffff; --brand-soft: rgb(80 105 255 / .14); --brand-soft-2: rgb(80 105 255 / .22); --brand-line: rgb(142 160 255 / .38);
  --orange: #ff9a6a; --danger: #ff7b6e; --danger-soft: rgb(255 123 110 / .14); --heat-base: #1c1f28;
  --toast-bg: #f8f9ff; --toast-fg: #02082b; --backdrop: rgb(4 5 8 / .62);
  --shadow-card: 0 4px 25px -10px rgb(0 0 0 / .6), inset 0 0 0 1px rgb(248 249 255 / .05);
  --shadow-pop: 0 24px 60px -20px rgb(0 0 0 / .8), inset 0 0 0 1px rgb(248 249 255 / .07);
  --shadow-btn: inset 0 4px 4px rgb(255 255 255 / .23), 3px 4px 11px rgb(0 0 0 / .25), 0 6px 18px -8px rgb(26 63 251 / .8);
  --shadow-btn-2: inset 0 1px 0 rgb(248 249 255 / .06), 3px 4px 11px rgb(0 0 0 / .25);
  --shadow-press: 0 2px 5px rgb(0 0 0 / .5);
  --drop: drop-shadow(0 8px 14px rgb(0 0 0 / .35));
  --r1: #2dd4bf; --r2: #ff9a6a; --r3: #b69cff; --r4: #ff7aa5; --r5: #f5cf3a; --r6: #4ade80;
  color-scheme: dark; }

/* ---------- osnova ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-fg); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
h1, h2, h3 { font-family: var(--f-head); font-weight: 500; letter-spacing: -.02em; text-wrap: balance; }

/* squircle: nativno gde postoji (corner-shape), inače JS crta oblik (vidi skriptu „squircle") */
@supports (corner-shape: squircle) { * { corner-shape: squircle; } }
.sq-on { background-color: transparent !important; background-image: var(--sq-img) !important; background-size: 100% 100% !important; background-repeat: no-repeat !important; border-color: transparent !important; box-shadow: none !important; filter: var(--sq-drop, none); }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 48px; max-width: 1680px; margin: 0 auto; }

/* ---------- zaglavlje ---------- */
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
header.top .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { width: 44px; height: 44px; border-radius: var(--rad-sm); background: var(--brand); color: var(--on-brand); display: grid; place-items: center; box-shadow: var(--shadow-btn); flex: none; }
header.top h1 { font-size: 26px; line-height: 1.05; margin: 0; }
header.top .sub { color: var(--ink-3); font-size: 13.5px; margin-top: 3px; }
header.top .grow { flex: 1; }

/* ---------- dugmad (Remenex) ---------- */
.btn { --b-bg: var(--surface); border: 1px solid var(--line); background: var(--b-bg); color: var(--ink); border-radius: var(--rad-md); min-height: 42px; padding: 9px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-head); font-weight: 500; font-size: 14.5px; letter-spacing: .005em; box-shadow: var(--shadow-btn-2); transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease; white-space: nowrap; }
.btn:hover { --b-bg: var(--tile); }
.btn:active { transform: translateY(1px); box-shadow: var(--shadow-press); }
.btn.primary { --b-bg: var(--brand); color: var(--on-brand); border-color: var(--brand); box-shadow: var(--shadow-btn); }
.btn.primary:hover { --b-bg: var(--brand-hover); }
.btn.primary:active { box-shadow: var(--shadow-press); }
.btn.ghost { --b-bg: transparent; border-color: transparent; box-shadow: none; min-height: 36px; padding: 6px 12px; }
.btn.ghost:hover { --b-bg: var(--tile); }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: 13.5px; border-radius: var(--rad-sm); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { --b-bg: var(--danger); color: #fff; border-color: var(--danger); box-shadow: inset 0 4px 4px rgb(255 255 255 / .2), 3px 4px 11px rgb(150 150 150 / .1); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.iconbtn { width: 42px; height: 42px; padding: 0; border-radius: var(--rad-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-grid; place-items: center; box-shadow: var(--shadow-btn-2); transition: transform .15s ease, background-color .15s ease; }
.iconbtn:hover { background: var(--tile); }
.iconbtn:active { transform: translateY(1px); box-shadow: var(--shadow-press); }

/* ---------- raspored ---------- */
.layout { display: grid; grid-template-columns: 292px minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
@media (max-width: 1320px) { .layout { grid-template-columns: 280px minmax(0, 1fr); } .day-panel { grid-column: 2; } }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .day-panel { grid-column: 1; } }

.card { background: var(--surface); border-radius: var(--rad-xl); box-shadow: var(--shadow-card); }

/* ---------- filteri ---------- */
.filters { padding: 20px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow: auto; }
.filters-toggle { display: none; }
@media (max-width: 860px) {
  .filters { position: static; max-height: none; }
  .filters-toggle { display: inline-flex; }
  .filters.collapsed { display: none; }
}
.fgroup { display: flex; flex-direction: column; gap: 9px; }
.flabel { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; min-height: 22px; }
.flabel button:hover { color: var(--ink); background: var(--tile); }
.flabel button { border: 0; background: none; color: var(--ink-3); font-size: 12.5px; font-weight: 600; letter-spacing: 0; text-transform: none; padding: 2px 4px; border-radius: 8px; }
.search { position: relative; }
.search input { width: 100%; height: 44px; border: 1px solid transparent; background: var(--tile); border-radius: var(--rad-md); padding: 0 14px 0 42px; font-size: 15px; transition: background-color .15s, border-color .15s; }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { outline: none; background: var(--surface); border-color: var(--brand-line); box-shadow: 0 0 0 3px var(--brand-soft); }
.search > svg { position: absolute; left: 15px; top: 22px; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 20; background: var(--surface); border-radius: var(--rad-lg); box-shadow: var(--shadow-pop); padding: 6px; margin: 0; list-style: none; max-height: 360px; overflow: auto; }
.sugg li { padding: 10px 12px; border-radius: var(--rad-sm); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.sugg li[aria-selected="true"], .sugg li:hover { background: var(--brand-soft); }
.sugg .sn { font-weight: 500; color: var(--ink); line-height: 1.3; }
.sugg .sn mark { background: none; color: var(--brand-fg); font-weight: 700; }
.sugg .sm { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sugg .none { color: var(--ink-3); cursor: default; }
.sugg .none:hover { background: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid transparent; background: var(--tile); color: var(--ink); border-radius: var(--rad-sm); min-height: 32px; padding: 5px 11px; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background-color .15s, transform .15s; }
.chip:hover { background: var(--tile-hover); }
.chip:active { transform: translateY(1px); }
.chip[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-fg); border-color: var(--brand-line); }
.chip[aria-pressed="true"]:hover { background: var(--brand-soft-2); }
.chip[aria-pressed="true"] .n { opacity: .8; }
.chip .dot { width: 9px; height: 9px; border-radius: 4px; background: var(--c, var(--ink-3)); }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--surface); }
.chip .n { font-size: 12px; opacity: .55; font-variant-numeric: tabular-nums; }
.dates { display: grid; grid-template-columns: 1fr; gap: 8px; }
.dates label { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 10px; }
.dates label span { width: 22px; }
.dates input { flex: 1; min-width: 0; height: 40px; border: 1px solid transparent; background: var(--tile); border-radius: var(--rad-sm); padding: 0 12px; }
.dates input:focus { outline: none; border-color: var(--brand-line); background: var(--surface); box-shadow: 0 0 0 3px var(--brand-soft); }
.fsummary { font-size: 14px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fsummary #resultCount { font-family: var(--f-head); font-weight: 500; color: var(--ink); }

/* ---------- glavni deo ---------- */
.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border-radius: var(--rad-md); padding: 4px; gap: 3px; box-shadow: var(--shadow-btn-2); }
.seg button { border: 0; background: transparent; min-height: 34px; padding: 5px 14px; border-radius: var(--rad-sm); color: var(--ink-2); font-family: var(--f-head); font-weight: 500; font-size: 14.5px; transition: background-color .15s; }
.seg button:hover { background: var(--tile); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); box-shadow: var(--shadow-press); }
.navbtns { display: inline-flex; gap: 6px; }
.period { font-family: var(--f-head); font-weight: 500; font-size: 24px; letter-spacing: -.02em; min-width: 0; margin-left: 4px; }
.period small { font-family: var(--f-body); font-weight: 500; letter-spacing: 0; color: var(--ink-3); font-size: 14px; margin-left: 8px; }

/* ---------- mesec: pločice ---------- */
#viewArea { padding: 14px; }
.month { overflow-x: auto; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(92px, 1fr)); gap: 6px; min-width: 680px; }
.mhead { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 4px 10px 6px; }
.mcell { position: relative; border: 1px solid transparent; background: var(--tile); border-radius: var(--rad-md); min-height: 118px; padding: 10px 11px; display: flex; flex-direction: column; gap: 5px; text-align: left; color: var(--ink); transition: background-color .15s, transform .15s; }
.mcell.out { background: transparent; border-color: transparent; color: var(--ink-3); opacity: .45; }
.mcell.weekend:not(.has) .dn { color: var(--ink-3); }
.mcell.has { cursor: pointer; background: var(--tile); }
.mcell:not(.has):not(.out) { background: transparent; border-color: var(--line); }
.mcell:not(.has):not(.out) .dn { color: var(--ink-3); font-weight: 400; }
.mcell.has:hover { background: var(--tile-hover); }
.mcell.has:not(.sel):hover .total { background: var(--brand); color: var(--on-brand); }
.mcell.has:active { transform: translateY(1px); }
.mcell.sel { background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-btn); }
.mcell.sel .slot, .mcell.sel .slot b, .mcell.sel .mini { color: var(--on-brand); }
.mcell.sel .total { background: rgb(255 255 255 / .2); color: var(--on-brand); }
.mcell .dn { font-family: var(--f-head); font-weight: 500; font-size: 17px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.mcell.today .dn > span:first-child { background: var(--orange); color: #fff; border-radius: 10px; padding: 0 8px; min-width: 30px; text-align: center; }
.mcell .total { font-family: var(--f-body); font-size: 12px; font-weight: 600; color: var(--brand-fg); background: var(--brand-soft); border-radius: 9px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.slot { font-size: 13px; display: flex; gap: 6px; align-items: baseline; color: var(--ink-2); }
.slot b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.mini { font-size: 12.5px; line-height: 1.3; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--c, var(--brand)); padding-left: 6px; border-radius: 2px; }
@media (max-width: 600px) {
  #viewArea { padding: 10px; }
  .mgrid { min-width: 0; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .mhead { padding: 4px 0; text-align: center; letter-spacing: .02em; }
  .mcell { min-height: 60px; padding: 6px 3px; align-items: center; border-radius: var(--rad-sm); }
  .mcell .dn { flex-direction: column; gap: 3px; font-size: 15px; }
  .mcell .total { padding: 0 6px; font-size: 11px; }
  .slot, .mini, .rokdots, .opts, .ot, .cw { display: none !important; }
  .pchip { font-size: 0; padding: 0; height: 6px; width: 70%; border-radius: 3px; }
  .mcell .dn { width: 100%; align-items: center; }
}
.rokdots { display: flex; gap: 4px; margin-top: auto; }
.rokdots i { width: 8px; height: 8px; border-radius: 3px; background: var(--c); }

/* ---------- godina ---------- */
.year { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.ym { background: var(--tile); border-radius: var(--rad-lg); padding: 14px; }
.ym h3 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
.ym h3 span { font-family: var(--f-body); font-weight: 600; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ym h3 button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; }
.ym h3 button:hover { color: var(--brand-fg); }
.ygrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.ygrid .h { font-size: 10.5px; font-weight: 600; color: var(--ink-3); text-align: center; padding-bottom: 3px; }
.yd { aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 0; padding: 0; font-size: 11.5px; display: grid; place-items: center; background: transparent; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.yd.e { background: transparent; }
.yd.has { color: var(--ink); font-weight: 600; background: color-mix(in srgb, var(--brand) var(--p), var(--surface)); }
.yd.has:hover { outline: 2px solid var(--ink); outline-offset: 0; }
.yd.has.hot { color: var(--on-brand); }
.yd.today { box-shadow: inset 0 0 0 2px var(--orange); }
.ylegend { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); padding: 14px 4px 2px; flex-wrap: wrap; }
.ylegend i { width: 16px; height: 16px; border-radius: 5px; display: inline-block; }

/* ---------- lista ---------- */
.tablewrap { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 12px 10px; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.nowrap { white-space: nowrap; }
tr.dayrow td { background: var(--tile); font-family: var(--f-head); font-weight: 500; font-size: 15px; border-bottom: 0; }
tr.dayrow td:first-child { border-radius: var(--rad-sm) 0 0 var(--rad-sm); }
tr.dayrow td:last-child { border-radius: 0 var(--rad-sm) var(--rad-sm) 0; }
tbody tr:not(.dayrow):hover td { background: var(--tile); }
.more { padding: 16px 12px 4px; text-align: center; }

/* ---------- izabrani dan ---------- */
.day-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow: auto; padding: 8px; }
@media (max-width: 1320px) { .day-panel { position: static; max-height: none; } }
.day-panel .dh { padding: 14px 14px 12px; position: sticky; top: -8px; background: var(--surface); z-index: 1; border-radius: var(--rad-lg) var(--rad-lg) 0 0; }
.day-panel h2 { font-size: 22px; margin: 0; line-height: 1.15; }
.day-panel .dsub { color: var(--ink-3); font-size: 14px; margin-top: 3px; }
.tslot { padding: 14px 14px 8px; font-size: 13px; color: var(--ink-3); display: flex; gap: 10px; align-items: center; }
.tslot b { color: var(--ink); font-family: var(--f-head); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tslot::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.subjs { display: flex; flex-direction: column; gap: 6px; }
.subj { padding: 12px 14px; background: var(--tile); border-radius: var(--rad-md); }
.subj .nm { font-weight: 600; font-size: 15px; }
.subj .vs { display: flex; flex-direction: column; gap: 5px; margin-top: 7px; }
.v { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12.5px; align-items: center; }
.tag { border-radius: 8px; padding: 2px 8px; background: var(--surface); color: var(--ink-2); white-space: nowrap; font-weight: 500; }
.tag.code { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.tag.rok { background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--ink); }
.empty { padding: 36px 20px; color: var(--ink-3); text-align: center; }
.empty strong { display: block; color: var(--ink); font-family: var(--f-head); font-weight: 500; font-size: 19px; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }

/* ---------- poruke, prazno stanje ---------- */
.banner { border-radius: var(--rad-md); padding: 12px 16px; font-size: 14px; background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow-card); }
.banner.err { background: var(--danger-soft); color: var(--danger); box-shadow: none; }
.hero-empty { padding: 56px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.hero-empty h2 { margin: 0; font-size: 26px; }
.hero-empty p { margin: 0 0 6px; color: var(--ink-2); max-width: 46ch; }

/* ---------- dijalozi ---------- */
dialog { border: 0; border-radius: var(--rad-xl); background: var(--surface); color: var(--ink); padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow-pop); }
dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.dlg header { padding: 22px 24px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dlg header h2 { margin: 0; font-size: 24px; }
.dlg .body { padding: 6px 24px 24px; overflow: auto; display: flex; flex-direction: column; gap: 18px; }
.drop { border: 2px dashed var(--line-strong); border-radius: var(--rad-lg); padding: 36px 18px; text-align: center; color: var(--ink-2); background: var(--tile); display: flex; flex-direction: column; gap: 8px; align-items: center; cursor: pointer; transition: background-color .15s, border-color .15s; }
.drop:hover, .drop.over { border-color: var(--brand-line); background: var(--brand-soft); }
.drop .ic { width: 50px; height: 50px; border-radius: var(--rad-md); background: var(--brand); color: var(--on-brand); display: grid; place-items: center; box-shadow: var(--shadow-btn); margin-bottom: 6px; }
.drop strong { color: var(--ink); font-family: var(--f-head); font-weight: 500; font-size: 18px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.field select, .field input { height: 44px; border: 1px solid transparent; background: var(--tile); border-radius: var(--rad-sm); padding: 0 12px; font-size: 15px; color: var(--ink); }
.field select:focus, .field input:focus { outline: none; border-color: var(--brand-line); background: var(--surface); box-shadow: 0 0 0 3px var(--brand-soft); }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; font-size: 13px; color: var(--ink-3); }
.stat > div { background: var(--tile); border-radius: var(--rad-md); padding: 12px 14px; }
.stat b { font-family: var(--f-head); font-weight: 500; font-size: 24px; color: var(--ink); display: block; line-height: 1.2; }
.preview { max-height: 220px; overflow: auto; background: var(--tile); border-radius: var(--rad-md); padding: 4px 6px; }
.preview table { font-size: 13px; }
.preview th { background: var(--tile); }
.preview td { border-bottom-color: var(--line); }
details summary { cursor: pointer; }
.warn { color: var(--danger); font-size: 14px; }
.doclist { display: flex; flex-direction: column; gap: 8px; }
.doc { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--tile); border-radius: var(--rad-lg); flex-wrap: wrap; }
.doc .sw { width: 14px; height: 14px; border-radius: 5px; background: var(--c); flex: none; }
.doc .info { flex: 1; min-width: 180px; }
.doc .info b { font-family: var(--f-head); font-weight: 500; font-size: 17px; }
.doc .info div { font-size: 13px; color: var(--ink-3); }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
h3.sec { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 0; font-family: var(--f-body); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--tile-hover); border-top-color: var(--brand); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-fg); padding: 13px 20px; border-radius: var(--rad-md); font-size: 14px; font-weight: 500; z-index: 50; width: max-content; max-width: calc(100vw - 32px); box-shadow: var(--shadow-pop); }
@media (prefers-reduced-motion: reduce) { *, .spinner { animation: none !important; transition: none !important; } }
@media (max-width: 600px) {
  header.top h1 { font-size: 24px; }
  .logo { width: 40px; height: 40px; }
  .btn { padding: 8px 14px; min-height: 40px; }
  .iconbtn { width: 40px; height: 40px; }
  .period { font-size: 22px; flex-basis: 100%; margin-left: 0; }
}

/* ================= Planer ================= */
:root { --warn: #c26a00; --warn-soft: #fff3e0; --bad: #d93a2f; --bad-soft: #fdecea; --ok: #12924f; --ok-soft: #e6f6ed; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --warn: #f5b04a; --warn-soft: rgb(245 176 74 / .13); --bad: #ff7b6e; --bad-soft: rgb(255 123 110 / .14); --ok: #4fd18b; --ok-soft: rgb(79 209 139 / .13); } }
:root[data-theme="dark"] { --warn: #f5b04a; --warn-soft: rgb(245 176 74 / .13); --bad: #ff7b6e; --bad-soft: rgb(255 123 110 / .14); --ok: #4fd18b; --ok-soft: rgb(79 209 139 / .13); }

/* profil u bočnom meniju */
.side { display: flex; flex-direction: column; gap: 14px; }
.profile { background: var(--tile); border-radius: var(--rad-lg); padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px; }
.profile .pi { flex: 1; min-width: 0; }
.iconbtn.sm { width: 36px; height: 36px; border-radius: var(--rad-sm); }
.profile { padding: 12px; gap: 10px; }
.profile .pt { font-family: var(--f-head); font-weight: 500; font-size: 17px; line-height: 1.2; }
.profile .ps { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.seg.sm { padding: 3px; box-shadow: none; background: var(--tile); width: 100%; }
.seg.sm button { flex: 1 1 auto; min-height: 32px; padding: 4px 8px; font-size: 13px; white-space: nowrap; }
.seg.sm button .n { font-family: var(--f-body); font-size: 12px; opacity: .6; margin-left: 3px; }
.mylist { display: flex; flex-direction: column; gap: 4px; margin: 0 -6px; }
.mi { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; padding: 9px 10px; border-radius: var(--rad-sm); color: var(--ink); transition: background-color .15s; }
.mi:hover { background: var(--tile); }
.mi.on { background: var(--brand-soft); border-color: var(--brand-line); }
.mi .st { width: 10px; height: 10px; border-radius: 4px; margin-top: 5px; flex: none; background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.mi .st.planned { background: var(--brand); box-shadow: none; }
.mi .st.minor { background: var(--warn); box-shadow: none; }
.mi .st.major { background: var(--bad); box-shadow: none; }
.mi .mt { flex: 1; min-width: 0; }
.mi .mn { display: block; font-weight: 500; font-size: 14.5px; line-height: 1.3; }
.mi .mm { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
.mi .mm b { color: var(--ink-2); font-weight: 600; }
.semhead { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 10px 10px 2px; }
.muted { color: var(--ink-3); font-size: 13.5px; }
.linkbtn { border: 0; background: none; color: var(--brand-fg); font-weight: 600; font-size: 13.5px; padding: 4px 6px; border-radius: 8px; }
.linkbtn:hover { background: var(--brand-soft); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; transition: background-color .15s; flex: none; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .15s; }
.switch input:checked { background: var(--brand); }
.switch input:checked::after { transform: translateX(16px); }

/* pill oznake stanja */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.major { background: var(--bad-soft); color: var(--bad); }
.pill.minor { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.planned { background: var(--brand-soft); color: var(--brand-fg); }
.pill.none { background: var(--tile); color: var(--ink-3); }

/* traka za biranje termina */
.pickbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--brand-soft); border: 1px solid var(--brand-line); border-radius: var(--rad-lg); padding: 10px 10px 10px 16px; }
.pickbar .pk { flex: 1; min-width: 200px; font-size: 14px; color: var(--ink-2); }
.pickbar .pk b { color: var(--ink); font-family: var(--f-head); font-weight: 500; font-size: 16px; }

/* kalendar: moj plan i biranje */
.pchip { font-size: 12px; line-height: 1.25; border-radius: 8px; padding: 3px 7px; background: var(--brand); color: var(--on-brand); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-weight: 500; word-break: break-word; }
.pchip b { font-weight: 700; }
.mcell.sel .pchip:not(.minor):not(.major) { background: rgb(255 255 255 / .2); }
.mcell.sel .opts { color: var(--on-brand); opacity: .8; }
.pchip.minor { background: var(--warn); color: #fff; }
.pchip.major { background: var(--bad); color: #fff; }
.opts { font-size: 12.5px; color: var(--ink-3); margin-top: auto; }
.mcell.mine-has { background: var(--tile); }
.mcell.dim { opacity: .38; }
.mcell.opt { background: var(--surface); border: 2px solid var(--brand); cursor: pointer; }
.mcell.opt:hover { background: var(--brand-soft); }
.mcell.opt.major-c { border-color: var(--bad); }
.mcell.opt.minor-c { border-color: var(--warn); }
.mcell .ot { font-size: 13px; font-weight: 600; color: var(--brand-fg); font-variant-numeric: tabular-nums; }
.mcell .cw { font-size: 11.5px; font-weight: 600; line-height: 1.25; }
.mcell .cw.major { color: var(--bad); }
.mcell .cw.minor { color: var(--warn); }
.mcell.sel.opt { border-color: var(--brand); }
.yd.planned { box-shadow: inset 0 0 0 2px var(--brand); color: var(--ink); font-weight: 700; }
.yd.planned.cmajor { box-shadow: inset 0 0 0 2px var(--bad); }

/* pregled plana */
.planv { display: flex; flex-direction: column; gap: 18px; padding: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 700px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat2 { background: var(--tile); border-radius: var(--rad-md); padding: 12px 14px; font-size: 13px; color: var(--ink-3); }
.stat2 b { display: block; font-family: var(--f-head); font-weight: 500; font-size: 28px; line-height: 1.15; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat2.bad b { color: var(--bad); }
.nextcard { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--brand); color: var(--on-brand); border-radius: var(--rad-lg); padding: 16px 18px; box-shadow: var(--shadow-btn); }
.nextcard .nl { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; opacity: .75; }
.nextcard .nn { font-family: var(--f-head); font-weight: 500; font-size: 21px; line-height: 1.2; }
.nextcard .nd { font-size: 14px; opacity: .85; }
.nextcard .cd { margin-left: auto; text-align: right; font-family: var(--f-head); font-weight: 500; font-size: 30px; line-height: 1; }
.nextcard .cd small { display: block; font-family: var(--f-body); font-size: 12.5px; font-weight: 500; opacity: .8; margin-top: 4px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sechead h3 { margin: 0; font-size: 19px; }
.timeline { display: flex; flex-direction: column; }
.titem { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px; border-radius: var(--rad-md); }
.titem:hover { background: var(--tile); }
.dbadge { width: 64px; height: 64px; border-radius: var(--rad-md); background: var(--tile); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.titem:hover .dbadge { background: var(--surface); }
.dbadge b { font-family: var(--f-head); font-weight: 500; font-size: 24px; }
.dbadge span { font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.dbadge.minor { background: var(--warn-soft); } .dbadge.major { background: var(--bad-soft); }
.dbadge.past { opacity: .5; }
.tinfo { min-width: 0; }
.tinfo .tn { font-weight: 600; font-size: 15.5px; }
.tinfo .tm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 5px; font-size: 13px; color: var(--ink-3); }
.tact { display: flex; gap: 6px; }
.gap { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 41px; font-size: 12.5px; color: var(--ink-3); height: 22px; }
.gap::before { content: ""; width: 2px; height: 100%; background: var(--line); border-radius: 2px; }
.gap.tight { color: var(--warn); font-weight: 600; }
.ucards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.ucard { background: var(--tile); border-radius: var(--rad-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ucard .un { font-weight: 600; line-height: 1.3; }
.ucard .um { font-size: 13px; color: var(--ink-3); }
.ucard .btn { align-self: flex-start; }

/* panel dana: redovi sa akcijom */
.xrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--tile); border-radius: var(--rad-md); }
.xrow .xi { flex: 1; min-width: 0; }
.xrow .xn { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.xrow .xm { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; align-items: center; }
.xrow.mine { background: var(--brand-soft); }
.xrow.major { box-shadow: inset 3px 0 0 var(--bad); } .xrow.minor { box-shadow: inset 3px 0 0 var(--warn); }
.xrow .note { font-size: 12.5px; margin-top: 4px; }
.note.major { color: var(--bad); } .note.minor { color: var(--warn); }
.dsec { padding: 6px 6px 2px; display: flex; flex-direction: column; gap: 6px; }
.dsec h4 { margin: 8px 8px 2px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

/* čarobnjak */
#setupDlg { width: min(860px, calc(100vw - 24px)); }
.wiz { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.wiz-top { padding: 20px 24px 6px; display: flex; flex-direction: column; gap: 16px; }
.wiz-top .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wiz-top .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.stepper { display: flex; gap: 6px; }
.stepper button { flex: 1; border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 7px; text-align: left; color: var(--ink-3); font-size: 12.5px; font-weight: 600; cursor: default; }
.stepper button i { display: block; height: 5px; border-radius: 3px; background: var(--tile-hover); }
.stepper button.done { color: var(--ink-2); cursor: pointer; }
.stepper button.done i { background: var(--brand); opacity: .45; }
.stepper button.cur { color: var(--ink); }
.stepper button.cur i { background: var(--brand); }
@media (max-width: 600px) { .stepper button span { display: none; } }
.wiz-body { padding: 14px 24px 8px; overflow: auto; display: flex; flex-direction: column; gap: 16px; min-height: 280px; }
.wiz-body h2 { margin: 0; font-size: 28px; line-height: 1.15; }
.wiz-body .lead { margin: -6px 0 0; color: var(--ink-2); max-width: 60ch; }
.wiz-foot { padding: 14px 24px 22px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
.wiz-foot .grow { flex: 1; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.choice { text-align: left; border: 2px solid transparent; background: var(--tile); color: var(--ink); border-radius: var(--rad-lg); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 6px; min-height: 112px; transition: background-color .15s, border-color .15s, transform .15s; }
.choice:hover { background: var(--tile-hover); }
.choice:active { transform: translateY(1px); }
.choice[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.choice .cb { font-family: var(--f-head); font-weight: 500; font-size: 24px; line-height: 1.1; }
.choice .cs { font-size: 13.5px; color: var(--ink-2); }
.choice .cx { font-size: 12.5px; color: var(--ink-3); margin-top: auto; line-height: 1.35; }
.choice .ck { align-self: flex-end; margin-top: -4px; width: 22px; height: 22px; border-radius: 8px; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); visibility: hidden; }
.choice[aria-pressed="true"] .ck { visibility: visible; }
.choices.big .choice { min-height: 150px; }
.choices.big .choice .cb { font-size: 26px; }
.picktools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.picktools .search { flex: 1; min-width: 200px; }
.picktools .count { font-family: var(--f-head); font-weight: 500; font-size: 16px; margin-left: auto; }
.semgroup { display: flex; flex-direction: column; gap: 4px; }
.semgroup .sh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px 2px; }
.semgroup .sh b { font-family: var(--f-head); font-weight: 500; font-size: 16px; }
.semgroup .sh span { font-size: 13px; color: var(--ink-3); margin-left: 6px; }
.subjgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px; }
.sopt { display: flex; align-items: flex-start; gap: 10px; text-align: left; border: 1px solid transparent; background: var(--tile); color: var(--ink); border-radius: var(--rad-sm); padding: 10px 12px; transition: background-color .15s, border-color .15s; }
.sopt:hover { background: var(--tile-hover); }
.sopt[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand-line); }
.sopt .box { width: 20px; height: 20px; border-radius: 7px; flex: none; margin-top: 1px; box-shadow: inset 0 0 0 1.5px var(--line-strong); display: grid; place-items: center; color: transparent; background: var(--surface); }
.sopt[aria-pressed="true"] .box { background: var(--brand); box-shadow: none; color: var(--on-brand); }
.sopt .sn2 { font-weight: 500; font-size: 14px; line-height: 1.3; }
.sopt .sm2 { font-size: 12px; color: var(--ink-3); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.sumgrid > div { background: var(--tile); border-radius: var(--rad-md); padding: 12px 14px; font-size: 13px; color: var(--ink-3); }
.sumgrid b { display: block; font-family: var(--f-head); font-weight: 500; font-size: 20px; color: var(--ink); line-height: 1.25; }
.hint { display: flex; gap: 10px; align-items: flex-start; background: var(--tile); border-radius: var(--rad-md); padding: 12px 14px; font-size: 13.5px; color: var(--ink-2); }
.hint svg { flex: none; margin-top: 1px; color: var(--brand-fg); }

/* konflikt dijalog */
#conflictDlg { width: min(480px, calc(100vw - 32px)); }
.cfx { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.cfx .ic { width: 48px; height: 48px; border-radius: var(--rad-md); background: var(--bad-soft); color: var(--bad); display: grid; place-items: center; }
.cfx h2 { margin: 0; font-size: 22px; }
.cfx p { margin: 0; color: var(--ink-2); }
.cfx .xrow { background: var(--tile); }
.cfx .xrow .btn { flex: none; }
.cfx .ic.minor { background: var(--warn-soft); color: var(--warn); }
.cfx .ic.ok { background: var(--brand-soft); color: var(--brand-fg); }
.ccard { display: flex; gap: 14px; align-items: center; background: var(--tile); border-radius: var(--rad-lg); padding: 12px; }
.cdate { width: 62px; height: 66px; flex: none; border-radius: var(--rad-md); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.cdate b { font-family: var(--f-head); font-weight: 500; font-size: 26px; }
.cdate span { font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.ccard .xn { font-weight: 600; font-size: 16px; }

<script>
(() => {
// ================= Konstante i pomoćne funkcije =================
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const NIVO_NAZIV = { OAS: 'Osnovne akademske studije', MAS: 'Master akademske studije', DAS: 'Doktorske akademske studije', OSS: 'Osnovne strukovne studije', MSS: 'Master strukovne studije', SAS: 'Specijalističke akademske studije' };
const DANI = ['Pon', 'Uto', 'Sre', 'Čet', 'Pet', 'Sub', 'Ned'];
const DANI_PUNO = ['nedelja', 'ponedeljak', 'utorak', 'sreda', 'četvrtak', 'petak', 'subota'];
const DANI_KRATKO = ['ned', 'pon', 'uto', 'sre', 'čet', 'pet', 'sub'];
const MESECI = ['januar', 'februar', 'mart', 'april', 'maj', 'jun', 'jul', 'avgust', 'septembar', 'oktobar', 'novembar', 'decembar'];
const MES_KRATKO = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'avg', 'sep', 'okt', 'nov', 'dec'];
const ROK_COLORS = ['var(--r1)', 'var(--r2)', 'var(--r3)', 'var(--r4)', 'var(--r5)', 'var(--r6)'];
const CHUNK = 600;
const LS_KEY = 'raspored-ispita:v1';
const LS_UI = 'raspored-ispita:ui';
const LS_ME = 'raspored-ispita:profil';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayIso = iso(new Date());
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDay = s => { const d = parseIso(s); return `${DANI_PUNO[d.getDay()]}, ${d.getDate()}. ${MESECI[d.getMonth()]} ${d.getFullYear()}.`; };
const fmtShort = s => { const d = parseIso(s); return `${DANI_KRATKO[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`; };
const daysBetween = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 86400000);
const num = (n, one, few, many) => { const a = n % 10, b = n % 100; return `${n} ${a === 1 && b !== 11 ? one : (a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many)}`; };
const ispita = n => num(n, 'ispit', 'ispita', 'ispita');
const termina = n => num(n, 'termin', 'termina', 'termina');
const dana = n => num(n, 'dan', 'dana', 'dana');
const uniq = arr => [...new Set(arr)];
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
const ICON_CHECK = '{{i:check:14}}';
const ICON_X = '{{i:close:18}}';

function toast(msg, action) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  const sp = document.createElement('span'); sp.textContent = msg; t.appendChild(sp);
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.addEventListener('click', () => { t.remove(); action.fn(); }); t.appendChild(b); }
  document.body.appendChild(t);
  setTimeout(() => t.remove(), action ? 7000 : 3400);
}
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
}

// ================= Tema =================
const THEME_KEY = 'raspored-ispita:theme';
const THEME_ICONS = {
  auto: '{{i:monitor:20}}',
  light: '{{i:sun-2:20}}',
  dark: '{{i:moon:20}}'
};
const THEME_LABEL = { auto: 'Tema: prati sistem', light: 'Tema: svetla', dark: 'Tema: tamna' };
const hostTheme = document.documentElement.getAttribute('data-theme');
let theme = lsGet(THEME_KEY) || 'auto';
function applyTheme() {
  const root = document.documentElement;
  if (theme === 'auto') { if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', theme);
  const b = $('#themeBtn'); b.innerHTML = THEME_ICONS[theme]; b.title = THEME_LABEL[theme]; b.setAttribute('aria-label', THEME_LABEL[theme] + ' (promeni)');
}
$('#themeBtn').addEventListener('click', () => {
  theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme];
  lsSet(THEME_KEY, theme); applyTheme(); toast(THEME_LABEL[theme]);
});
applyTheme();

// ================= Skladište rokova (deljeno) =================
// U artifaktu: baza (rokovi/{id} = metapodaci, ispiti/{id}__{n} = delovi sa redovima). Van njega: localStorage.
const Store = {
  mode: 'memory', db: null, mem: {},
  async init() {
    try { if (window.claude && typeof window.claude.use === 'function') this.db = await window.claude.use('db'); } catch { this.db = null; }
    if (this.db) this.mode = 'db';
    else { this.mode = lsSet('raspored-ispita:test', '1') ? 'local' : 'memory'; }
  },
  async loadAll() {
    if (this.mode === 'db') {
      const [rs, cs] = await withTimeout(Promise.all([
        this.db.collection('rokovi').get(),
        this.db.collection('ispiti').limit(1000).get()
      ]), 12000);
      const byRok = {};
      for (const d of cs.docs) { const v = d.data(); (byRok[v.rokId] = byRok[v.rokId] || []).push(v); }
      const out = [];
      for (const d of rs.docs) {
        const meta = d.data();
        const parts = (byRok[meta.id] || []).filter(p => p.idx < meta.chunks).sort((a, b) => a.idx - b.idx);
        if (parts.length !== meta.chunks) continue; // nepotpun upis
        out.push({ meta, rows: parts.flatMap(p => p.rows) });
      }
      return out;
    }
    if (this.mode === 'local') {
      try { this.mem = JSON.parse(lsGet(LS_KEY) || '{}') || {}; } catch { this.mem = {}; }
    }
    return Object.values(this.mem);
  },
  async saveRok(meta, rows, oldChunks) {
    if (this.mode === 'db') {
      const n = Math.ceil(rows.length / CHUNK);
      for (let i = 0; i < n; i++) {
        await this.db.doc(`ispiti/${meta.id}__${i}`).set({ rokId: meta.id, idx: i, rows: rows.slice(i * CHUNK, (i + 1) * CHUNK) });
      }
      for (let i = n; i < (oldChunks || 0); i++) await this.db.doc(`ispiti/${meta.id}__${i}`).delete();
      await this.db.doc(`rokovi/${meta.id}`).set({ ...meta, chunks: n });
      return;
    }
    this.mem[meta.id] = { meta, rows };
    if (this.mode === 'local' && !lsSet(LS_KEY, JSON.stringify(this.mem))) throw { code: 'local_full' };
  },
  async deleteRok(meta) {
    if (this.mode === 'db') {
      await this.db.doc(`rokovi/${meta.id}`).delete();
      for (let i = 0; i < (meta.chunks || 0); i++) await this.db.doc(`ispiti/${meta.id}__${i}`).delete();
      return;
    }
    delete this.mem[meta.id];
    if (this.mode === 'local') lsSet(LS_KEY, JSON.stringify(this.mem));
  }
};

// ================= Moj profil i plan (privatno) =================
// Baza: data/users/<id>/profile — vidi samo taj korisnik. Bez naloga: localStorage.
// { nivo, akred, godina, modul, remaining: {sifra: {n: naziv, s: semestar}}, plan: {sifra: {rokId, datum, vreme}}, onboarded }
const Me = {
  mode: 'memory', db: null, uid: null, data: null, timer: 0, saving: false, dirty: false,
  async init(db) {
    this.db = db;
    if (db) { try { const u = await window.claude.use('user'); this.uid = u ? await u.id() : null; } catch { this.uid = null; } }
    this.mode = db && this.uid ? 'db' : (lsSet('raspored-ispita:test', '1') ? 'local' : 'memory');
  },
  ref() { return this.db.doc(`data/users/${this.uid}/profile`); },
  async load() {
    if (this.mode === 'db') {
      const s = await withTimeout(this.ref().get(), 10000); this.data = s.exists ? JSON.parse(JSON.stringify(s.data())) : null;
      if (!this.data) { try { const local = JSON.parse(lsGet(LS_ME) || 'null'); if (local && local.onboarded) { this.data = local; this.save(); try { localStorage.removeItem(LS_ME); } catch {} } } catch {} } // gost → nalog (jednom)
    }
    else if (this.mode === 'local') { try { this.data = JSON.parse(lsGet(LS_ME) || 'null'); } catch { this.data = null; } }
    if (this.data) { this.data.remaining = this.data.remaining || {}; this.data.plan = this.data.plan || {}; this.data.friends = this.data.friends || []; this.data.ignored = this.data.ignored || []; }
    return this.data;
  },
  save() { this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 350); },
  async flush() {
    if (this.saving || !this.dirty || !this.data) return;
    this.saving = true; this.dirty = false;
    const body = JSON.parse(JSON.stringify({ ...this.data, updatedAt: new Date().toISOString() }));
    try {
      if (this.mode === 'db') { await this.ref().set(body); if (body.onboarded) await this.db.doc(`people/${this.uid}`).set(publicBody(body)); }
      else if (this.mode === 'local') lsSet(LS_ME, JSON.stringify(body));
    } catch (e) { toast('Plan trenutno nije sačuvan. Proveri vezu, izmene ostaju dok je stranica otvorena.'); }
    this.saving = false;
    if (this.dirty) this.flush();
  }
};
const prof = () => Me.data;
const HOSTED = !!window.__auth;
const NEED = {
  friendsTitle: HOSTED ? 'Prijatelji traže nalog' : 'Prijatelji rade na claude.ai',
  friendsText: HOSTED ? (window.__auth.mode === 'user' ? 'Prvo podesi svoj profil.' : 'Prijavi se ili napravi nalog (i potvrdi email) da bi dodao/la prijatelje i video/la njihove ispite.') : 'Otvori aplikaciju na claude.ai sa svojim nalogom da bi dodao/la prijatelje i video/la njihove ispite.',
  chatTitle: HOSTED ? 'Poruke traže nalog' : 'Poruke rade na claude.ai',
  chatText: HOSTED ? 'Prijavi se ili napravi nalog (i potvrdi email) da bi slao/la poruke prijateljima i grupama.' : 'Otvori aplikaciju na claude.ai sa svojim nalogom da bi slao/la poruke prijateljima.',
  banner: HOSTED ? 'Prijatelji i poruke rade samo sa prijavljenim nalogom. Kao gost, plan se čuva samo na ovom uređaju.' : 'Prijatelji rade samo kad je aplikacija otvorena na claude.ai, sa nalogom. Ovde se sve čuva samo u ovom pregledaču.',
  share: HOSTED ? 'Pošalji kolegama link do aplikacije, pa će se pojaviti ovde kad naprave nalog.' : 'Podeli link sa kolegama (Share meni na claude.ai), pa će se pojaviti ovde.',
  loginBtn: HOSTED && window.__auth.mode !== 'user' ? '<div><button class="btn primary" data-auth="login">Prijavi se</button></div>' : ''
};

// ================= Stanje =================
const S = {
  rokovi: [], exams: [], rokColor: {},
  f: { q: '', rok: new Set() },
  scope: 'moji', view: 'plan', y: new Date().getFullYear(), m: new Date().getMonth(), selDay: null,
  pick: null, tab: 'todo', listLimit: 300, loaded: false, showFriends: true
};
try {
  const ui = JSON.parse(lsGet(LS_UI) || '{}');
  if (['plan', 'mesec', 'godina', 'lista'].includes(ui.view)) S.view = ui.view;
  if (['moji', 'svi'].includes(ui.scope)) S.scope = ui.scope;
  if (ui.showFriends === false) S.showFriends = false;
} catch {}
const saveUi = () => lsSet(LS_UI, JSON.stringify({ view: S.view, scope: S.scope, showFriends: S.showFriends }));

function rebuild() {
  S.rokovi.sort((a, b) => (a.meta.od || '').localeCompare(b.meta.od || ''));
  S.rokColor = {};
  S.rokovi.forEach((r, i) => { S.rokColor[r.meta.id] = ROK_COLORS[i % ROK_COLORS.length]; });
  const ex = [];
  for (const { meta, rows } of S.rokovi) {
    rows.forEach((r, i) => {
      ex.push({ id: meta.id + ':' + i, rokId: meta.id, nivo: r[0], akred: r[1], sem: r[2], modul: r[3], sifra: r[4], predmet: r[5], datum: r[6], vreme: r[7], key: fold(r[5] + ' ' + r[4]) });
    });
  }
  ex.sort((a, b) => a.datum.localeCompare(b.datum) || a.vreme.localeCompare(b.vreme) || a.predmet.localeCompare(b.predmet, 'sr'));
  S.exams = ex;
  for (const v of [...S.f.rok]) if (!S.rokovi.some(r => r.meta.id === v)) S.f.rok.delete(v);
}
const rokName = id => { const r = S.rokovi.find(r => r.meta.id === id); return r ? `${rokLabel(r.meta.rok)} ${r.meta.godina}` : id; };
const rokShort = id => { const r = S.rokovi.find(r => r.meta.id === id); return r ? rokLabel(r.meta.rok) : 'nepoznat rok'; };
const rokTag = id => `<span class="tag rok" style="--c:${S.rokColor[id] || 'var(--ink-3)'}">${esc(rokShort(id))}</span>`;

// ---- katalog predmeta za profil ----
// obavezni: …O01; izborni: …A01, …B01…; završni/praksa: …8ZR, …8SP
function subjType(code) {
  const c = code[code.length - 3];
  if (/\d/.test(c) && /[A-Z]{2}$/.test(code)) return 'Z';
  return c === 'O' || /\d/.test(c) ? 'O' : 'I';
}
const TIP_NAZIV = { O: 'obavezni', I: 'izborni', Z: 'završni' };
function inProfile(e, d) {
  return e.nivo === d.nivo && e.akred == d.akred && e.sem <= d.godina * 2 && (e.modul === 'SVI' || e.modul === d.modul);
}
function buildCatalog(d) {
  const m = new Map();
  if (!d || !d.nivo || !d.akred || !d.godina) return m;
  for (const e of S.exams) {
    if (!inProfile(e, d)) continue;
    let s = m.get(e.sifra);
    if (!s) { s = { sifra: e.sifra, predmet: e.predmet, sem: e.sem, modul: e.modul, tip: subjType(e.sifra), inst: [] }; m.set(e.sifra, s); }
    if (!s.inst.some(i => i.rokId === e.rokId)) s.inst.push(e);
  }
  return m;
}

// ---- moji ispiti: plan + konflikti ----
let CAT = new Map(), MY = [], MYMAP = new Map(), MYEX = new Set();
function derive() {
  const p = prof();
  CAT = buildCatalog(p);
  MY = []; MYMAP = new Map(); MYEX = new Set();
  if (!p) return;
  let changed = false;
  for (const [sifra, info] of Object.entries(p.remaining)) {
    const c = CAT.get(sifra), inst = c ? c.inst : [];
    let pl = p.plan[sifra] || null, ex = null, stale = false;
    if (pl) {
      ex = inst.find(i => i.rokId === pl.rokId) || null;
      if (!ex) stale = true;
      else if (ex.datum !== pl.datum || ex.vreme !== pl.vreme) { pl.datum = ex.datum; pl.vreme = ex.vreme; changed = true; }
    }
    const s = { sifra, predmet: c ? c.predmet : info.n, sem: c ? c.sem : info.s, tip: c ? c.tip : subjType(sifra), inst, plan: ex ? pl : null, exam: ex, stale, conf: null, confWith: [] };
    MY.push(s); MYMAP.set(sifra, s); inst.forEach(i => MYEX.add(i.id));
  }
  if (changed) Me.save();
  const byDate = {};
  for (const s of MY) if (s.plan) (byDate[s.plan.datum] = byDate[s.plan.datum] || []).push(s);
  for (const s of MY) {
    if (!s.plan) continue;
    for (const o of byDate[s.plan.datum]) {
      if (o === s) continue;
      const lvl = o.plan.vreme === s.plan.vreme ? 'major' : 'minor';
      s.confWith.push({ s: o, lvl });
      if (lvl === 'major') s.conf = 'major'; else if (!s.conf) s.conf = 'minor';
    }
  }
  MY.sort((a, b) => a.sem - b.sem || a.predmet.localeCompare(b.predmet, 'sr'));
}
function conflictsFor(inst, exclude) {
  return MY.filter(s => s.plan && s.sifra !== exclude && s.plan.datum === inst.datum)
    .map(s => ({ s, lvl: s.plan.vreme === inst.vreme ? 'major' : 'minor' }))
    .sort((a, b) => (a.lvl === 'major' ? -1 : 1) - (b.lvl === 'major' ? -1 : 1));
}
function conflictText(list) {
  if (!list.length) return '';
  const mj = list.filter(c => c.lvl === 'major'), mn = list.filter(c => c.lvl === 'minor');
  if (mj.length) return `Isto vreme kao ${mj.map(c => c.s.predmet).join(', ')}`;
  return `Isti dan kao ${mn.map(c => `${c.s.predmet} (${c.s.plan.vreme})`).join(', ')}`;
}

// ---- filtriranje kalendara ----
function matchesQ(e) {
  if (!S.f.q) return true;
  const words = fold(S.f.q).split(/\s+/).filter(Boolean);
  for (const w of words) if (!e.key.includes(w)) return false;
  return true;
}
function baseExams() {
  const mine = S.scope === 'moji' && prof();
  return S.exams.filter(e => (!mine || MYEX.has(e.id)) && (!S.f.rok.size || S.f.rok.has(e.rokId)));
}
let FILTERED = [];
function applyFilters() { FILTERED = baseExams().filter(matchesQ); }

let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); renderSugg(); qTimer = setTimeout(() => { S.f.q = e.target.value.trim(); S.listLimit = 300; refresh(); }, 150); });
let SUGG = [], suggIdx = -1;
function highlight(name, words) {
  const chars = [...name], folded = chars.map(ch => fold(ch));
  const mark = new Array(chars.length).fill(false);
  for (const w of words) {
    for (let i = 0; i < chars.length; i++) {
      let j = i, acc = '';
      while (j < chars.length && acc.length < w.length) acc += folded[j++];
      if (acc.startsWith(w)) { for (let k = i; k < j; k++) mark[k] = true; break; }
    }
  }
  let out = '', open = false;
  chars.forEach((ch, i) => { if (mark[i] && !open) { out += '<mark>'; open = true; } if (!mark[i] && open) { out += '</mark>'; open = false; } out += esc(ch); });
  return out + (open ? '</mark>' : '');
}
function computeSugg(q) {
  const words = fold(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const by = new Map();
  for (const e of baseExams()) {
    let ok = true; for (const w of words) if (!e.key.includes(w)) { ok = false; break; }
    if (!ok) continue;
    let g = by.get(e.predmet);
    if (!g) { g = { name: e.predmet, nk: fold(e.predmet), slots: new Map(), n: 0, codeHit: false, sifre: new Set() }; by.set(e.predmet, g); }
    g.n++; g.slots.set(e.datum + ' ' + e.vreme, true); g.sifre.add(e.sifra);
    if (!words.every(w => g.nk.includes(w))) g.codeHit = true;
  }
  const first = words[0];
  const score = g => (g.nk.startsWith(first) ? 0 : new RegExp('(^|\\s)' + first.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(g.nk) ? 1 : g.codeHit ? 3 : 2);
  return [...by.values()].sort((a, b) => score(a) - score(b) || a.name.localeCompare(b.name, 'sr')).slice(0, 10)
    .map(g => ({ ...g, words, slots: [...g.slots.keys()].sort(), mine: [...g.sifre].find(x => MYMAP.has(x)) }));
}
function renderSugg() {
  const inp = $('#q'), ul = $('#sugg'), q = inp.value.trim();
  SUGG = q ? computeSugg(q) : []; suggIdx = -1;
  if (!q || document.activeElement !== inp) { ul.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
  ul.innerHTML = SUGG.length ? SUGG.map((g, i) => {
    const sl = g.slots, when = sl.length === 1 ? `${fmtShort(sl[0].slice(0, 10))} ${sl[0].slice(11)}` : `${termina(sl.length)} · prvi ${fmtShort(sl[0].slice(0, 10))} ${sl[0].slice(11)}`;
    const ms = g.mine ? MYMAP.get(g.mine) : null;
    const st = ms ? (ms.plan ? ` · zakazan ${fmtShort(ms.plan.datum)}` : ' · moj ispit') : '';
    return `<li role="option" id="sg${i}" data-i="${i}" aria-selected="false"><span class="sn">${highlight(g.name, g.words)}</span><span class="sm">${when}${st}</span></li>`;
  }).join('') : '<li class="none">Nema predmeta koji odgovaraju</li>';
  ul.hidden = false; inp.setAttribute('aria-expanded', 'true');
}
function moveSugg(d) {
  if (!SUGG.length) return;
  suggIdx = (suggIdx + d + SUGG.length) % SUGG.length;
  document.querySelectorAll('#sugg li[data-i]').forEach(li => li.setAttribute('aria-selected', +li.dataset.i === suggIdx));
  const cur = $('#sg' + suggIdx); if (cur) { cur.scrollIntoView({ block: 'nearest' }); $('#q').setAttribute('aria-activedescendant', 'sg' + suggIdx); }
}
function closeSugg() { $('#sugg').hidden = true; $('#q').setAttribute('aria-expanded', 'false'); $('#q').removeAttribute('aria-activedescendant'); }
function pickSugg(i) {
  const g = SUGG[i]; if (!g) return;
  closeSugg(); clearTimeout(qTimer);
  if (g.mine) { $('#q').value = ''; S.f.q = ''; startPick(g.mine); return; }
  $('#q').value = g.name; S.f.q = g.name; S.listLimit = 300;
  const d0 = g.slots[0].slice(0, 10), dt = parseIso(d0);
  S.selDay = d0; S.y = dt.getFullYear(); S.m = dt.getMonth(); if (S.view === 'godina' || S.view === 'plan') S.view = 'mesec';
  refresh();
}
$('#q').addEventListener('keydown', e => {
  const open = !$('#sugg').hidden;
  if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) renderSugg(); moveSugg(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSugg(-1); }
  else if (e.key === 'Enter' && open && suggIdx >= 0) { e.preventDefault(); pickSugg(suggIdx); }
  else if (e.key === 'Escape' && open) { e.preventDefault(); closeSugg(); }
});
$('#q').addEventListener('focus', renderSugg);
$('#q').addEventListener('blur', () => setTimeout(closeSugg, 120));
$('#sugg').addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); pickSugg(+li.dataset.i); } });

function startPick(sifra) {
  const s = MYMAP.get(sifra); if (!s) return;
  S.pick = sifra;
  if (S.view !== 'mesec' && S.view !== 'godina') S.view = 'mesec';
  const target = (s.plan && s.plan.datum) || (s.inst.find(i => i.datum >= todayIso) || s.inst[0] || {}).datum;
  if (target) { const d = parseIso(target); S.y = d.getFullYear(); S.m = d.getMonth(); S.selDay = target; }
  refresh();
  if (window.matchMedia('(max-width: 860px)').matches) $('#pickArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function cancelPick() { S.pick = null; refresh(); }
let pendingConfirm = null;
// svako zakazivanje ide preko potvrde (sa pregledom konflikata)
function schedule(sifra, inst, confirmed) {
  const s = MYMAP.get(sifra), p = prof(); if (!s || !p) return;
  if (!confirmed) { openConfirm(sifra, inst); return; }
  const cs = conflictsFor(inst, sifra), major = cs.filter(c => c.lvl === 'major'), minor = cs.filter(c => c.lvl === 'minor');
  const prev = p.plan[sifra] ? { ...p.plan[sifra] } : null;
  p.plan[sifra] = { rokId: inst.rokId, datum: inst.datum, vreme: inst.vreme };
  Me.save(); S.pick = null; S.selDay = inst.datum; derive(); refresh();
  const undo = { label: 'Poništi', fn: () => { if (prev) p.plan[sifra] = prev; else delete p.plan[sifra]; Me.save(); derive(); refresh(); } };
  if (major.length) toast(`Zakazano uprkos konfliktu: isto vreme kao ${major[0].s.predmet}.`, undo);
  else if (minor.length) toast(`Zakazano. Istog dana imaš i ${minor[0].s.predmet} u ${minor[0].s.plan.vreme}.`, undo);
  else toast(`Zakazano: ${s.predmet}, ${fmtShort(inst.datum)} u ${inst.vreme}.`, undo);
}
function unschedule(sifra) {
  const p = prof(); if (!p || !p.plan[sifra]) return;
  const prev = { ...p.plan[sifra] }, s = MYMAP.get(sifra);
  delete p.plan[sifra]; Me.save(); derive(); refresh();
  toast(`Uklonjen termin: ${s ? s.predmet : sifra}.`, { label: 'Poništi', fn: () => { p.plan[sifra] = prev; Me.save(); derive(); refresh(); } });
}
function markPassed(sifra) {
  const p = prof(); if (!p || !p.remaining[sifra]) return;
  const rem = p.remaining[sifra], pl = p.plan[sifra];
  delete p.remaining[sifra]; delete p.plan[sifra];

  toast(`${rem.n} je uklonjen sa liste. Čestitamo!`, { label: 'Poništi', fn: () => { p.remaining[sifra] = rem; if (pl) p.plan[sifra] = pl; Me.save(); derive(); refresh(); } });
}
function openConfirm(sifra, inst) {

  }
  const b = e.target.closest('[data-cfx]'); if (!b) return;
  $('#conflictDlg').close();
  if (b.dataset.cfx === 'ok' && pendingConfirm) schedule(pendingConfirm.sifra, pendingConfirm.inst, true);
  pendingConfirm = null;
});

// ================= Pogledi =================
function byDay(list, f) { const m = {}; for (const e of list) { const k = f ? f(e) : e.datum; (m[k] = m[k] || []).push(e); } return m; }
const plannedList = () => MY.filter(s => s.plan).sort((a, b) => a.plan.datum.localeCompare(b.plan.datum) || a.plan.vreme.localeCompare(b.plan.vreme));
function countdown(d) { const n = daysBetween(todayIso, d); return n === 0 ? 'danas' : n === 1 ? 'sutra' : n > 1 ? `za ${dana(n)}` : `pre ${dana(-n)}`; }
function confPill(s) {
  if (!s.conf) return '';
  return `<span class="pill ${s.conf}" title="${esc(conflictText(s.confWith))}">${s.conf === 'major' ? 'Konflikt: isto vreme' : 'Isti dan'}</span>`;
}

function renderPickBar() {
  const s = S.pick ? MYMAP.get(S.pick) : null;
  if (!s) { $('#pickArea').innerHTML = ''; return; }
  const n = s.inst.length;
  $('#pickArea').innerHTML = `<div class="pickbar"><div class="pk">Biraš termin za <b>${esc(s.predmet)}</b><br>${n ? `${termina(n)} u učitanim rokovima. Klikni na označen dan u kalendaru ili izaberi termin desno.` : 'Ovaj predmet nema termin ni u jednom učitanom roku.'}</div>${s.plan ? `<button class="btn sm" data-unplan="${esc(s.sifra)}">Ukloni termin</button>` : ''}<button class="btn sm" data-cancel-pick>Otkaži</button></div>`;
}

// ---- Plan ----
function renderPlan() {
  const p = prof();
  if (!p) {
    $('#viewArea').innerHTML = `<div class="hero-empty"><h2>Napravi svoj plan ispita</h2><p>Podesi studije, godinu i modul, označi ispite koji su ti ostali, pa im biraj termine iz učitanih rokova.</p><button class="btn primary" data-open-settings>Podesi profil</button></div>`;
    $('#period').innerHTML = 'Moj plan'; return;
  }
  const planned = plannedList(), unplanned = MY.filter(s => !s.plan);
  const nMajor = planned.filter(s => s.conf === 'major').length, nMinor = planned.filter(s => s.conf === 'minor').length;
  const next = planned.find(s => s.plan.datum >= todayIso);
  let h = '<div class="planv">';
  h += `<div class="stats">
    <div class="stat2"><b>${MY.length}</b>preostalih ispita</div>
    <div class="stat2"><b>${planned.length}</b>zakazano</div>
    <div class="stat2"><b>${unplanned.length}</b>bez termina</div>
    <div class="stat2${nMajor ? ' bad' : ''}"><b>${nMajor + nMinor}</b>${nMajor ? `${num(nMajor, 'ispit', 'ispita', 'ispita')} u istom terminu` : nMinor ? 'istog dana' : 'konflikata'}</div>
  </div>`;
  if (next) {
    h += `<div class="nextcard"><div><div class="nl">Sledeći ispit</div><div class="nn">${esc(next.predmet)}</div><div class="nd">${cap(fmtDay(next.plan.datum))} u ${next.plan.vreme} · ${esc(rokName(next.plan.rokId))}</div></div><div class="cd">${countdown(next.plan.datum).replace(/^za /, '')}<small>${daysBetween(todayIso, next.plan.datum) > 1 ? 'do ispita' : ''}</small></div></div>`;
  }
  if (!MY.length) {
    h += `<div class="empty"><strong>Lista ispita je prazna</strong>Označi ispite koji su ti ostali da bi mogao/la da ih planiraš.<br><button class="btn primary" data-open-settings="ispiti">Izaberi ispite</button></div>`;
  }
  if (planned.length) {
    h += `<div><div class="sechead"><h3>Zakazani ispiti</h3><span class="muted">${ispita(planned.length)}</span></div><div class="timeline">`;
    planned.forEach((s, i) => {
      if (i > 0) {
        const gap = daysBetween(planned[i - 1].plan.datum, s.plan.datum);
        h += `<div class="gap${gap <= 1 ? ' tight' : ''}">${gap === 0 ? 'isti dan' : gap === 1 ? 'sledeći dan' : `${dana(gap)} razmaka`}</div>`;
      }
      const d = parseIso(s.plan.datum), past = s.plan.datum < todayIso;
      h += `<div class="titem">
        <div class="dbadge ${s.conf || ''}${past ? ' past' : ''}"><span>${DANI_KRATKO[d.getDay()]}</span><b>${d.getDate()}</b><span>${MES_KRATKO[d.getMonth()]}</span></div>
        <div class="tinfo"><div class="tn">${esc(s.predmet)}</div>
          <div class="tm"><span class="mono"><b style="color:var(--ink)">${s.plan.vreme}</b></span><span>${s.sem}. sem.</span>${rokTag(s.plan.rokId)}<span>${countdown(s.plan.datum)}</span>${(() => { const fw = friendsOnTerm(s, s.plan); return fw.length ? `<span class="fwith">${avatarStack(fw, 20, 3)} sa ${esc(fw.map(f => f.ime || fullName(f)).join(', '))}</span>` : ''; })()}</div>
          ${s.conf ? `<div class="note ${s.conf}" style="font-size:12.5px;margin-top:4px;font-weight:600">${s.conf === 'major' ? 'Konflikt' : 'Upozorenje'}: ${esc(conflictText(s.confWith).replace(/^I/, 'i'))}</div>` : ''}
        </div>
        <div class="tact"><button class="btn sm" data-pick="${esc(s.sifra)}">Promeni</button><button class="iconbtn" style="width:36px;height:36px" data-unplan="${esc(s.sifra)}" aria-label="Ukloni termin" title="Ukloni termin">{{i:calendar-close:18}}</button></div>
      </div>`;
    });
    h += '</div></div>';
  }
  if (unplanned.length) {
    h += `<div><div class="sechead"><h3>Bez termina</h3><span class="muted">${ispita(unplanned.length)}</span></div><div class="ucards" style="margin-top:10px">`;
    for (const s of unplanned) {
      const n = s.inst.length;
      h += `<div class="ucard"><div class="un">${esc(s.predmet)}</div><div class="um">${s.sem}. sem. · ${TIP_NAZIV[s.tip]}${s.stale ? ' · stari termin više ne postoji' : ''}<br>${n ? termina(n) + ': ' + s.inst.slice(0, 3).map(i => fmtShort(i.datum)).join(', ') + (n > 3 ? '…' : '') : 'nema termina u učitanim rokovima'}</div>
        ${n ? `<button class="btn primary sm" data-pick="${esc(s.sifra)}">Izaberi termin</button>` : `<button class="btn sm" data-manage>Dodaj rok</button>`}</div>`;
    }
    h += '</div></div>';
  }
  h += '</div>';
  $('#viewArea').innerHTML = h;
  $('#period').innerHTML = `Moj plan<small>${planned.length} od ${MY.length} zakazano</small>`;
}

// ---- Mesec ----
function renderMonth() {
  const days = byDay(FILTERED);
  const plannedBy = byDay(MY.filter(s => s.plan), s => s.plan.datum);
  const pick = S.pick ? MYMAP.get(S.pick) : null;
  const pickBy = pick ? byDay(pick.inst) : null;
  const mine = S.scope === 'moji' && prof();
  const first = new Date(S.y, S.m, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  let h = '<div class="month"><div class="mgrid">' + DANI.map(d => `<div class="mhead">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i === 35 && d.getMonth() !== S.m) break;
    const k = iso(d), list = days[k] || [], pl = plannedBy[k] || [], out = d.getMonth() !== S.m;
    const chips = pl.slice(0, 3).map(s => `<div class="pchip ${s.conf || ''}" title="${esc(s.predmet)} · ${s.plan.vreme}${s.conf ? ' · ' + esc(conflictText(s.confWith)) : ''}"><b>${s.plan.vreme}</b> ${esc(s.predmet)}</div>`).join('') + (pl.length > 3 ? `<div class="opts">+${pl.length - 3} zakazano</div>` : '');
    const base = ['mcell', out && 'out', k === todayIso && 'today', k === S.selDay && 'sel', d.getDay() % 6 === 0 && 'weekend'];
    let inner = `<div class="dn"><span>${d.getDate()}</span>`, cls, clickable = false, attr = `data-day="${k}"`;
    if (pick) {
      const opts = pickBy[k] || [];
      if (opts.length) {
        const cs = conflictsFor(opts[0], pick.sifra), lvl = cs.length ? cs[0].lvl : '';
        cls = [...base, 'has', 'opt', lvl && lvl + '-c'];
        inner += `</div><div class="ot">${uniq(opts.map(o => o.vreme)).join(', ')}${pick.plan && pick.plan.datum === k ? ' · trenutno' : ''}</div>` + (lvl ? `<div class="cw ${lvl}">${lvl === 'major' ? 'Isto vreme' : 'Isti dan'}: ${esc(cs[0].s.predmet)}</div>` : '') + chips;
        clickable = true; attr = `data-pickday="${k}"`;
      } else {
        cls = [...base, 'dim', pl.length && 'mine-has'];
        inner += `</div>${chips}`;
      }
    } else if (mine) {
      const options = uniq(list.filter(e => { const s = MYMAP.get(e.sifra); return s && !s.plan; }).map(e => e.sifra)).length;
      cls = [...base, (pl.length || list.length) && 'has'];
      inner += `</div>${chips}` + (options ? `<div class="opts">${num(options, 'ispit za izbor', 'ispita za izbor', 'ispita za izbor')}</div>` : '');
      clickable = pl.length || list.length;
    } else {
      cls = [...base, list.length && 'has'];
      inner += `${list.length ? `<span class="total">${list.length}</span>` : ''}</div>${chips}`;
      if (list.length && !pl.length) {
        const slots = {}; for (const e of list) slots[e.vreme] = (slots[e.vreme] || 0) + 1;
        for (const [t, n] of Object.entries(slots).sort()) inner += `<div class="slot"><b>${t}</b>${n}</div>`;
      }
      clickable = list.length || pl.length;
    }
    if (S.showFriends && FEX_BY_DATE[k]) {
      const fx = FEX_BY_DATE[k], rel = pick ? fx.filter(x => sameSubject(pick, x.sifra, x.n)) : fx;
      const people = uniq(rel.map(x => x.f));
      if (people.length) { inner += `<div class="favs">${avatarStack(people, 20, 3)}${pick ? '<span>isti ispit</span>' : ''}</div>`; if (!pick) { clickable = true; if (!cls.includes('has')) cls.push('has'); } }
    }
    const c = cls.filter(Boolean).join(' ');
    h += clickable ? `<button class="${c}" ${attr} aria-label="${fmtDay(k)}">${inner}</button>` : `<div class="${c}">${inner}</div>`;
  }
  h += '</div></div>';
  $('#viewArea').innerHTML = h;
  const ym = `${S.y}-${pad(S.m + 1)}`;
  const nPl = MY.filter(s => s.plan && s.plan.datum.startsWith(ym)).length;
  const sub = pick ? termina(pick.inst.filter(i => i.datum.startsWith(ym)).length) + ' ovog meseca' : mine ? `${nPl} zakazano` : ispita(FILTERED.filter(e => e.datum.startsWith(ym)).length);
  $('#period').innerHTML = `${cap(MESECI[S.m])} ${S.y}.<small>${sub}</small>`;
}

// ---- Godina ----
function schoolYearStart() { return S.m >= 9 ? S.y : S.y - 1; }
function renderYear() {
  const y0 = schoolYearStart();
  const pick = S.pick ? MYMAP.get(S.pick) : null;
  const src = pick ? pick.inst : FILTERED;
  const days = byDay(src);
  const plannedBy = byDay(MY.filter(s => s.plan), s => s.plan.datum);
  let max = 0; for (const k in days) max = Math.max(max, days[k].length);
  let h = '<div class="year">', total = 0;
  for (let i = 0; i < 12; i++) {
    const mm = (9 + i) % 12, yy = mm >= 9 ? y0 : y0 + 1;
    const first = new Date(yy, mm, 1), dim = new Date(yy, mm + 1, 0).getDate(), off = (first.getDay() + 6) % 7;
    let mcount = 0, cells = '';
    for (let j = 0; j < off; j++) cells += '<span class="yd e"></span>';
    for (let d = 1; d <= dim; d++) {
      const k = `${yy}-${pad(mm + 1)}-${pad(d)}`, n = (days[k] || []).length, pl = plannedBy[k] || [];
      mcount += n;
      const p = n ? Math.round(18 + 82 * Math.sqrt(n / max)) : 0;
      const cls = ['yd', n && 'has', p > 55 && 'hot', k === todayIso && 'today', pl.length && 'planned', pl.some(s => s.conf === 'major') && 'cmajor'].filter(Boolean).join(' ');
      const tip = `${fmtDay(k)}${n ? ' · ' + (pick ? 'termin' : ispita(n)) : ''}${pl.length ? ' · zakazano: ' + pl.map(s => s.predmet).join(', ') : ''}`;
      cells += n || pl.length ? `<button class="${cls}" style="--p:${p}%" data-day="${k}" title="${esc(tip)}">${d}</button>` : `<span class="${cls}">${d}</span>`;
    }
    total += mcount;
    h += `<div class="ym"><h3><button data-month="${yy}-${mm}">${cap(MESECI[mm])} ${yy}.</button><span>${mcount || ''}</span></h3><div class="ygrid">${DANI.map(x => `<span class="h">${x[0]}</span>`).join('')}${cells}</div></div>`;
  }
  h += '</div>';
  const leg = [18, 45, 72, 100].map(p => `<i style="background:color-mix(in srgb, var(--brand) ${p}%, var(--surface))"></i>`).join('');
  h += `<div class="ylegend">Manje ${leg} više ${pick ? 'termina' : 'ispita'} u danu · <i style="box-shadow:inset 0 0 0 2px var(--brand)"></i> zakazano</div>`;
  $('#viewArea').innerHTML = h;
  $('#period').innerHTML = `Školska ${y0}/${String(y0 + 1).slice(2)}.<small>${pick ? termina(total) : ispita(total)}</small>`;
}

// ---- Lista ----
function renderList() {
  const list = FILTERED.slice(0, S.listLimit);

    h += `<tr><td class="mono nowrap">${e.vreme}</td><td>${esc(e.predmet)}</td><td class="nowrap">${st}</td><td class="mono nowrap">${esc(e.sifra)}</td><td class="mono">${e.sem}</td><td>${esc(e.modul)}</td><td class="nowrap">${rokTag(e.rokId)}</td></tr>`;

  $('#viewArea').innerHTML = h;
  $('#period').innerHTML = `Lista<small>${ispita(FILTERED.length)}</small>`;
}
function emptyFiltered() {
  if (S.scope === 'moji' && prof() && !S.f.q) return `<div class="empty"><strong>Nema termina za tvoje ispite</strong>U učitanim rokovima nema ispita sa tvoje liste. Uključi „Prikaži i ostale ispite" ili dodaj novi rok.</div>`;

// ---- Panel dana ----
const examById = id => S.exams.find(e => e.id === id);
function schedRow(s, inst, opts = {}) {
  const cs = conflictsFor(inst, s.sifra), lvl = cs.length ? cs[0].lvl : '';
  const isCur = s.plan && s.plan.rokId === inst.rokId;
  const btn = isCur ? `<span class="pill ${s.conf || 'planned'}">Zakazano</span>`
    : `<button class="btn ${lvl === 'major' ? '' : 'primary'} sm" data-sched="${esc(inst.id)}">${s.plan ? 'Prebaci ovde' : 'Zakaži'}</button>`;
  return `<div class="xrow ${isCur ? 'mine' : ''} ${(isCur ? s.conf : lvl) || ''}"><div class="xi">
    <div class="xn">${opts.dateTitle ? `${cap(fmtShort(inst.datum))} · ${inst.vreme}` : esc(s.predmet)}</div>
    <div class="xm">${opts.dateTitle ? '' : `<span class="tag mono">${inst.vreme}</span>`}<span class="tag">${s.sem}. sem.</span>${rokTag(inst.rokId)}${opts.dateTitle ? `<span class="tag">${countdown(inst.datum)}</span>` : ''}</div>
    ${(() => { const fw = S.showFriends ? friendsOnTerm(s, inst) : []; return fw.length ? `<div class="fnote">${avatarStack(fw, 18, 3)}<span>${esc(fw.map(f => f.ime || fullName(f)).join(', '))} ${fw.length === 1 ? 'polaže' : 'polažu'} tada</span></div>` : ''; })()}
    ${!isCur && s.plan && !opts.dateTitle ? `<div class="note muted">Sada zakazano: ${fmtShort(s.plan.datum)} u ${s.plan.vreme}</div>` : ''}
    ${(isCur ? s.confWith.length : cs.length) ? `<div class="note ${isCur ? s.conf : lvl}">${esc(conflictText(isCur ? s.confWith : cs))}</div>` : ''}
  </div>${btn}</div>`;
}
function renderDay() {

  let h = `<div class="dh"><h2>${cap(fmtDay(k))}</h2><div class="dsub">${pl.length ? `${pl.length} zakazano · ` : ''}${ispita(list.length)} ${S.scope === 'moji' && prof() ? 'sa tvoje liste' : 'u rasporedu'}</div></div>`;
  if (pl.length) {
    h += `<div class="dsec"><h4>Moj plan</h4>`;
    for (const s of pl) h += `<div class="xrow mine ${s.conf || ''}"><div class="xi"><div class="xn">${esc(s.predmet)}</div><div class="xm"><span class="tag mono">${s.plan.vreme}</span><span class="tag">${s.sem}. sem.</span>${rokTag(s.plan.rokId)}</div>${s.conf ? `<div class="note ${s.conf}">${esc(conflictText(s.confWith))}</div>` : ''}</div><button class="btn sm" data-pick="${esc(s.sifra)}">Promeni</button></div>`;

        if (seen.has(e.sifra)) continue; seen.add(e.sifra);
        const s = MYMAP.get(e.sifra);
        if (s) h += schedRow(s, CAT.get(e.sifra) ? (CAT.get(e.sifra).inst.find(i => i.rokId === e.rokId) || e) : e);
        else h += `<div class="xrow"><div class="xi"><div class="xn">${esc(e.predmet)}</div><div class="xm"><span class="tag">${esc(e.nivo)}</span><span class="tag">${e.sem}. sem.</span><span class="tag">${esc(e.modul)}</span><span class="tag code">${esc(e.sifra)}</span><span class="tag">ak. ${e.akred}</span>${rokTag(e.rokId)}</div></div></div>`;
