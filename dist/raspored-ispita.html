/* Layout: radni sto — levo filteri, u sredini kalendar, desno izabrani dan. Stil: Remenex (squircle, Chillax + Instrument Sans) */
:root {
  --bg: #f7f7f7;
  --surface: #ffffff;
  --tile: #f3f4f8;
  --tile-hover: #eceefa;
  --line: rgb(2 8 43 / .09);
  --line-strong: rgb(2 8 43 / .18);
  --ink: #02082b;
  --ink-2: rgb(2 8 43 / .70);
  --ink-3: rgb(2 8 43 / .48);
  --brand: #1a3ffb;
  --brand-hover: #2f51ff;
  --brand-fg: #1a3ffb;
  --on-brand: #ffffff;
  --brand-soft: #e9edff;
  --orange: #f77d44;
  --danger: #e0463a;
  --danger-soft: #fdeeec;
  --heat-base: #f3f4f8;
  --toast-bg: #02082b;
  --toast-fg: #f8f9ff;
  --backdrop: rgb(2 8 43 / .38);
  --shadow-card: 0 4px 25px -10px rgb(0 0 0 / .17);
  --shadow-pop: 0 24px 60px -20px rgb(2 8 43 / .35), 0 4px 25px -10px rgb(0 0 0 / .17);
  --shadow-btn: inset 0 4px 4px rgb(255 255 255 / .23), 3px 4px 11px rgb(150 150 150 / .10), 0 6px 16px -8px rgb(26 63 251 / .55);
  --shadow-btn-2: 0 4px 25px -10px rgb(0 0 0 / .17), 3px 4px 11px rgb(150 150 150 / .10);
  --shadow-press: 0 2px 5px rgb(0 0 0 / .20);
  --drop: drop-shadow(0 8px 14px rgb(0 0 0 / .07));
  --r1: #1a3ffb; --r2: #f77d44; --r3: #0ea5a4; --r4: #8b5cf6; --r5: #e5487a; --r6: #d4a600;
  --f-head: "Chillax", "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --rad-xs: 10px; --rad-sm: 14px; --rad-md: 18px; --rad-lg: 24px; --rad-xl: 32px; --rad-pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #04081f; --surface: #10153a; --tile: #1a1f3f; --tile-hover: #232a55; --line: rgb(248 249 255 / .08); --line-strong: rgb(248 249 255 / .18);
  --ink: #f8f9ff; --ink-2: rgb(248 249 255 / .72); --ink-3: rgb(248 249 255 / .48);
  --brand: #1a3ffb; --brand-hover: #3555ff; --brand-fg: #8ea0ff; --on-brand: #ffffff; --brand-soft: rgb(26 63 251 / .22);
  --orange: #ff9a6a; --danger: #ff7b6e; --danger-soft: rgb(255 123 110 / .14); --heat-base: #1a1f3f;
  --toast-bg: #f8f9ff; --toast-fg: #02082b; --backdrop: rgb(0 2 12 / .62);
  --shadow-card: 0 4px 25px -10px rgb(0 0 0 / .6), inset 0 0 0 1px rgb(248 249 255 / .05);
  --shadow-pop: 0 24px 60px -20px rgb(0 0 0 / .8), inset 0 0 0 1px rgb(248 249 255 / .07);
  --shadow-btn: inset 0 4px 4px rgb(255 255 255 / .23), 3px 4px 11px rgb(0 0 0 / .25), 0 6px 18px -8px rgb(26 63 251 / .8);
  --shadow-btn-2: inset 0 1px 0 rgb(248 249 255 / .06), 3px 4px 11px rgb(0 0 0 / .25);
  --shadow-press: 0 2px 5px rgb(0 0 0 / .5);
  --drop: drop-shadow(0 8px 14px rgb(0 0 0 / .35));
  --r1: #7d93ff; --r2: #ff9a6a; --r3: #2dd4bf; --r4: #b69cff; --r5: #ff7aa5; --r6: #f5cf3a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #04081f; --surface: #10153a; --tile: #1a1f3f; --tile-hover: #232a55; --line: rgb(248 249 255 / .08); --line-strong: rgb(248 249 255 / .18);
  --ink: #f8f9ff; --ink-2: rgb(248 249 255 / .72); --ink-3: rgb(248 249 255 / .48);
  --brand: #1a3ffb; --brand-hover: #3555ff; --brand-fg: #8ea0ff; --on-brand: #ffffff; --brand-soft: rgb(26 63 251 / .22);
  --orange: #ff9a6a; --danger: #ff7b6e; --danger-soft: rgb(255 123 110 / .14); --heat-base: #1a1f3f;
  --toast-bg: #f8f9ff; --toast-fg: #02082b; --backdrop: rgb(0 2 12 / .62);
  --shadow-card: 0 4px 25px -10px rgb(0 0 0 / .6), inset 0 0 0 1px rgb(248 249 255 / .05);
  --shadow-pop: 0 24px 60px -20px rgb(0 0 0 / .8), inset 0 0 0 1px rgb(248 249 255 / .07);
  --shadow-btn: inset 0 4px 4px rgb(255 255 255 / .23), 3px 4px 11px rgb(0 0 0 / .25), 0 6px 18px -8px rgb(26 63 251 / .8);
  --shadow-btn-2: inset 0 1px 0 rgb(248 249 255 / .06), 3px 4px 11px rgb(0 0 0 / .25);
  --shadow-press: 0 2px 5px rgb(0 0 0 / .5);
  --drop: drop-shadow(0 8px 14px rgb(0 0 0 / .35));
  --r1: #7d93ff; --r2: #ff9a6a; --r3: #2dd4bf; --r4: #b69cff; --r5: #ff7aa5; --r6: #f5cf3a;
  color-scheme: dark; }

/* ---------- osnova ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-fg); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
h1, h2, h3 { font-family: var(--f-head); font-weight: 500; letter-spacing: -.02em; text-wrap: balance; }

/* squircle: nativno gde postoji (corner-shape), inače JS crta oblik (vidi skriptu „squircle") */
@supports (corner-shape: squircle) { * { corner-shape: squircle; } }
.sq-on { background-color: transparent !important; background-image: var(--sq-img) !important; background-size: 100% 100% !important; background-repeat: no-repeat !important; border-color: transparent !important; box-shadow: none !important; filter: var(--sq-drop, none); }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 48px; max-width: 1680px; margin: 0 auto; }

/* ---------- zaglavlje ---------- */
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
header.top .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { width: 48px; height: 48px; border-radius: var(--rad-sm); background: var(--brand); color: var(--on-brand); display: grid; place-items: center; box-shadow: var(--shadow-btn); flex: none; }
header.top h1 { font-size: 28px; line-height: 1.05; margin: 0; }
header.top .sub { color: var(--ink-3); font-size: 13.5px; margin-top: 3px; }
header.top .grow { flex: 1; }

/* ---------- dugmad (Remenex) ---------- */
.btn { --b-bg: var(--surface); border: 1px solid var(--line); background: var(--b-bg); color: var(--ink); border-radius: var(--rad-md); min-height: 48px; padding: 12px 22px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; font-family: var(--f-head); font-weight: 500; font-size: 15px; letter-spacing: .005em; box-shadow: var(--shadow-btn-2); transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease; white-space: nowrap; }
.btn:hover { --b-bg: var(--tile); }
.btn:active { transform: translateY(1px); box-shadow: var(--shadow-press); }
.btn.primary { --b-bg: var(--brand); color: var(--on-brand); border-color: var(--brand); box-shadow: var(--shadow-btn); }
.btn.primary:hover { --b-bg: var(--brand-hover); }
.btn.primary:active { box-shadow: var(--shadow-press); }
.btn.ghost { --b-bg: transparent; border-color: transparent; box-shadow: none; min-height: 40px; padding: 8px 14px; }
.btn.ghost:hover { --b-bg: var(--tile); }
.btn.sm { min-height: 40px; padding: 8px 16px; font-size: 14px; border-radius: var(--rad-sm); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { --b-bg: var(--danger); color: #fff; border-color: var(--danger); box-shadow: inset 0 4px 4px rgb(255 255 255 / .2), 3px 4px 11px rgb(150 150 150 / .1); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.iconbtn { width: 48px; height: 48px; padding: 0; border-radius: var(--rad-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-grid; place-items: center; box-shadow: var(--shadow-btn-2); transition: transform .15s ease, background-color .15s ease; }
.iconbtn:hover { background: var(--tile); }
.iconbtn:active { transform: translateY(1px); box-shadow: var(--shadow-press); }

/* ---------- raspored ---------- */
.layout { display: grid; grid-template-columns: 292px minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
@media (max-width: 1320px) { .layout { grid-template-columns: 280px minmax(0, 1fr); } .day-panel { grid-column: 2; } }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .day-panel { grid-column: 1; } }

.card { background: var(--surface); border-radius: var(--rad-xl); box-shadow: var(--shadow-card); }

/* ---------- filteri ---------- */
.filters { padding: 20px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow: auto; }
.filters-toggle { display: none; }
@media (max-width: 860px) {
  .filters { position: static; max-height: none; }
  .filters-toggle { display: inline-flex; }
  .filters.collapsed { display: none; }
}
.fgroup { display: flex; flex-direction: column; gap: 9px; }
.flabel { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; align-items: baseline; }
.flabel button { border: 0; background: none; color: var(--brand-fg); font-size: 12.5px; font-weight: 600; letter-spacing: 0; text-transform: none; padding: 2px 4px; border-radius: 8px; }
.search { position: relative; }
.search input { width: 100%; height: 50px; border: 1px solid transparent; background: var(--tile); border-radius: var(--rad-md); padding: 0 14px 0 42px; font-size: 15px; transition: background-color .15s, border-color .15s; }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { outline: none; background: var(--surface); border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.search > svg { position: absolute; left: 15px; top: 25px; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 20; background: var(--surface); border-radius: var(--rad-lg); box-shadow: var(--shadow-pop); padding: 6px; margin: 0; list-style: none; max-height: 360px; overflow: auto; }
.sugg li { padding: 10px 12px; border-radius: var(--rad-sm); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.sugg li[aria-selected="true"], .sugg li:hover { background: var(--brand-soft); }
.sugg .sn { font-weight: 500; color: var(--ink); line-height: 1.3; }
.sugg .sn mark { background: none; color: var(--brand-fg); font-weight: 700; }
.sugg .sm { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sugg .none { color: var(--ink-3); cursor: default; }
.sugg .none:hover { background: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid transparent; background: var(--tile); color: var(--ink); border-radius: var(--rad-sm); min-height: 36px; padding: 6px 12px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; transition: background-color .15s, transform .15s; }
.chip:hover { background: var(--tile-hover); }
.chip:active { transform: translateY(1px); }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-btn); }
.chip .dot { width: 9px; height: 9px; border-radius: 4px; background: var(--c, var(--ink-3)); }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px rgb(255 255 255 / .85); }
.chip .n { font-size: 12px; opacity: .55; font-variant-numeric: tabular-nums; }
.dates { display: grid; grid-template-columns: 1fr; gap: 8px; }
.dates label { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 10px; }
.dates label span { width: 22px; }
.dates input { flex: 1; min-width: 0; height: 44px; border: 1px solid transparent; background: var(--tile); border-radius: var(--rad-sm); padding: 0 12px; }
.dates input:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.fsummary { font-size: 14px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fsummary #resultCount { font-family: var(--f-head); font-weight: 500; color: var(--ink); }

/* ---------- glavni deo ---------- */
.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border-radius: var(--rad-md); padding: 5px; gap: 3px; box-shadow: var(--shadow-btn-2); }
.seg button { border: 0; background: transparent; min-height: 38px; padding: 6px 16px; border-radius: var(--rad-sm); color: var(--ink-2); font-family: var(--f-head); font-weight: 500; font-size: 15px; transition: background-color .15s; }
.seg button:hover { background: var(--tile); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-btn); }
.navbtns { display: inline-flex; gap: 6px; }
.period { font-family: var(--f-head); font-weight: 500; font-size: 26px; letter-spacing: -.02em; min-width: 0; margin-left: 4px; }
.period small { font-family: var(--f-body); font-weight: 500; letter-spacing: 0; color: var(--ink-3); font-size: 14px; margin-left: 8px; }

/* ---------- mesec: pločice ---------- */
#viewArea { padding: 14px; }
.month { overflow-x: auto; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(92px, 1fr)); gap: 6px; min-width: 680px; }
.mhead { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 4px 10px 6px; }
.mcell { position: relative; border: 1px solid transparent; background: var(--tile); border-radius: var(--rad-md); min-height: 118px; padding: 10px 11px; display: flex; flex-direction: column; gap: 5px; text-align: left; color: var(--ink); transition: background-color .15s, transform .15s; }
.mcell.out { background: transparent; border-color: var(--line); color: var(--ink-3); }
.mcell.weekend:not(.has) .dn { color: var(--ink-3); }
.mcell.has { cursor: pointer; background: var(--brand-soft); }
.mcell.has:hover { background: var(--tile-hover); }
.mcell.has:active { transform: translateY(1px); }
.mcell.sel { background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-btn); }
.mcell.sel .slot, .mcell.sel .slot b, .mcell.sel .mini { color: var(--on-brand); }
.mcell.sel .total { background: rgb(255 255 255 / .22); color: var(--on-brand); }
.mcell .dn { font-family: var(--f-head); font-weight: 500; font-size: 17px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.mcell.today .dn > span:first-child { background: var(--orange); color: #fff; border-radius: 10px; padding: 0 8px; min-width: 30px; text-align: center; }
.mcell .total { font-family: var(--f-body); font-size: 12px; font-weight: 600; color: var(--on-brand); background: var(--brand); border-radius: 9px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.slot { font-size: 13px; display: flex; gap: 6px; align-items: baseline; color: var(--ink-2); }
.slot b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.mini { font-size: 12.5px; line-height: 1.3; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--c, var(--brand)); padding-left: 6px; border-radius: 2px; }
@media (max-width: 600px) {
  #viewArea { padding: 10px; }
  .mgrid { min-width: 0; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .mhead { padding: 4px 0; text-align: center; letter-spacing: .02em; }
  .mcell { min-height: 60px; padding: 6px 3px; align-items: center; border-radius: var(--rad-sm); }
  .mcell .dn { flex-direction: column; gap: 3px; font-size: 15px; }
  .mcell .total { padding: 0 6px; font-size: 11px; }
  .slot, .mini, .rokdots { display: none !important; }
}
.rokdots { display: flex; gap: 4px; margin-top: auto; }
.rokdots i { width: 8px; height: 8px; border-radius: 3px; background: var(--c); }

/* ---------- godina ---------- */
.year { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.ym { background: var(--tile); border-radius: var(--rad-lg); padding: 14px; }
.ym h3 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
.ym h3 span { font-family: var(--f-body); font-weight: 600; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ym h3 button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; }
.ym h3 button:hover { color: var(--brand-fg); }
.ygrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.ygrid .h { font-size: 10.5px; font-weight: 600; color: var(--ink-3); text-align: center; padding-bottom: 3px; }
.yd { aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 0; padding: 0; font-size: 11.5px; display: grid; place-items: center; background: transparent; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.yd.e { background: transparent; }
.yd.has { color: var(--ink); font-weight: 600; background: color-mix(in srgb, var(--brand) var(--p), var(--surface)); }
.yd.has:hover { outline: 2px solid var(--brand); outline-offset: 0; }
.yd.has.hot { color: var(--on-brand); }
.yd.today { box-shadow: inset 0 0 0 2px var(--orange); }
.ylegend { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); padding: 14px 4px 2px; flex-wrap: wrap; }
.ylegend i { width: 16px; height: 16px; border-radius: 5px; display: inline-block; }

/* ---------- lista ---------- */
.tablewrap { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 12px 10px; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.nowrap { white-space: nowrap; }
tr.dayrow td { background: var(--tile); font-family: var(--f-head); font-weight: 500; font-size: 15px; border-bottom: 0; }
tr.dayrow td:first-child { border-radius: var(--rad-sm) 0 0 var(--rad-sm); }
tr.dayrow td:last-child { border-radius: 0 var(--rad-sm) var(--rad-sm) 0; }
tbody tr:not(.dayrow):hover td { background: var(--tile); }
.more { padding: 16px 12px 4px; text-align: center; }

/* ---------- izabrani dan ---------- */
.day-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow: auto; padding: 8px; }
@media (max-width: 1320px) { .day-panel { position: static; max-height: none; } }
.day-panel .dh { padding: 14px 14px 12px; position: sticky; top: -8px; background: var(--surface); z-index: 1; border-radius: var(--rad-lg) var(--rad-lg) 0 0; }
.day-panel h2 { font-size: 22px; margin: 0; line-height: 1.15; }
.day-panel .dsub { color: var(--ink-3); font-size: 14px; margin-top: 3px; }
.tslot { padding: 14px 14px 8px; font-size: 13px; color: var(--ink-3); display: flex; gap: 10px; align-items: center; }
.tslot b { color: var(--ink); font-family: var(--f-head); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tslot::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.subjs { display: flex; flex-direction: column; gap: 6px; }
.subj { padding: 12px 14px; background: var(--tile); border-radius: var(--rad-md); }
.subj .nm { font-weight: 600; font-size: 15px; }
.subj .vs { display: flex; flex-direction: column; gap: 5px; margin-top: 7px; }
.v { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12.5px; align-items: center; }
.tag { border-radius: 8px; padding: 2px 8px; background: var(--surface); color: var(--ink-2); white-space: nowrap; font-weight: 500; }
.tag.code { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.tag.rok { background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--ink); }
.empty { padding: 36px 20px; color: var(--ink-3); text-align: center; }
.empty strong { display: block; color: var(--ink); font-family: var(--f-head); font-weight: 500; font-size: 19px; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }

/* ---------- poruke, prazno stanje ---------- */
.banner { border-radius: var(--rad-md); padding: 12px 16px; font-size: 14px; background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow-card); }
.banner.err { background: var(--danger-soft); color: var(--danger); box-shadow: none; }
.hero-empty { padding: 56px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.hero-empty h2 { margin: 0; font-size: 26px; }
.hero-empty p { margin: 0 0 6px; color: var(--ink-2); max-width: 46ch; }

/* ---------- dijalozi ---------- */
dialog { border: 0; border-radius: var(--rad-xl); background: var(--surface); color: var(--ink); padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow-pop); }
dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.dlg header { padding: 22px 24px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dlg header h2 { margin: 0; font-size: 24px; }
.dlg .body { padding: 6px 24px 24px; overflow: auto; display: flex; flex-direction: column; gap: 18px; }
.drop { border: 2px dashed var(--line-strong); border-radius: var(--rad-lg); padding: 36px 18px; text-align: center; color: var(--ink-2); background: var(--tile); display: flex; flex-direction: column; gap: 8px; align-items: center; cursor: pointer; transition: background-color .15s, border-color .15s; }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .ic { width: 56px; height: 56px; border-radius: var(--rad-md); background: var(--brand); color: var(--on-brand); display: grid; place-items: center; box-shadow: var(--shadow-btn); margin-bottom: 6px; }
.drop strong { color: var(--ink); font-family: var(--f-head); font-weight: 500; font-size: 18px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.field select, .field input { height: 48px; border: 1px solid transparent; background: var(--tile); border-radius: var(--rad-sm); padding: 0 12px; font-size: 15px; color: var(--ink); }
.field select:focus, .field input:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; font-size: 13px; color: var(--ink-3); }
.stat > div { background: var(--tile); border-radius: var(--rad-md); padding: 12px 14px; }
.stat b { font-family: var(--f-head); font-weight: 500; font-size: 24px; color: var(--ink); display: block; line-height: 1.2; }
.preview { max-height: 220px; overflow: auto; background: var(--tile); border-radius: var(--rad-md); padding: 4px 6px; }
.preview table { font-size: 13px; }
.preview th { background: var(--tile); }
.preview td { border-bottom-color: var(--line); }
details summary { cursor: pointer; }
.warn { color: var(--danger); font-size: 14px; }
.doclist { display: flex; flex-direction: column; gap: 8px; }
.doc { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--tile); border-radius: var(--rad-lg); flex-wrap: wrap; }
.doc .sw { width: 14px; height: 14px; border-radius: 5px; background: var(--c); flex: none; }
.doc .info { flex: 1; min-width: 180px; }
.doc .info b { font-family: var(--f-head); font-weight: 500; font-size: 17px; }
.doc .info div { font-size: 13px; color: var(--ink-3); }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
h3.sec { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 0; font-family: var(--f-body); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--tile-hover); border-top-color: var(--brand); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

<script>
// ===== Jezgro: transliteracija + parsiranje rasporeda ispita =====
const CYR = {
  'А':'A','Б':'B','В':'V','Г':'G','Д':'D','Ђ':'Đ','Е':'E','Ж':'Ž','З':'Z','И':'I','Ј':'J','К':'K','Л':'L','Љ':'Lj','М':'M','Н':'N','Њ':'Nj','О':'O','П':'P','Р':'R','С':'S','Т':'T','Ћ':'Ć','У':'U','Ф':'F','Х':'H','Ц':'C','Ч':'Č','Џ':'Dž','Ш':'Š',
  'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'đ','е':'e','ж':'ž','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'ć','у':'u','ф':'f','х':'h','ц':'c','ч':'č','џ':'dž','ш':'š'
};
function toLatin(s) {
  if (!s) return '';
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], t = CYR[ch];
    if (t === undefined) { out += ch; continue; }
    // Lj/Nj/Dž u reči pisanoj velikim slovima -> LJ/NJ/DŽ
    if (t.length === 2 && ch === ch.toUpperCase()) {
      const nx = s[i + 1] || '', pv = s[i - 1] || '';
      const isUp = c => c && c !== c.toLowerCase();
      if (isUp(nx) || (!nx.trim() && isUp(pv))) { out += t.toUpperCase(); continue; }
    }
    out += t;
  }
  return out;
}
// za pretragu: latinica, mala slova, bez dijakritika
function fold(s) {
  return toLatin(String(s || '')).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/đ|dj/g, 'd'); // đ = dj = d (č/ć -> c, š -> s, ž -> z, dž -> dz preko NFD)
}

const MONTHS = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'avg', 'sep', 'okt', 'nov', 'dec'];
function monthFromWord(w) {
  const f = fold(w);
  for (let i = 0; i < 12; i++) if (f.startsWith(MONTHS[i])) return i + 1;
  if (f.startsWith('aug')) return 8;
  return 0;
}
const pad = n => String(n).padStart(2, '0');

// "OAS 2026 1 SVI 4OEZ1O01 Matematika 1 subota, 5. decembar 2026. 9:00:00"
const RE_WORD = /^(\S+)\s+(\d{4})\s+(\d{1,2})\s+(\S+)\s+(\S+)\s+(.+?)\s+(?:\S+,\s*)?(\d{1,2})\.\s*([^\s\d.]+)\s+(\d{4})\.?\s+(\d{1,2})[:.](\d{2})(?:[:.]\d{2})?\s*h?$/;
// "... 05.12.2026. 9:00"
const RE_NUM = /^(\S+)\s+(\d{4})\s+(\d{1,2})\s+(\S+)\s+(\S+)\s+(.+?)\s+(?:\S+,\s*)?(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})\.?\s+(\d{1,2})[:.](\d{2})(?:[:.]\d{2})?\s*h?$/;

// Jedan red teksta -> red ispita (kompaktni niz) ili null
// Red: [nivo, akreditacija, semestar, modul, sifra, predmet, 'YYYY-MM-DD', 'HH:MM']
function parseLine(raw) {
  const line = toLatin(raw).replace(/\s+/g, ' ').trim();
  if (!line) return null;
  let m = line.match(RE_WORD), mon;
  if (m) mon = monthFromWord(m[8]);
  else if ((m = line.match(RE_NUM))) mon = +m[8];
  if (!m || !mon || mon > 12) return null;
  const day = +m[7];
  if (day < 1 || day > 31) return null;
  return [m[1], +m[2], +m[3], m[4], m[5], m[6].trim(),
    `${m[9]}-${pad(mon)}-${pad(day)}`, `${pad(+m[10])}:${m[11]}`];
}
function isHeader(raw) { return /nivo|predmet|šifra|sifra/i.test(toLatin(raw)) && !/\d{4}\./.test(raw); }

function parseLines(lines) {
  const rows = [], bad = [];
  for (const l of lines) {
    if (!l.trim() || isHeader(l)) continue;
    const r = parseLine(l);
    if (r) rows.push(r); else bad.push(toLatin(l).replace(/\s+/g, ' ').trim());
  }
  return { rows, bad };
}

// pdf.js dokument -> redovi teksta (grupisanje po y, sortiranje po x)
async function pdfToLines(pdf) {
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim() !== '' || (it.str === ' '))
      .map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5], w: it.width, h: Math.abs(it.transform[3]) || 8 }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const groups = [];
    for (const it of items) {
      const g = groups.find(g => Math.abs(g.y - it.y) <= Math.max(2, it.h * 0.35));
      if (g) g.items.push(it); else groups.push({ y: it.y, items: [it] });
    }
    groups.sort((a, b) => b.y - a.y);
    for (const g of groups) {
      g.items.sort((a, b) => a.x - b.x);
      let s = '', end = null;
      for (const it of g.items) {
        if (end !== null && it.x - end > 1) s += ' ';
        s += it.s; end = it.x + it.w;
      }
      lines.push(s);
    }
    page.cleanup && page.cleanup();
  }
  return lines;
}

// pogađanje roka i školske godine
const ROKOVI = [
  ['januarski', 'Januarski'], ['februarski', 'Februarski'], ['martovski', 'Martovski'], ['aprilski', 'Aprilski'],
  ['majski', 'Majski'], ['junski', 'Junski'], ['julski', 'Julski'], ['avgustovski', 'Avgustovski'],
  ['septembarski', 'Septembarski'], ['oktobarski', 'Oktobarski'], ['oktobarski2', 'Oktobarski 2'],
  ['novembarski', 'Novembarski'], ['decembarski', 'Decembarski']
];
const ROK_BY_MONTH = { 1: 'januarski', 2: 'februarski', 3: 'martovski', 4: 'aprilski', 5: 'majski', 6: 'junski', 7: 'julski', 8: 'avgustovski', 9: 'septembarski', 10: 'oktobarski', 11: 'novembarski', 12: 'decembarski' };
function guessMeta(fileName, rows) {
  const f = fold(fileName || '');
  let rok = '';
  for (const [k] of ROKOVI) if (k !== 'oktobarski2' && f.includes(k.slice(0, 5))) { rok = k; break; }
  if (!rok) { const mm = f.match(/(jan|feb|mart|apr|maj|jun|jul|avg|sept|okt|nov|dec)/); if (mm) rok = ROK_BY_MONTH[monthFromWord(mm[1])]; }
  if (/okt\w*\s*(2|ii)\b|oktobarski[-_ ]?2/.test(f)) rok = 'oktobarski2';
  const cnt = {};
  for (const r of rows) { const k = r[6].slice(0, 7); cnt[k] = (cnt[k] || 0) + 1; }
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (!rok && top) rok = ROK_BY_MONTH[+top[0].slice(5, 7)];
  let godina = '';
  const gm = f.match(/(20\d\d)\s*[-_/]\s*(20\d\d)/);
  if (gm) godina = `${gm[1]}/${gm[2]}`;
  else if (top) { const y = +top[0].slice(0, 4), mo = +top[0].slice(5, 7); godina = mo >= 10 ? `${y}/${y + 1}` : `${y - 1}/${y}`; }
  return { rok: rok || 'januarski', godina };
}
function rokLabel(k) { const r = ROKOVI.find(r => r[0] === k); return r ? r[1] : k; }
function rokId(godina, rok) { return `${godina.replace('/', '-')}__${rok}`; }

if (typeof module !== 'undefined') module.exports = { toLatin, fold, parseLine, parseLines, pdfToLines, guessMeta, rokLabel, rokId, ROKOVI };

</script>

// ===== Squircle =====
// Chrome/Edge: CSS `corner-shape: squircle` (u stilu). Ostali pregledači: ovaj kod crta
// glatke uglove (Figma-style smoothing) kao SVG pozadinu sa ivicom i senkom koja prati oblik.
(function () {
  const SUPPORTED = window.CSS && CSS.supports && CSS.supports('corner-shape', 'squircle');
  const SMOOTH = 0.8;
  const SEL = '.btn, .iconbtn, .card, .chip, .seg, .seg button, .mcell, .search input, .dates input, .field input, .field select, .sugg, .subj, .ym, .doc, .stat > div, .drop, .preview, dialog, .toast, .logo, .banner';
  const rad = d => d * Math.PI / 180;

  function corner(r, budget) {
    let s = SMOOTH, p = (1 + s) * r;
    if (p > budget) { s = Math.max(0, Math.min(budget / r - 1, s)); p = Math.min(p, budget); }
    const arc = 90 * (1 - s);
    const L = Math.sin(rad(arc / 2)) * r * Math.SQRT2;
    const alpha = (90 - arc) / 2;
    const p34 = r * Math.tan(rad(alpha / 2));
    const beta = 45 * s;
    const c = p34 * Math.cos(rad(beta));
    const d = c * Math.tan(rad(beta));
    const b = (p - L - c - d) / 3, a = 2 * b;
    return { a, b, c, d, p, L, r };

    if (r < 0.5) return `M${x} ${y}h${w}v${h}h${-w}Z`;
    const k = corner(r, Math.min(w, h) / 2), { a, b, c, d, p, L } = k, f = n => +n.toFixed(3);
    return [
      `M${f(x + w - p)} ${f(y)}`,
      `c${f(a)} 0 ${f(a + b)} 0 ${f(a + b + c)} ${f(d)}`,
      `a${f(r)} ${f(r)} 0 0 1 ${f(L)} ${f(L)}`,
      `c${f(d)} ${f(c)} ${f(d)} ${f(b + c)} ${f(d)} ${f(a + b + c)}`,
      `L${f(x + w)} ${f(y + h - p)}`,
      `c0 ${f(a)} 0 ${f(a + b)} ${f(-d)} ${f(a + b + c)}`,
      `a${f(r)} ${f(r)} 0 0 1 ${f(-L)} ${f(L)}`,
      `c${f(-c)} ${f(d)} ${f(-(b + c))} ${f(d)} ${f(-(a + b + c))} ${f(d)}`,
      `L${f(x + p)} ${f(y + h)}`,
      `c${f(-a)} 0 ${f(-(a + b))} 0 ${f(-(a + b + c))} ${f(-d)}`,
      `a${f(r)} ${f(r)} 0 0 1 ${f(-L)} ${f(-L)}`,
      `c${f(-d)} ${f(-c)} ${f(-d)} ${f(-(b + c))} ${f(-d)} ${f(-(a + b + c))}`,
      `L${f(x)} ${f(y + p)}`,
      `c0 ${f(-a)} 0 ${f(-(a + b))} ${f(d)} ${f(-(a + b + c))}`,
      `a${f(r)} ${f(r)} 0 0 1 ${f(L)} ${f(-L)}`,
      `c${f(c)} ${f(-d)} ${f(b + c)} ${f(-d)} ${f(a + b + c)} ${f(-d)}Z`

  function paint(el) {
    if (!el.isConnected) return;
    el.style.transition = 'none'; // tranzicije bi vratile međuvrednost boje
    el.classList.remove('sq-on');
    const cs = getComputedStyle(el);
    const r = parseFloat(cs.borderTopLeftRadius) || 0;
    const w = el.offsetWidth, h = el.offsetHeight;
    if (!r || !w || !h || cs.display === 'none') return;
    const bg = cs.backgroundColor, bw = parseFloat(cs.borderTopWidth) || 0, bc = cs.borderTopColor, dashed = cs.borderTopStyle === 'dashed';
    const sh = cs.boxShadow, outer = !!sh && sh !== 'none' && sh.split(/,(?![^(]*\))/).some(x => !/inset/.test(x));

    let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
    if (glow) svg += `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="${Math.min(1, 10 / h)}"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
    if (bw > 0 && visible(bc) && !dashed && visible(bg)) {

      svg += `<path d="${path(bw, bw, w - 2 * bw, h - 2 * bw, Math.max(0, r - bw))}" fill="${bg}"/>`;
    } else {
      if (visible(bg)) svg += `<path d="${path(0, 0, w, h, r)}" fill="${bg}"/>`;
      if (bw > 0 && visible(bc)) svg += `<path d="${path(bw / 2, bw / 2, w - bw, h - bw, Math.max(0, r - bw / 2))}" fill="none" stroke="${bc}" stroke-width="${bw}"${dashed ? ` stroke-dasharray="${bw * 4} ${bw * 3}"` : ''}/>`;

    for (const r of recs) {
      if (r.type === 'childList') r.addedNodes.forEach(n => n.nodeType === 1 && scan(n));
      else if (r.attributeName === 'class' && strip(r.oldValue) === strip(r.target.getAttribute('class'))) continue;
      else if (r.target.dataset && r.target.dataset.sq) schedule(r.target);
      else if (r.target === document.documentElement) repaintAll();
    }
  }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeOldValue: true, attributeFilter: ['class', 'aria-pressed', 'aria-selected', 'open', 'data-theme', 'disabled'] });

  ['pointerover', 'pointerout', 'focusin', 'focusout', 'pointerdown', 'pointerup'].forEach(t => document.addEventListener(t, hov, true));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaintAll);
  if (document.fonts) document.fonts.ready.then(repaintAll);
  scan(document.body);
})();

<script>
(() => {
// ================= Konstante =================
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const NIVO_NAZIV = { OAS: 'Osnovne akademske studije', MAS: 'Master akademske studije', DAS: 'Doktorske akademske studije', OSS: 'Osnovne strukovne studije', MSS: 'Master strukovne studije', SAS: 'Specijalističke akademske studije' };
const DANI = ['Pon', 'Uto', 'Sre', 'Čet', 'Pet', 'Sub', 'Ned'];
const DANI_PUNO = ['nedelja', 'ponedeljak', 'utorak', 'sreda', 'četvrtak', 'petak', 'subota'];
const MESECI = ['januar', 'februar', 'mart', 'april', 'maj', 'jun', 'jul', 'avgust', 'septembar', 'oktobar', 'novembar', 'decembar'];
const ROK_COLORS = ['var(--r1)', 'var(--r2)', 'var(--r3)', 'var(--r4)', 'var(--r5)', 'var(--r6)'];
const CHUNK = 600;
const LS_KEY = 'raspored-ispita:v1';
const LS_UI = 'raspored-ispita:ui';
const $ = s => document.querySelector(s);

const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayIso = iso(new Date());
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDay = s => { const d = parseIso(s); return `${DANI_PUNO[d.getDay()]}, ${d.getDate()}. ${MESECI[d.getMonth()]} ${d.getFullYear()}.`; };
const num = (n, one, few, many) => { const a = n % 10, b = n % 100; return `${n} ${a === 1 && b !== 11 ? one : (a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many)}`; };

// ================= Skladište =================
// U artifaktu: deljena baza (rokovi/{id} = metapodaci, ispiti/{id}__{n} = delovi sa redovima).
// Van artifakta: localStorage u ovom pregledaču.
const Store = {
  mode: 'memory', db: null, mem: {},
  async init() {
    try { if (window.claude && typeof window.claude.use === 'function') this.db = await window.claude.use('db'); } catch { this.db = null; }
    if (this.db) this.mode = 'db';
    else { this.mode = lsSet('raspored-ispita:test', '1') ? 'local' : 'memory'; }
  },
  async loadAll() {
    if (this.mode === 'db') {
      const [rs, cs] = await withTimeout(Promise.all([
        this.db.collection('rokovi').get(),
        this.db.collection('ispiti').limit(1000).get()
      ]), 12000);
      const byRok = {};
      for (const d of cs.docs) { const v = d.data(); (byRok[v.rokId] = byRok[v.rokId] || []).push(v); }
      const out = [];
      for (const d of rs.docs) {
        const meta = d.data();
        const parts = (byRok[meta.id] || []).filter(p => p.idx < meta.chunks).sort((a, b) => a.idx - b.idx);
        if (parts.length !== meta.chunks) continue; // nepotpun upis
        out.push({ meta, rows: parts.flatMap(p => p.rows) });
      }
      return out;
    }
    if (this.mode === 'local') {
      try { this.mem = JSON.parse(lsGet(LS_KEY) || '{}') || {}; } catch { this.mem = {}; }
    }
    return Object.values(this.mem);
  },
  async saveRok(meta, rows, oldChunks) {
    if (this.mode === 'db') {
      const n = Math.ceil(rows.length / CHUNK);
      for (let i = 0; i < n; i++) {
        await this.db.doc(`ispiti/${meta.id}__${i}`).set({ rokId: meta.id, idx: i, rows: rows.slice(i * CHUNK, (i + 1) * CHUNK) });
      }
      for (let i = n; i < (oldChunks || 0); i++) await this.db.doc(`ispiti/${meta.id}__${i}`).delete();
      await this.db.doc(`rokovi/${meta.id}`).set({ ...meta, chunks: n });
      return;
    }
    this.mem[meta.id] = { meta, rows };
    if (this.mode === 'local' && !lsSet(LS_KEY, JSON.stringify(this.mem))) throw { code: 'local_full' };
  },
  async deleteRok(meta) {
    if (this.mode === 'db') {
      await this.db.doc(`rokovi/${meta.id}`).delete();
      for (let i = 0; i < (meta.chunks || 0); i++) await this.db.doc(`ispiti/${meta.id}__${i}`).delete();
      return;
    }
    delete this.mem[meta.id];
    if (this.mode === 'local') lsSet(LS_KEY, JSON.stringify(this.mem));
  }
};

// ================= Stanje =================
const S = {
  rokovi: [],      // [{meta, rows}]
  exams: [],       // normalizovani objekti
  rokColor: {},
  f: { q: '', rok: new Set(), nivo: new Set(), sem: new Set(), modul: new Set(), akred: new Set(), od: '', do: '' },
  view: 'mesec', y: new Date().getFullYear(), m: new Date().getMonth(), selDay: null,
  listLimit: 300, loaded: false, error: null
};
try { const ui = JSON.parse(lsGet(LS_UI) || '{}'); if (['mesec', 'godina', 'lista'].includes(ui.view)) S.view = ui.view; } catch {}

function rebuild() {
  S.rokovi.sort((a, b) => (a.meta.od || '').localeCompare(b.meta.od || ''));
  S.rokColor = {};
  S.rokovi.forEach((r, i) => { S.rokColor[r.meta.id] = ROK_COLORS[i % ROK_COLORS.length]; });
  const ex = [];
  for (const { meta, rows } of S.rokovi) {
    rows.forEach((r, i) => {
      ex.push({ id: meta.id + ':' + i, rokId: meta.id, nivo: r[0], akred: r[1], sem: r[2], modul: r[3], sifra: r[4], predmet: r[5], datum: r[6], vreme: r[7], key: fold(r[5] + ' ' + r[4]) });
    });
  }
  ex.sort((a, b) => a.datum.localeCompare(b.datum) || a.vreme.localeCompare(b.vreme) || a.predmet.localeCompare(b.predmet, 'sr'));
  S.exams = ex;
  // ukloni filtere koji više ne postoje
  for (const k of ['rok']) for (const v of [...S.f[k]]) if (!S.rokovi.some(r => r.meta.id === v)) S.f[k].delete(v);
}
const rokName = id => { const r = S.rokovi.find(r => r.meta.id === id); return r ? `${rokLabel(r.meta.rok)} ${r.meta.godina}` : id; };
const rokShort = id => { const r = S.rokovi.find(r => r.meta.id === id); return r ? rokLabel(r.meta.rok) : id; };

function matches(e, skip) {
  const f = S.f;
  const skipQ = skip === 'q';
  if (skip !== 'rok' && f.rok.size && !f.rok.has(e.rokId)) return false;
  if (skip !== 'nivo' && f.nivo.size && !f.nivo.has(e.nivo)) return false;
  if (skip !== 'sem' && f.sem.size && !f.sem.has(String(e.sem))) return false;
  if (skip !== 'modul' && f.modul.size && !f.modul.has(e.modul)) return false;
  if (skip !== 'akred' && f.akred.size && !f.akred.has(String(e.akred))) return false;
  if (f.od && e.datum < f.od) return false;
  if (f.do && e.datum > f.do) return false;
  if (f.q && !skipQ) { const words = fold(f.q).split(/\s+/).filter(Boolean); for (const w of words) if (!e.key.includes(w)) return false; }
  return true;
}
let FILTERED = [];
function applyFilters() { FILTERED = S.exams.filter(e => matches(e)); }

// ================= Filteri (UI) =================
function chipGroup(el, key, values, labelFn, titleFn, colorFn) {
  // brojevi pokazuju koliko bi ispita ostalo uz ostale aktivne filtere
  const counts = {};
  for (const e of S.exams) if (matches(e, key)) { const v = key === 'rok' ? e.rokId : String(e[key]); counts[v] = (counts[v] || 0) + 1; }
  el.innerHTML = values.map(v => {
    const on = S.f[key].has(v);
    const c = colorFn ? ` style="--c:${colorFn(v)}"` : '';
    return `<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${on}"${titleFn ? ` title="${esc(titleFn(v))}"` : ''}${c}>${colorFn ? '<span class="dot"></span>' : ''}${esc(labelFn(v))}<span class="n">${counts[v] || 0}</span></button>`;
  }).join('') || '<span class="sub" style="color:var(--ink-3);font-size:12px">—</span>';
}
const uniq = (arr) => [...new Set(arr)];
function renderFilters() {
  chipGroup($('#f-rok'), 'rok', S.rokovi.map(r => r.meta.id), rokName, null, id => S.rokColor[id]);
  chipGroup($('#f-nivo'), 'nivo', uniq(S.exams.map(e => e.nivo)).sort(), v => v, v => NIVO_NAZIV[v] || v);
  chipGroup($('#f-sem'), 'sem', uniq(S.exams.map(e => String(e.sem))).sort((a, b) => a - b), v => v + '.');
  chipGroup($('#f-modul'), 'modul', uniq(S.exams.map(e => e.modul)).sort((a, b) => a === 'SVI' ? -1 : b === 'SVI' ? 1 : a.localeCompare(b)), v => v, v => v === 'SVI' ? 'Zajednički predmeti (svi moduli)' : 'Modul ' + v);
  chipGroup($('#f-akred'), 'akred', uniq(S.exams.map(e => String(e.akred))).sort((a, b) => b - a), v => v, v => 'Akreditacija ' + v);
  $('#resultCount').textContent = ispita(FILTERED.length) + (FILTERED.length !== S.exams.length ? ` od ${S.exams.length}` : '');
  const n = activeFilterCount();
  $('#fcount').textContent = n ? `(${n})` : '';
}
function activeFilterCount() {
  const f = S.f; return (f.q ? 1 : 0) + f.rok.size + f.nivo.size + f.sem.size + f.modul.size + f.akred.size + (f.od ? 1 : 0) + (f.do ? 1 : 0);
}
document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) { const set = S.f[chip.dataset.k]; set.has(chip.dataset.v) ? set.delete(chip.dataset.v) : set.add(chip.dataset.v); refresh(); return; }
  const clr = e.target.closest('[data-clear]');
  if (clr) { const k = clr.dataset.clear; if (k === 'datum') { S.f.od = S.f.do = ''; $('#od').value = $('#do').value = ''; } else S.f[k].clear(); refresh(); }
});
let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); renderSugg(); qTimer = setTimeout(() => { S.f.q = e.target.value.trim(); S.listLimit = 300; refresh(true); }, 150); });

// ---- predlozi ispod pretrage ----
let SUGG = [], suggIdx = -1;
function fmtShort(d) { const x = parseIso(d); return `${DANI[(x.getDay() + 6) % 7].toLowerCase()} ${x.getDate()}.${x.getMonth() + 1}.`; }
// istakni deo naziva koji se poklapa (poređenje bez kvačica, slovo po slovo)
function highlight(name, words) {
  const chars = [...name], folded = chars.map(ch => fold(ch));
  const mark = new Array(chars.length).fill(false);
  for (const w of words) {
    for (let i = 0; i < chars.length; i++) {
      let j = i, acc = '';
      while (j < chars.length && acc.length < w.length) acc += folded[j++];
      if (acc.startsWith(w)) { for (let k = i; k < j; k++) mark[k] = true; break; }
    }
  }
  let out = '', open = false;
  chars.forEach((ch, i) => { if (mark[i] && !open) { out += '<mark>'; open = true; } if (!mark[i] && open) { out += '</mark>'; open = false; } out += esc(ch); });
  return out + (open ? '</mark>' : '');
}
function computeSugg(q) {
  const words = fold(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const by = new Map();
  for (const e of S.exams) {
    if (!matches(e, 'q')) continue;
    let ok = true; for (const w of words) if (!e.key.includes(w)) { ok = false; break; }
    if (!ok) continue;
    let g = by.get(e.predmet);
    if (!g) { g = { name: e.predmet, nk: fold(e.predmet), slots: new Map(), n: 0, codeHit: false }; by.set(e.predmet, g); }
    g.n++; g.slots.set(e.datum + ' ' + e.vreme, true);
    if (!words.every(w => g.nk.includes(w))) g.codeHit = true;
  }
  const first = words[0];
  const score = g => (g.nk.startsWith(first) ? 0 : new RegExp('(^|\\s)' + first.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(g.nk) ? 1 : g.codeHit ? 3 : 2);
  return [...by.values()].sort((a, b) => score(a) - score(b) || a.name.localeCompare(b.name, 'sr')).slice(0, 10)
    .map(g => ({ ...g, words, slots: [...g.slots.keys()].sort() }));
}
function renderSugg() {
  const inp = $('#q'), ul = $('#sugg'), q = inp.value.trim();
  SUGG = q ? computeSugg(q) : []; suggIdx = -1;
  if (!q || document.activeElement !== inp) { ul.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
  ul.innerHTML = SUGG.length ? SUGG.map((g, i) => {
    const sl = g.slots, when = sl.length === 1 ? `${fmtShort(sl[0].slice(0, 10))} ${sl[0].slice(11)}` : `${sl.length} termina · prvi ${fmtShort(sl[0].slice(0, 10))} ${sl[0].slice(11)}`;
    return `<li role="option" id="sg${i}" data-i="${i}" aria-selected="false"><span class="sn">${highlight(g.name, g.words)}</span><span class="sm">${when} · ${num(g.n, 'šifra', 'šifre', 'šifri')}</span></li>`;
  }).join('') : '<li class="none">Nema predmeta koji odgovaraju</li>';
  ul.hidden = false; inp.setAttribute('aria-expanded', 'true');
}
function moveSugg(d) {
  if (!SUGG.length) return;
  suggIdx = (suggIdx + d + SUGG.length) % SUGG.length;
  document.querySelectorAll('#sugg li[data-i]').forEach(li => li.setAttribute('aria-selected', +li.dataset.i === suggIdx));
  const cur = $('#sg' + suggIdx); if (cur) { cur.scrollIntoView({ block: 'nearest' }); $('#q').setAttribute('aria-activedescendant', 'sg' + suggIdx); }
}
function pickSugg(i) {
  const g = SUGG[i]; if (!g) return;
  const inp = $('#q'); inp.value = g.name; clearTimeout(qTimer);
  $('#sugg').hidden = true; inp.setAttribute('aria-expanded', 'false'); inp.removeAttribute('aria-activedescendant');
  S.f.q = g.name; S.listLimit = 300;
  const d0 = g.slots[0].slice(0, 10), dt = parseIso(d0);
  S.selDay = d0; S.y = dt.getFullYear(); S.m = dt.getMonth(); if (S.view === 'godina') S.view = 'mesec';
  refresh(true);
}
$('#q').addEventListener('keydown', e => {
  const open = !$('#sugg').hidden;
  if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) renderSugg(); moveSugg(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSugg(-1); }
  else if (e.key === 'Enter' && open && suggIdx >= 0) { e.preventDefault(); pickSugg(suggIdx); }
  else if (e.key === 'Escape' && open) { e.preventDefault(); $('#sugg').hidden = true; $('#q').setAttribute('aria-expanded', 'false'); }
});
$('#q').addEventListener('focus', renderSugg);
$('#q').addEventListener('blur', () => setTimeout(() => { $('#sugg').hidden = true; $('#q').setAttribute('aria-expanded', 'false'); }, 120));
$('#sugg').addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); pickSugg(+li.dataset.i); } });
$('#od').addEventListener('change', e => { S.f.od = e.target.value; refresh(true); });
$('#do').addEventListener('change', e => { S.f.do = e.target.value; refresh(true); });
$('#resetAll').addEventListener('click', () => {
  Object.assign(S.f, { q: '', od: '', do: '' }); ['rok', 'nivo', 'sem', 'modul', 'akred'].forEach(k => S.f[k].clear());

});
$('#filtersToggle').addEventListener('click', e => {
  const f = $('#filters'); const open = f.classList.toggle('collapsed') === false; e.currentTarget.setAttribute('aria-expanded', open);
});

// ================= Pogledi =================
function byDay(list) { const m = {}; for (const e of list) (m[e.datum] = m[e.datum] || []).push(e); return m; }

function renderMonth() {
  const days = byDay(FILTERED);
  const first = new Date(S.y, S.m, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  let h = '<div class="month"><div class="mgrid">' + DANI.map(d => `<div class="mhead">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i === 35 && d.getMonth() !== S.m) break;
    const k = iso(d), list = days[k] || [], out = d.getMonth() !== S.m;
    const cls = ['mcell', out && 'out', list.length && 'has', k === todayIso && 'today', k === S.selDay && 'sel', (d.getDay() % 6 === 0) && 'weekend'].filter(Boolean).join(' ');
    let inner = `<div class="dn"><span>${d.getDate()}</span>${list.length ? `<span class="total">${list.length}</span>` : ''}</div>`;
    if (list.length) {
      const names = uniq(list.map(e => e.predmet));
      if (names.length <= 3) {
        const seen = new Set();
        for (const e of list) { if (seen.has(e.predmet)) continue; seen.add(e.predmet); inner += `<div class="mini" style="--c:${S.rokColor[e.rokId]}" title="${esc(e.predmet)}"><span class="mono">${e.vreme}</span> ${esc(e.predmet)}</div>`; }
      } else {
        const slots = {}; for (const e of list) slots[e.vreme] = (slots[e.vreme] || 0) + 1;
        for (const [t, n] of Object.entries(slots).sort()) inner += `<div class="slot"><b>${t}</b>${n}</div>`;
      }
      const roks = uniq(list.map(e => e.rokId));
      if (S.rokovi.length > 1) inner += `<div class="rokdots">${roks.map(r => `<i style="--c:${S.rokColor[r]}" title="${esc(rokName(r))}"></i>`).join('')}</div>`;
    }
    h += list.length ? `<button class="${cls}" data-day="${k}" aria-label="${fmtDay(k)}: ${ispita(list.length)}">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
  }
  h += '</div></div>';
  $('#viewArea').innerHTML = h;
  const cnt = FILTERED.filter(e => e.datum.startsWith(`${S.y}-${pad(S.m + 1)}`)).length;
  $('#period').innerHTML = `${cap(MESECI[S.m])} ${S.y}.<small>${ispita(cnt)}</small>`;
}

function schoolYearStart() { return S.m >= 9 ? S.y : S.y - 1; }
function renderYear() {
  const y0 = schoolYearStart();

  let h = '<div class="year">', total = 0;
  for (let i = 0; i < 12; i++) {
    const mm = (9 + i) % 12, yy = mm >= 9 ? y0 : y0 + 1;
    const first = new Date(yy, mm, 1), dim = new Date(yy, mm + 1, 0).getDate(), off = (first.getDay() + 6) % 7;
    let mcount = 0, cells = '';
    for (let j = 0; j < off; j++) cells += '<span class="yd e"></span>';
    for (let d = 1; d <= dim; d++) {
      const k = `${yy}-${pad(mm + 1)}-${pad(d)}`, n = (days[k] || []).length; mcount += n;
      const p = n ? Math.round(18 + 82 * Math.sqrt(n / max)) : 0;
      const cls = ['yd', n && 'has', p > 55 && 'hot', k === todayIso && 'today'].filter(Boolean).join(' ');
      cells += n ? `<button class="${cls}" style="--p:${p}%" data-day="${k}" title="${fmtDay(k)} · ${ispita(n)}">${d}</button>` : `<span class="${cls}">${d}</span>`;
    }

function renderList() {

  let h = '<div class="tablewrap"><table><thead><tr><th>Vreme</th><th>Predmet</th><th>Šifra</th><th>Nivo</th><th>Sem.</th><th>Modul</th><th>Akred.</th><th>Rok</th></tr></thead><tbody>';

  }
  h += '</tbody></table></div>';
  if (FILTERED.length > list.length) h += `<div class="more"><button class="btn" id="moreBtn">Prikaži još (${FILTERED.length - list.length} preostalo)</button></div>`;
  $('#viewArea').innerHTML = h;
  $('#period').innerHTML = `Lista<small>${ispita(FILTERED.length)}</small>`;
}

function emptyFiltered() {
  return `<div class="empty"><strong>Nema ispita za izabrane filtere</strong>Promeni ili poništi filtere da vidiš više.</div>`;
}

function renderDay() {
  const p = $('#dayPanel');
  if (!S.selDay) {
    const upcoming = FILTERED.find(e => e.datum >= todayIso);
    p.innerHTML = `<div class="empty"><strong>Izaberi dan</strong>Klikni na dan u kalendaru da vidiš sve ispite tog dana.${upcoming ? `<div style="margin-top:12px"><button class="btn" data-day="${upcoming.datum}">Sledeći ispitni dan: ${upcoming.datum.slice(8)}.${upcoming.datum.slice(5, 7)}.</button></div>` : ''}</div>`;
    return;
  }
  const list = FILTERED.filter(e => e.datum === S.selDay);
  let h = `<div class="dh"><h2>${cap(fmtDay(S.selDay))}</h2><div class="dsub">${ispita(list.length)}${list.length ? ' · ' + num(uniq(list.map(e => e.predmet)).length, 'predmet', 'predmeta', 'predmeta') : ''}</div></div>`;
  if (!list.length) { p.innerHTML = h + '<div class="empty">Nema ispita ovog dana uz trenutne filtere.</div>'; return; }
  const slots = {};
  for (const e of list) ((slots[e.vreme] = slots[e.vreme] || {})[e.predmet] = slots[e.vreme][e.predmet] || []).push(e);
  for (const t of Object.keys(slots).sort()) {
    const subj = slots[t];
    h += `<div class="tslot"><b>${t}</b>${ispita(Object.values(subj).reduce((a, b) => a + b.length, 0))}</div>`;
    h += '<div class="subjs">';
    for (const name of Object.keys(subj).sort((a, b) => a.localeCompare(b, 'sr'))) {
      const vs = subj[name];
      h += `<div class="subj"><div class="nm">${esc(name)}</div><div class="vs">` + vs.map(e =>
        `<div class="v"><span class="tag" title="${esc(NIVO_NAZIV[e.nivo] || '')}">${esc(e.nivo)}</span><span class="tag">${e.sem}. sem.</span><span class="tag">${esc(e.modul)}</span><span class="tag code">${esc(e.sifra)}</span><span class="tag">ak. ${e.akred}</span>${S.rokovi.length > 1 ? `<span class="tag rok" style="--c:${S.rokColor[e.rokId]}">${esc(rokShort(e.rokId))}</span>` : ''}</div>`
      ).join('') + '</div></div>';
    }
    h += '</div>';
  }
  p.innerHTML = h;
}

function renderView() {
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === S.view));
  $('#navbtns').hidden = $('#todayBtn').hidden = S.view === 'lista';
  if (!S.loaded) { $('#viewArea').innerHTML = `<div class="empty"><span class="spinner"></span><div style="margin-top:8px">Učitavanje rasporeda…</div></div>`; $('#period').textContent = ''; return; }
  if (!S.exams.length) {
    $('#viewArea').innerHTML = `<div class="hero-empty"><h2>Još nema učitanih rokova</h2><p>Dodaj PDF raspored ispita za jedan rok (npr. decembarski). Podaci se izvlače automatski, prevode na latinicu i prikazuju u kalendaru.</p><button class="btn primary" data-open-upload>Dodaj rok (PDF)</button></div>`;
    $('#period').textContent = ''; return;
  }
  if (S.view === 'mesec') renderMonth(); else if (S.view === 'godina') renderYear(); else renderList();
}

function refresh(keepDay) {
  applyFilters();
  renderFilters();
  renderView();
  renderDay();
}

document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  S.view = b.dataset.view; lsSet(LS_UI, JSON.stringify({ view: S.view })); renderView();
});
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
$('#todayBtn').addEventListener('click', () => { const d = new Date(); S.y = d.getFullYear(); S.m = d.getMonth(); renderView(); });
function step(dir) {
  if (S.view === 'godina') S.y += dir; else { S.m += dir; if (S.m < 0) { S.m = 11; S.y--; } if (S.m > 11) { S.m = 0; S.y++; } }
  renderView();
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-day]');
  if (d) {
    const k = d.dataset.day; S.selDay = k; const dt = parseIso(k);
    if (S.view === 'godina' || S.y !== dt.getFullYear() || S.m !== dt.getMonth()) { S.y = dt.getFullYear(); S.m = dt.getMonth(); if (S.view === 'godina') S.view = 'mesec'; }
    renderView(); renderDay();
    if (window.matchMedia('(max-width: 1260px)').matches) $('#dayPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const mo = e.target.closest('[data-month]');
  if (mo) { const [y, m] = mo.dataset.month.split('-').map(Number); S.y = y; S.m = m; S.view = 'mesec'; renderView(); return; }
  if (e.target.closest('#moreBtn')) { S.listLimit += 500; renderList(); return; }
  if (e.target.closest('[data-open-upload]')) { openUpload(); return; }
  const close = e.target.closest('[data-close]'); if (close) close.closest('dialog').close();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea') || document.querySelector('dialog[open]')) return;
  if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
});

// ================= Upload =================
let pdfLibPromise = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Ne mogu da učitam ' + src)); document.head.appendChild(s); }); }
function loadPdfJs() {
  if (!pdfLibPromise) pdfLibPromise = (async () => {
    await loadScript(PDFJS + 'pdf.min.js');
    await loadScript(PDFJS + 'pdf.worker.min.js'); // radi u glavnoj niti (bez zasebnog workera)
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    return window.pdfjsLib;
  })().catch(e => { pdfLibPromise = null; throw e; });
  return pdfLibPromise;
}

let UP = null; // {fileName, rows, bad, rok, godina}
function openUpload() { UP = null; renderUpload(); $('#uploadDlg').showModal(); }
$('#uploadBtn').addEventListener('click', openUpload);

function renderUpload(state) {
  const b = $('#uploadBody');
  if (state === 'parsing') { b.innerHTML = `<div class="empty"><span class="spinner"></span><div style="margin-top:8px">Čitam PDF i izvlačim ispite…</div></div>`; return; }
  if (state === 'saving') { b.innerHTML = `<div class="empty"><span class="spinner"></span><div style="margin-top:8px">Čuvam ${ispita(UP.rows.length)}…</div></div>`; return; }
  if (!UP) {
    b.innerHTML = `
      <label class="drop" id="drop" for="file">
        <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V9z"/><path d="M14 3v6h6M12 18v-6M9 15l3-3 3 3"/></svg></span>
        <strong>Prevuci PDF ovde ili klikni da izabereš fajl</strong>
        <span>Jedan dokument = jedan ispitni rok. Ćirilica se automatski prebacuje u latinicu.</span>
      </label>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      <div id="upErr"></div>`;
    const drop = $('#drop'), inp = $('#file');
    inp.addEventListener('change', () => inp.files[0] && handleFile(inp.files[0]));
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
    return;
  }
  const dates = UP.rows.map(r => r[6]).sort();
  const id = rokId(UP.godina, UP.rok);
  const existing = S.rokovi.find(r => r.meta.id === id);
  const validYear = /^20\d\d\/20\d\d$/.test(UP.godina);
  b.innerHTML = `
    <div class="stat">
      <div><b>${UP.rows.length}</b>prepoznatih ispita</div>
      <div><b>${uniq(UP.rows.map(r => r[5])).length}</b>predmeta</div>
      <div><b>${uniq(dates).length}</b>ispitnih dana</div>
      <div><b class="mono" style="font-size:15px">${dates[0] ? dates[0].split('-').reverse().join('.') : '—'} – ${dates.length ? dates[dates.length - 1].split('-').reverse().join('.') : ''}</b>period</div>
    </div>
    ${UP.bad.length ? `<details><summary class="warn">${UP.bad.length} redova nije prepoznato (preskočeni)</summary><div class="preview" style="padding:8px;font-size:12px">${UP.bad.slice(0, 50).map(esc).join('<br>')}</div></details>` : ''}
    <div class="form-row">
      <label class="field" for="upRok">Ispitni rok
        <select id="upRok">${ROKOVI.map(([k, l]) => `<option value="${k}"${k === UP.rok ? ' selected' : ''}>${l}</option>`).join('')}</select>
      </label>
      <label class="field" for="upGod">Školska godina
        <input id="upGod" value="${esc(UP.godina)}" placeholder="2026/2027" inputmode="numeric">
      </label>
    </div>
    ${!validYear ? '<div class="warn">Upiši školsku godinu u obliku 2026/2027.</div>' : ''}
    ${existing ? `<div class="warn">Rok „${esc(rokName(id))}“ je već učitan (${ispita(existing.rows.length)}). Čuvanjem ćeš ga zameniti novim podacima.</div>` : ''}
    <div><h3 class="sec" style="margin-bottom:6px">Pregled · ${esc(UP.fileName)}</h3>
      <div class="preview"><table><thead><tr><th>Nivo</th><th>Ak.</th><th>Sem.</th><th>Modul</th><th>Šifra</th><th>Predmet</th><th>Datum</th><th>Vreme</th></tr></thead><tbody>
      ${UP.rows.slice(0, 40).map(r => `<tr><td>${esc(r[0])}</td><td class="mono">${r[1]}</td><td class="mono">${r[2]}</td><td>${esc(r[3])}</td><td class="mono">${esc(r[4])}</td><td>${esc(r[5])}</td><td class="mono nowrap">${r[6].split('-').reverse().join('.')}</td><td class="mono">${r[7]}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div id="upErr"></div>
    <div class="actions">
      <button class="btn" id="upAgain">Izaberi drugi fajl</button>
      <button class="btn primary" id="upSave" ${validYear && UP.rows.length ? '' : 'disabled'}>${existing ? 'Zameni rok' : 'Sačuvaj rok'}</button>
    </div>`;
  $('#upRok').addEventListener('change', e => { UP.rok = e.target.value; renderUpload(); });
  $('#upGod').addEventListener('change', e => { UP.godina = e.target.value.trim().replace(/\s*[-–]\s*/, '/'); renderUpload(); });
  $('#upAgain').addEventListener('click', () => { UP = null; renderUpload(); });
  $('#upSave').addEventListener('click', saveUpload);
}

async function handleFile(file) {
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { showUpErr('Izabrani fajl nije PDF. Izaberi PDF dokument sa rasporedom ispita.'); return; }
  renderUpload('parsing');
  try {
    const lib = await loadPdfJs();
    const data = new Uint8Array(await file.arrayBuffer());
    const pdf = await lib.getDocument({ data, isEvalSupported: false }).promise;
    const lines = await pdfToLines(pdf);
    const { rows, bad } = parseLines(lines);
    if (!rows.length) { UP = null; renderUpload(); showUpErr('U ovom PDF-u nisam našao nijedan red rasporeda. Očekujem kolone: Nivo, Akred., Sem., Modul, Šifra, Predmet, Datum, Vreme. Ako je PDF skeniran (slika), tekst se ne može pročitati.'); return; }
    const g = guessMeta(file.name, rows);
    UP = { fileName: file.name, rows, bad, rok: g.rok, godina: g.godina };
    renderUpload();
  } catch (err) {
    UP = null; renderUpload();
    showUpErr('PDF nije mogao da se pročita: ' + (err && err.message ? err.message : 'nepoznata greška') + '. Proveri da li je fajl ispravan i pokušaj ponovo.');
  }
}
function showUpErr(msg) { const el = $('#upErr'); if (el) el.innerHTML = `<div class="banner err">${esc(msg)}</div>`; }

async function saveUpload() {
  const id = rokId(UP.godina, UP.rok);
  const existing = S.rokovi.find(r => r.meta.id === id);
  const dates = UP.rows.map(r => r[6]).sort();
  const meta = { id, rok: UP.rok, godina: UP.godina, fileName: UP.fileName, uploadedAt: new Date().toISOString(), count: UP.rows.length, od: dates[0], do: dates[dates.length - 1], chunks: Math.ceil(UP.rows.length / CHUNK) };
  const rows = UP.rows;
  renderUpload('saving');
  try {
    await Store.saveRok(meta, rows, existing ? existing.meta.chunks : 0);
    S.rokovi = S.rokovi.filter(r => r.meta.id !== id).concat([{ meta, rows }]);
    rebuild();
    const d = parseIso(meta.od); S.y = d.getFullYear(); S.m = d.getMonth(); S.selDay = null;
    $('#uploadDlg').close();
    refresh();
    toast(`Sačuvano: ${rokName(id)} · ${ispita(rows.length)}`);
  } catch (err) {
    renderUpload();
    const code = err && err.code;
    showUpErr(code === 'quota_exceeded' ? 'Baza je puna. Obriši neki stari rok pa pokušaj ponovo.'
      : code === 'local_full' ? 'Pregledač nema više mesta za čuvanje. Obriši neki stari rok pa pokušaj ponovo.'
      : code === 'not_granted' || code === 'revoked' ? 'Nemaš dozvolu za čuvanje u ovoj aplikaciji. Zamoli vlasnika da ti da pristup za izmene.'
      : 'Čuvanje nije uspelo (' + (err && (err.message || code) || 'greška') + '). Pokušaj ponovo.');
  }
}

// ================= Upravljanje rokovima =================
let confirmId = null;
function renderManage() {
  const b = $('#manageBody');
  if (!S.rokovi.length) { b.innerHTML = `<div class="empty"><strong>Nema učitanih rokova</strong>Dodaj prvi PDF raspored.</div><div class="actions"><button class="btn primary" data-open-upload>Dodaj rok (PDF)</button></div>`; return; }
  b.innerHTML = `<div class="doclist">` + S.rokovi.map(({ meta }) => `
    <div class="doc" style="--c:${S.rokColor[meta.id]}">
      <span class="sw"></span>
      <div class="info"><b>${esc(rokLabel(meta.rok))} rok ${esc(meta.godina)}</b>
        <div>${ispita(meta.count)} · ${meta.od.split('-').reverse().join('.')} – ${meta.do.split('-').reverse().join('.')} · ${esc(meta.fileName || '')}</div></div>
      ${confirmId === meta.id
        ? `<span class="warn">Obrisati ovaj rok?</span><button class="btn" data-cancel>Otkaži</button><button class="btn danger solid" data-del="${esc(meta.id)}">Obriši</button>`
        : `<button class="btn danger" data-ask="${esc(meta.id)}">Obriši</button>`}
    </div>`).join('') + `</div>
    <div class="actions"><button class="btn primary" data-open-upload>Dodaj još jedan rok</button></div>`;
}
$('#manageBtn').addEventListener('click', () => { confirmId = null; renderManage(); $('#manageDlg').showModal(); });
$('#manageBody').addEventListener('click', async e => {
  if (e.target.closest('[data-open-upload]')) { $('#manageDlg').close(); return; }
  const ask = e.target.closest('[data-ask]'); if (ask) { confirmId = ask.dataset.ask; renderManage(); return; }
  if (e.target.closest('[data-cancel]')) { confirmId = null; renderManage(); return; }
  const del = e.target.closest('[data-del]');
  if (del) {
    const r = S.rokovi.find(r => r.meta.id === del.dataset.del); if (!r) return;
    del.disabled = true; del.textContent = 'Brišem…';
    try {
      await Store.deleteRok(r.meta);
      S.rokovi = S.rokovi.filter(x => x !== r); confirmId = null; rebuild(); refresh(); renderManage();
      toast('Obrisano: ' + rokLabel(r.meta.rok) + ' ' + r.meta.godina);
    } catch (err) { confirmId = null; renderManage(); toast('Brisanje nije uspelo. Pokušaj ponovo.'); }
  }
});

// ================= Start =================
function storeInfo() {
  const n = S.rokovi.length;
  const where = Store.mode === 'db' ? 'sačuvano u aplikaciji' : Store.mode === 'local' ? 'sačuvano samo u ovom pregledaču' : 'nije sačuvano (privatni prozor)';
  $('#storeInfo').textContent = `${num(n, 'rok', 'roka', 'rokova')} · ${ispita(S.exams.length)} · ${where}`;
}
const _refresh = refresh;
refresh = function (k) { _refresh(k); storeInfo(); };

function pickInitialMonth() {
  if (!S.exams.length) return;
  const next = S.exams.find(e => e.datum >= todayIso) || S.exams[S.exams.length - 1];
  const d = parseIso(next.datum); S.y = d.getFullYear(); S.m = d.getMonth();
}

(async function start() {
  renderView(); renderDay();
  await Store.init();
  try {
    S.rokovi = await Store.loadAll();
  } catch (err) {
    S.rokovi = [];
    $('#bannerArea').innerHTML = `<div class="banner err" style="margin-bottom:14px">Sačuvani rasporedi trenutno nisu dostupni. Proveri vezu i osveži stranicu.</div>`;
  }
  rebuild(); pickInitialMonth(); S.loaded = true; refresh();
})();
})();
</script>
