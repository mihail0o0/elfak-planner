}

// pdf.js dokument -> redovi teksta (grupisanje po y, sortiranje po x)
async function pdfToLines(pdf) {
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim() !== '' || (it.str === ' '))
      .map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5], w: it.width, h: Math.abs(it.transform[3]) || 8 }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const groups = [];
    for (const it of items) {
      const g = groups.find(g => Math.abs(g.y - it.y) <= Math.max(2, it.h * 0.35));
      if (g) g.items.push(it); else groups.push({ y: it.y, items: [it] });
    }
    groups.sort((a, b) => b.y - a.y);
    for (const g of groups) {
      g.items.sort((a, b) => a.x - b.x);
      let s = '', end = null;
      for (const it of g.items) {
        if (end !== null && it.x - end > 1) s += ' ';
        s += it.s; end = it.x + it.w;
      }
      lines.push(s);
    }
    page.cleanup && page.cleanup();
  }
  return lines;
}

// pogađanje roka i školske godine
const ROKOVI = [
  ['januarski', 'Januarski'], ['februarski', 'Februarski'], ['martovski', 'Martovski'], ['aprilski', 'Aprilski'],
  ['majski', 'Majski'], ['junski', 'Junski'], ['julski', 'Julski'], ['avgustovski', 'Avgustovski'],
  ['septembarski', 'Septembarski'], ['oktobarski', 'Oktobarski'], ['oktobarski2', 'Oktobarski 2'],
  ['novembarski', 'Novembarski'], ['decembarski', 'Decembarski']
];
const ROK_BY_MONTH = { 1: 'januarski', 2: 'februarski', 3: 'martovski', 4: 'aprilski', 5: 'majski', 6: 'junski', 7: 'julski', 8: 'avgustovski', 9: 'septembarski', 10: 'oktobarski', 11: 'novembarski', 12: 'decembarski' };
function guessMeta(fileName, rows) {
  const f = fold(fileName || '');
  let rok = '';
  for (const [k] of ROKOVI) if (k !== 'oktobarski2' && f.includes(k.slice(0, 5))) { rok = k; break; }
  if (!rok) { const mm = f.match(/(jan|feb|mart|apr|maj|jun|jul|avg|sept|okt|nov|dec)/); if (mm) rok = ROK_BY_MONTH[monthFromWord(mm[1])]; }
  if (/okt\w*\s*(2|ii)\b|oktobarski[-_ ]?2/.test(f)) rok = 'oktobarski2';
  const cnt = {};
  for (const r of rows) { const k = r[6].slice(0, 7); cnt[k] = (cnt[k] || 0) + 1; }
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (!rok && top) rok = ROK_BY_MONTH[+top[0].slice(5, 7)];
  let godina = '';
  const gm = f.match(/(20\d\d)\s*[-_/]\s*(20\d\d)/);
  if (gm) godina = `${gm[1]}/${gm[2]}`;
  else if (top) { const y = +top[0].slice(0, 4), mo = +top[0].slice(5, 7); godina = mo >= 10 ? `${y}/${y + 1}` : `${y - 1}/${y}`; }
  return { rok: rok || 'januarski', godina };
}
function rokLabel(k) { const r = ROKOVI.find(r => r[0] === k); return r ? r[1] : k; }
function rokId(godina, rok) { return `${godina.replace('/', '-')}__${rok}`; }

if (typeof module !== 'undefined') module.exports = { toLatin, fold, parseLine, parseLines, pdfToLines, guessMeta, rokLabel, rokId, ROKOVI };

</script>

// ===== Squircle =====
// Chrome/Edge: CSS `corner-shape: squircle` (u stilu). Ostali pregledači: ovaj kod crta
// glatke uglove (Figma-style smoothing) kao SVG pozadinu sa ivicom i senkom koja prati oblik.
(function () {
  const SUPPORTED = window.CSS && CSS.supports && CSS.supports('corner-shape', 'squircle');
  const SMOOTH = 0.8;

      `a${f(r)} ${f(r)} 0 0 1 ${f(-L)} ${f(-L)}`,

      `L${f(x)} ${f(y + p)}`,

function conflictsFor(inst, exclude) {
  return MY.filter(s => s.plan && s.sifra !== exclude && s.plan.datum === inst.datum)
    .map(s => ({ s, lvl: s.plan.vreme === inst.vreme ? 'major' : 'minor' }))
    .sort((a, b) => (a.lvl === 'major' ? -1 : 1) - (b.lvl === 'major' ? -1 : 1));
}
function conflictText(list) {
  if (!list.length) return '';
  const mj = list.filter(c => c.lvl === 'major'), mn = list.filter(c => c.lvl === 'minor');
  if (mj.length) return `Isto vreme kao ${mj.map(c => c.s.predmet).join(', ')}`;
  return `Isti dan kao ${mn.map(c => `${c.s.predmet} (${c.s.plan.vreme})`).join(', ')}`;
}

// ---- filtriranje kalendara ----
function matchesQ(e) {
  if (!S.f.q) return true;
  const words = fold(S.f.q).split(/\s+/).filter(Boolean);
  for (const w of words) if (!e.key.includes(w)) return false;
  return true;
}
function baseExams() {
  const mine = S.scope === 'moji' && prof();
  return S.exams.filter(e => (!mine || MYEX.has(e.id)) && (!S.f.rok.size || S.f.rok.has(e.rokId)));
}
let FILTERED = [];
function applyFilters() { FILTERED = baseExams().filter(matchesQ).sort((a, b) => a.datum.localeCompare(b.datum) || a.vreme.localeCompare(b.vreme) || cmpExam(a, b)); }

let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); renderSugg(); qTimer = setTimeout(() => { S.f.q = e.target.value.trim(); S.listLimit = 300; refresh(); }, 150); });
let SUGG = [], suggIdx = -1;
function highlight(name, words) {
  const chars = [...name], folded = chars.map(ch => fold(ch));
  const mark = new Array(chars.length).fill(false);
  for (const w of words) {
    for (let i = 0; i < chars.length; i++) {
      let j = i, acc = '';
      while (j < chars.length && acc.length < w.length) acc += folded[j++];
      if (acc.startsWith(w)) { for (let k = i; k < j; k++) mark[k] = true; break; }
    }
  }
  let out = '', open = false;
  chars.forEach((ch, i) => { if (mark[i] && !open) { out += '<mark>'; open = true; } if (!mark[i] && open) { out += '</mark>'; open = false; } out += esc(ch); });
  return out + (open ? '</mark>' : '');
}
function computeSugg(q) {
  const words = fold(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const by = new Map();
  for (const e of baseExams()) {
    let ok = true; for (const w of words) if (!e.key.includes(w)) { ok = false; break; }
    if (!ok) continue;
    let g = by.get(e.predmet);
    if (!g) { g = { name: e.predmet, nk: fold(e.predmet), slots: new Map(), n: 0, codeHit: false, sifre: new Set() }; by.set(e.predmet, g); }
    g.n++; g.slots.set(e.datum + ' ' + e.vreme, true); g.sifre.add(e.sifra);
    if (!words.every(w => g.nk.includes(w))) g.codeHit = true;
  }
  const first = words[0];
  const score = g => (g.nk.startsWith(first) ? 0 : new RegExp('(^|\\s)' + first.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(g.nk) ? 1 : g.codeHit ? 3 : 2);
  return [...by.values()].sort((a, b) => score(a) - score(b) || a.name.localeCompare(b.name, 'sr')).slice(0, 10)
    .map(g => ({ ...g, words, slots: [...g.slots.keys()].sort(), mine: [...g.sifre].find(x => MYMAP.has(x)) }));
}
function renderSugg() {
  const inp = $('#q'), ul = $('#sugg'), q = inp.value.trim();
  SUGG = q ? computeSugg(q) : []; suggIdx = -1;
  if (!q || document.activeElement !== inp) { ul.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
  ul.innerHTML = SUGG.length ? SUGG.map((g, i) => {
    const sl = g.slots, when = sl.length === 1 ? `${fmtShort(sl[0].slice(0, 10))} ${sl[0].slice(11)}` : `${termina(sl.length)} · prvi ${fmtShort(sl[0].slice(0, 10))} ${sl[0].slice(11)}`;
    const ms = g.mine ? MYMAP.get(g.mine) : null;
    const st = ms ? (ms.plan ? ` · zakazan ${fmtShort(ms.plan.datum)}` : ' · moj ispit') : '';
    return `<li role="option" id="sg${i}" data-i="${i}" aria-selected="false"><span class="sn">${highlight(g.name, g.words)}</span><span class="sm">${when}${st}</span></li>`;
  }).join('') : '<li class="none">Nema predmeta koji odgovaraju</li>';
  ul.hidden = false; inp.setAttribute('aria-expanded', 'true');
}
function moveSugg(d) {
  if (!SUGG.length) return;
  suggIdx = (suggIdx + d + SUGG.length) % SUGG.length;
  document.querySelectorAll('#sugg li[data-i]').forEach(li => li.setAttribute('aria-selected', +li.dataset.i === suggIdx));
  const cur = $('#sg' + suggIdx); if (cur) { cur.scrollIntoView({ block: 'nearest' }); $('#q').setAttribute('aria-activedescendant', 'sg' + suggIdx); }
}
function closeSugg() { $('#sugg').hidden = true; $('#q').setAttribute('aria-expanded', 'false'); $('#q').removeAttribute('aria-activedescendant'); }
function pickSugg(i) {
  const g = SUGG[i]; if (!g) return;
  closeSugg(); clearTimeout(qTimer);
  if (g.mine) { $('#q').value = ''; S.f.q = ''; startPick(g.mine); return; }
  $('#q').value = g.name; S.f.q = g.name; S.listLimit = 300;
  const d0 = g.slots[0].slice(0, 10), dt = parseIso(d0);
  S.selDay = d0; S.y = dt.getFullYear(); S.m = dt.getMonth(); if (S.view === 'godina' || S.view === 'plan') S.view = 'mesec';
  refresh();
}
$('#q').addEventListener('keydown', e => {
  const open = !$('#sugg').hidden;
  if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) renderSugg(); moveSugg(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSugg(-1); }
  else if (e.key === 'Enter' && open && suggIdx >= 0) { e.preventDefault(); pickSugg(suggIdx); }
  else if (e.key === 'Escape' && open) { e.preventDefault(); closeSugg(); }
});
$('#q').addEventListener('focus', renderSugg);
$('#q').addEventListener('blur', () => setTimeout(closeSugg, 120));
$('#sugg').addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); pickSugg(+li.dataset.i); } });

function startPick(sifra) {
  const s = MYMAP.get(sifra); if (!s) return;
  S.pick = sifra;
  if (S.view !== 'mesec' && S.view !== 'godina') S.view = 'mesec';
  const target = (s.plan && s.plan.datum) || (s.inst.find(i => i.datum >= todayIso) || s.inst[0] || {}).datum;
  if (target) { const d = parseIso(target); S.y = d.getFullYear(); S.m = d.getMonth(); S.selDay = target; }

}
function cancelPick() { S.pick = null; refresh(); }

// svako zakazivanje ide preko potvrde (sa pregledom konflikata)
function schedule(sifra, inst, confirmed) {
  const s = MYMAP.get(sifra), p = prof(); if (!s || !p) return;
  if (!confirmed) { openConfirm(sifra, inst); return; }
  const cs = conflictsFor(inst, sifra), major = cs.filter(c => c.lvl === 'major'), minor = cs.filter(c => c.lvl === 'minor');
  const prev = p.plan[sifra] ? { ...p.plan[sifra] } : null;
  p.plan[sifra] = { rokId: inst.rokId, datum: inst.datum, vreme: inst.vreme };
  Me.save(); S.pick = null; S.selDay = inst.datum; derive(); refresh();
  const undo = { label: 'Poništi', fn: () => { if (prev) p.plan[sifra] = prev; else delete p.plan[sifra]; Me.save(); derive(); refresh(); } };
  if (major.length) toast(`Zakazano uprkos konfliktu: isto vreme kao ${major[0].s.predmet}.`, undo);
  else if (minor.length) toast(`Zakazano. Istog dana imaš i ${minor[0].s.predmet} u ${minor[0].s.plan.vreme}.`, undo);
  else toast(`Zakazano: ${s.predmet}, ${fmtShort(inst.datum)} u ${inst.vreme}.`, undo);
}
function unschedule(sifra) {
  const p = prof(); if (!p || !p.plan[sifra]) return;
  const prev = { ...p.plan[sifra] }, s = MYMAP.get(sifra);
  delete p.plan[sifra]; Me.save(); derive(); refresh();
  toast(`Uklonjen termin: ${s ? s.predmet : sifra}.`, { label: 'Poništi', fn: () => { p.plan[sifra] = prev; Me.save(); derive(); refresh(); } });
}
function markPassed(sifra) {
  const p = prof(); if (!p || !p.remaining[sifra]) return;

  delete p.remaining[sifra]; delete p.plan[sifra];
  p.passed = { ...(p.passed || {}), [sifra]: { n: rem.n, s: rem.s, at: todayIso, ocena: null } };
  if (S.pick === sifra) S.pick = null;
  S.menuFor = null; Me.save(); derive(); refresh();

}
function removeFromList(sifra) {

function addToList(sifra) {

function confPill(s) {

  return `<span class="pill ${s.conf}" title="${esc(conflictText(s.confWith))}">${s.conf === 'major' ? 'Konflikt: isto vreme' : 'Isti dan'}</span>`;
}

// ---- Plan ----
function renderPlan() {
  const p = prof();
  if (!p) {
    $('#viewArea').innerHTML = `<div class="hero-empty"><h2>Napravi svoj plan ispita</h2><p>Podesi studije, godinu i modul, označi ispite koji su ti ostali, pa im biraj termine iz učitanih rokova.</p><button class="btn primary" data-open-settings>Podesi profil</button></div>`;
    $('#period').innerHTML = 'Moj plan'; return;
  }
  const planned = plannedList(), unplanned = MY.filter(s => !s.plan);
  const nMajor = planned.filter(s => s.conf === 'major').length, nMinor = planned.filter(s => s.conf === 'minor').length;
  const next = planned.find(s => s.plan.datum >= todayIso);
  let h = '<div class="planv">';
  h += `<div class="stats">
    <div class="stat2"><b>${MY.length}</b>preostalih ispita</div>
    <div class="stat2"><b>${planned.length}</b>zakazano</div>
    <div class="stat2"><b>${unplanned.length}</b>bez termina</div>
    <div class="stat2${nMajor ? ' bad' : ''}"><b>${nMajor + nMinor}</b>${nMajor ? `${num(nMajor, 'ispit', 'ispita', 'ispita')} u istom terminu` : nMinor ? 'istog dana' : 'konflikata'}</div>
  </div>`;
  if (next) {
    h += `<div class="nextcard"><div><div class="nl">Sledeći ispit</div><div class="nn">${esc(next.predmet)}</div><div class="nd">${cap(fmtDay(next.plan.datum))} u ${next.plan.vreme} · ${esc(rokName(next.plan.rokId))}</div></div><div class="cd">${countdown(next.plan.datum).replace(/^za /, '')}<small>${daysBetween(todayIso, next.plan.datum) > 1 ? 'do ispita' : ''}</small></div></div>`;
  }
  if (!MY.length) {
    h += `<div class="empty"><strong>Lista ispita je prazna</strong>Označi ispite koji su ti ostali da bi mogao/la da ih planiraš.<br><button class="btn primary" data-open-settings="ispiti">Izaberi ispite</button></div>`;
  }
  if (planned.length) {
    h += `<div><div class="sechead"><h3>Zakazani ispiti</h3><span class="muted">${ispita(planned.length)}</span></div><div class="timeline">`;
    planned.forEach((s, i) => {
      if (i > 0) {
        const gap = daysBetween(planned[i - 1].plan.datum, s.plan.datum);
        h += `<div class="gap${gap <= 1 ? ' tight' : ''}">${gap === 0 ? 'isti dan' : gap === 1 ? 'sledeći dan' : `${dana(gap)} razmaka`}</div>`;
      }
      const d = parseIso(s.plan.datum), past = s.plan.datum < todayIso;
      h += `<div class="titem">
        <div class="dbadge ${s.conf || ''}${past ? ' past' : ''}"><span>${DANI_KRATKO[d.getDay()]}</span><b>${d.getDate()}</b><span>${MES_KRATKO[d.getMonth()]}</span></div>
        <div class="tinfo"><div class="tn">${esc(s.predmet)}${starBtn(s.sifra, 'inl')}</div>
          <div class="tm"><span class="mono"><b style="color:var(--ink)">${s.plan.vreme}</b></span><span>${s.sem}. sem.</span>${rokTag(s.plan.rokId)}<span>${countdown(s.plan.datum)}</span>${(() => { const fw = friendsOnTerm(s, s.plan); return fw.length ? `<span class="fwith">${avatarStack(fw, 20, 3)} sa ${esc(fw.map(f => f.ime || fullName(f)).join(', '))}</span>` : ''; })()}</div>
          ${s.conf ? `<div class="note ${s.conf}" style="font-size:12.5px;margin-top:4px;font-weight:600">${s.conf === 'major' ? 'Konflikt' : 'Upozorenje'}: ${esc(conflictText(s.confWith).replace(/^I/, 'i'))}</div>` : ''}
        </div>
        <div class="tact"><button class="btn sm" data-pick="${esc(s.sifra)}">Promeni</button><button class="iconbtn" style="width:36px;height:36px" data-unplan="${esc(s.sifra)}" aria-label="Ukloni termin" title="Ukloni termin"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M10 21.75H14C17.7712 21.75 19.6569 21.75 20.8284 20.5784C22 19.4069 22 17.5212 22 13.75V11.75C22 7.97876 22 6.09315 20.8284 4.92157C19.6569 3.75 17.7712 3.75 14 3.75H10C6.22876 3.75 4.34315 3.75 3.17157 4.92157C2 6.09315 2 7.97876 2 11.75V13.75C2 17.5212 2 19.4069 3.17157 20.5784C4.34315 21.75 6.22876 21.75 10 21.75Z"/><path d="M2.03516 8.75H21.965"/><path d="M7 3.78496V2.25"/><path d="M17 3.78496V2.25"/><path d="M10 17.25L12 15.25M12 15.25L14 13.25M12 15.25L14 17.25M12 15.25L10 13.25"/></g></svg></button></div>
      </div>`;
    });
    h += '</div></div>';
  }
  if (unplanned.length) {
    h += `<div><div class="sechead"><h3>Bez termina</h3><span class="muted">${ispita(unplanned.length)}</span></div><div class="ucards" style="margin-top:10px">`;
    for (const s of unplanned) {
      const n = s.inst.length;
      h += `<div class="ucard"><div class="un">${esc(s.predmet)}${starBtn(s.sifra, 'inl')}</div><div class="um">${s.sem}. sem. · ${TIP_NAZIV[s.tip]}${s.stale ? ' · stari termin više ne postoji' : ''}<br>${n ? termina(n) + ': ' + s.inst.slice(0, 3).map(i => fmtShort(i.datum)).join(', ') + (n > 3 ? '…' : '') : 'nema termina u učitanim rokovima'}</div>
        ${n ? `<button class="btn primary sm" data-pick="${esc(s.sifra)}">Izaberi termin</button>` : (S.isAdmin ? `<button class="btn sm" data-manage>Dodaj rok</button>` : '')}</div>`;
    }
    h += '</div></div>';
  }
  h += '</div>';
  $('#viewArea').innerHTML = h;
  $('#period').innerHTML = `Moj plan<small>${planned.length} od ${MY.length} zakazano</small>`;
}

// ---- Mesec ----
function renderMonth() {
  const days = byDay(FILTERED);
  const plannedBy = byDay(MY.filter(s => s.plan), s => s.plan.datum);
  const pick = S.pick ? MYMAP.get(S.pick) : null;
  const pickBy = pick ? byDay(pick.inst) : null;
  const mine = S.scope === 'moji' && prof();
  const first = new Date(S.y, S.m, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  let h = '<div class="month"><div class="mgrid">' + DANI.map(d => `<div class="mhead">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i === 35 && d.getMonth() !== S.m) break;
    const k = iso(d), list = days[k] || [], pl = (plannedBy[k] || []).slice().sort((a, b) => a.plan.vreme.localeCompare(b.plan.vreme) || cmpSubj(a, b)), out = d.getMonth() !== S.m;
    const chips = pl.slice(0, 3).map(s => `<div class="pchip ${s.conf || ''}" title="${esc(s.predmet)} · ${s.plan.vreme}${s.conf ? ' · ' + esc(conflictText(s.confWith)) : ''}"><b>${s.plan.vreme}</b> ${esc(s.predmet)}</div>`).join('') + (pl.length > 3 ? `<div class="opts">+${pl.length - 3} zakazano</div>` : '');
    const base = ['mcell', out && 'out', k === todayIso && 'today', k === S.selDay && 'sel', d.getDay() % 6 === 0 && 'weekend'];
    let inner = `<div class="dn"><span>${d.getDate()}</span>`, cls, clickable = false, attr = `data-day="${k}"`;
    if (pick) {
      const opts = pickBy[k] || [];
      if (opts.length) {
        const cs = conflictsFor(opts[0], pick.sifra), lvl = cs.length ? cs[0].lvl : '';
        cls = [...base, 'has', 'opt', lvl && lvl + '-c'];
        inner += `</div><div class="ot">${uniq(opts.map(o => o.vreme)).join(', ')}${pick.plan && pick.plan.datum === k ? ' · trenutno' : ''}</div>` + (lvl ? `<div class="cw ${lvl}">${lvl === 'major' ? 'Isto vreme' : 'Isti dan'}: ${esc(cs[0].s.predmet)}</div>` : '') + chips;
        clickable = true; attr = `data-pickday="${k}"`;
      } else {
        cls = [...base, 'dim', pl.length && 'mine-has'];
        inner += `</div>${chips}`;
      }
    } else if (mine) {
      const options = uniq(list.filter(e => { const s = MYMAP.get(e.sifra); return s && !s.plan; }).map(e => e.sifra)).length;
      cls = [...base, (pl.length || list.length) && 'has'];
      inner += `</div>${chips}` + (options ? `<div class="opts">${num(options, 'ispit za izbor', 'ispita za izbor', 'ispita za izbor')}</div>` : '');
      clickable = pl.length || list.length;
    } else {
      cls = [...base, list.length && 'has'];
      inner += `${list.length ? `<span class="total">${list.length}</span>` : ''}</div>${chips}`;
      if (list.length && !pl.length) {
        const slots = {}; for (const e of list) slots[e.vreme] = (slots[e.vreme] || 0) + 1;
        for (const [t, n] of Object.entries(slots).sort()) inner += `<div class="slot"><b>${t}</b>${n}</div>`;
      }
      clickable = list.length || pl.length;
    }
    if (S.showFriends && FEX_BY_DATE[k]) {
      const fx = FEX_BY_DATE[k], rel = pick ? fx.filter(x => sameSubject(pick, x.sifra, x.n)) : fx;
      const people = uniq(rel.map(x => x.f));
      if (people.length) { inner += `<div class="favs">${avatarStack(people, 20, 3)}${pick ? '<span>isti ispit</span>' : ''}</div>`; if (!pick) { clickable = true; if (!cls.includes('has')) cls.push('has'); } }
    }
    const c = cls.filter(Boolean).join(' ');
    h += clickable ? `<button class="${c}" ${attr} aria-label="${fmtDay(k)}">${inner}</button>` : `<div class="${c}">${inner}</div>`;
  }
  h += '</div></div>';
  $('#viewArea').innerHTML = h;
  const ym = `${S.y}-${pad(S.m + 1)}`;
  const nPl = MY.filter(s => s.plan && s.plan.datum.startsWith(ym)).length;
  const sub = pick ? termina(pick.inst.filter(i => i.datum.startsWith(ym)).length) + ' ovog meseca' : mine ? `${nPl} zakazano` : ispita(FILTERED.filter(e => e.datum.startsWith(ym)).length);
  $('#period').innerHTML = `${cap(MESECI[S.m])} ${S.y}.<small>${sub}</small>`;
}

// ---- Godina ----
function schoolYearStart() { return S.m >= 9 ? S.y : S.y - 1; }
function renderYear() {
  const y0 = schoolYearStart();
  const pick = S.pick ? MYMAP.get(S.pick) : null;
  const src = pick ? pick.inst : FILTERED;
  const days = byDay(src);
  const plannedBy = byDay(MY.filter(s => s.plan), s => s.plan.datum);
  let max = 0; for (const k in days) max = Math.max(max, days[k].length);
  let h = '<div class="year">', total = 0;
  for (let i = 0; i < 12; i++) {
    const mm = (9 + i) % 12, yy = mm >= 9 ? y0 : y0 + 1;
    const first = new Date(yy, mm, 1), dim = new Date(yy, mm + 1, 0).getDate(), off = (first.getDay() + 6) % 7;
    let mcount = 0, cells = '';
    for (let j = 0; j < off; j++) cells += '<span class="yd e"></span>';
    for (let d = 1; d <= dim; d++) {
      const k = `${yy}-${pad(mm + 1)}-${pad(d)}`, n = (days[k] || []).length, pl = plannedBy[k] || [];
      mcount += n;
      const p = n ? Math.round(18 + 82 * Math.sqrt(n / max)) : 0;
      const cls = ['yd', n && 'has', p > 55 && 'hot', k === todayIso && 'today', pl.length && 'planned', pl.some(s => s.conf === 'major') && 'cmajor'].filter(Boolean).join(' ');
      const tip = `${fmtDay(k)}${n ? ' · ' + (pick ? 'termin' : ispita(n)) : ''}${pl.length ? ' · zakazano: ' + pl.map(s => s.predmet).join(', ') : ''}`;
      cells += n || pl.length ? `<button class="${cls}" style="--p:${p}%" data-day="${k}" title="${esc(tip)}">${d}</button>` : `<span class="${cls}">${d}</span>`;
    }
    total += mcount;
    h += `<div class="ym"><h3><button data-month="${yy}-${mm}">${cap(MESECI[mm])} ${yy}.</button><span>${mcount || ''}</span></h3><div class="ygrid">${DANI.map(x => `<span class="h">${x[0]}</span>`).join('')}${cells}</div></div>`;
  }
  h += '</div>';
  const leg = [18, 45, 72, 100].map(p => `<i style="background:color-mix(in srgb, var(--brand) ${p}%, var(--surface))"></i>`).join('');
  h += `<div class="ylegend">Manje ${leg} više ${pick ? 'termina' : 'ispita'} u danu · <i style="box-shadow:inset 0 0 0 2px var(--brand)"></i> zakazano</div>`;
  $('#viewArea').innerHTML = h;
  $('#period').innerHTML = `Školska ${y0}/${String(y0 + 1).slice(2)}.<small>${pick ? termina(total) : ispita(total)}</small>`;
}

// ---- Lista ----
function renderList() {
  const list = FILTERED.slice(0, S.listLimit);
  if (!FILTERED.length) { $('#viewArea').innerHTML = emptyFiltered(); $('#period').innerHTML = 'Lista'; return; }
  let h = '<div class="tablewrap"><table><thead><tr><th>Vreme</th><th>Predmet</th><th>Status</th><th>Šifra</th><th>Sem.</th><th>Modul</th><th>Rok</th></tr></thead><tbody>';
  let last = '';
  for (const e of list) {
    if (e.datum !== last) { last = e.datum; h += `<tr class="dayrow"><td colspan="7">${cap(fmtDay(e.datum))}</td></tr>`; }
    const s = MYMAP.get(e.sifra);
    const st = s ? (s.plan && s.plan.rokId === e.rokId ? `<span class="pill ${s.conf || 'planned'}">Zakazano</span>` : s.plan ? `<button class="linkbtn" data-sched="${esc(e.id)}">Prebaci ovde</button>` : `<button class="linkbtn" data-sched="${esc(e.id)}">Zakaži</button>`) : '';
    h += `<tr><td class="mono nowrap">${e.vreme}</td><td>${esc(e.predmet)}</td><td class="nowrap">${st}</td><td class="mono nowrap">${esc(e.sifra)}</td><td class="mono">${e.sem}</td><td>${esc(e.modul)}</td><td class="nowrap">${rokTag(e.rokId)}</td></tr>`;
  }
  h += '</tbody></table></div>';
  if (FILTERED.length > list.length) h += `<div class="more"><button class="btn" id="moreBtn">Prikaži još (${FILTERED.length - list.length} preostalo)</button></div>`;
  $('#viewArea').innerHTML = h;
  $('#period').innerHTML = `Lista<small>${ispita(FILTERED.length)}</small>`;
}
function emptyFiltered() {
  if (S.scope === 'moji' && prof() && !S.f.q) return `<div class="empty"><strong>Nema termina za tvoje ispite</strong>U učitanim rokovima nema ispita sa tvoje liste. Uključi „Prikaži i ostale ispite" ili dodaj novi rok.</div>`;
  return `<div class="empty"><strong>Nema ispita za ovu pretragu</strong>Promeni pretragu ili izbor rokova.</div>`;
}

// ---- Panel dana ----
const examById = id => S.exams.find(e => e.id === id);
function schedRow(s, inst, opts = {}) {
  const cs = conflictsFor(inst, s.sifra), lvl = cs.length ? cs[0].lvl : '';
  const isCur = s.plan && s.plan.rokId === inst.rokId;
  const btn = isCur ? `<span class="pill ${s.conf || 'planned'}">Zakazano</span>`
    : `<button class="btn ${lvl === 'major' ? '' : 'primary'} sm" data-sched="${esc(inst.id)}">${s.plan ? 'Prebaci ovde' : 'Zakaži'}</button>`;
  return `<div class="xrow ${isCur ? 'mine' : ''} ${(isCur ? s.conf : lvl) || ''}"><div class="xi">
    <div class="xn">${opts.dateTitle ? `${cap(fmtShort(inst.datum))} · ${inst.vreme}` : esc(s.predmet)}</div>
    <div class="xm">${opts.dateTitle ? '' : `<span class="tag mono">${inst.vreme}</span>`}<span class="tag">${s.sem}. sem.</span>${rokTag(inst.rokId)}${opts.dateTitle ? `<span class="tag">${countdown(inst.datum)}</span>` : ''}</div>
    ${(() => { const fw = S.showFriends ? friendsOnTerm(s, inst) : []; return fw.length ? `<div class="fnote">${avatarStack(fw, 18, 3)}<span>${esc(fw.map(f => f.ime || fullName(f)).join(', '))} ${fw.length === 1 ? 'polaže' : 'polažu'} tada</span></div>` : ''; })()}
    ${!isCur && s.plan && !opts.dateTitle ? `<div class="note muted">Sada zakazano: ${fmtShort(s.plan.datum)} u ${s.plan.vreme}</div>` : ''}
    ${(isCur ? s.confWith.length : cs.length) ? `<div class="note ${isCur ? s.conf : lvl}">${esc(conflictText(isCur ? s.confWith : cs))}</div>` : ''}
  </div>${btn}</div>`;
}
function renderDay() {
  const p = $('#dayPanel');
  const pick = S.pick ? MYMAP.get(S.pick) : null;
  if (pick) {
    let h = `<div class="dh"><h2>${esc(pick.predmet)}</h2><div class="dsub">${pick.sem}. semestar · ${termina(pick.inst.length)}</div></div><div class="dsec">`;
    if (!pick.inst.length) h += `<div class="empty">Nema termina u objavljenim rokovima.${S.isAdmin ? '<br><button class="btn sm" data-manage>Dodaj rok</button>' : ''}</div>`;
    for (const i of pick.inst) h += schedRow(pick, i, { dateTitle: true });
    h += `<div class="actions" style="margin-top:8px;justify-content:space-between"><button class="btn ghost sm" data-passed="${esc(pick.sifra)}">Položen, ukloni sa liste</button><button class="btn sm" data-cancel-pick>Gotovo</button></div></div>`;
    p.innerHTML = h; return;
  }
  if (!S.selDay) {
    const nx = plannedList().find(s => s.plan.datum >= todayIso);
    const upcoming = FILTERED.find(e => e.datum >= todayIso);
    p.innerHTML = `<div class="empty"><strong>Izaberi dan</strong>Klikni na dan u kalendaru da vidiš ispite i zakažeš termin.${nx ? `<div><button class="btn" data-day="${nx.plan.datum}">Sledeći zakazan: ${fmtShort(nx.plan.datum)}</button></div>` : upcoming ? `<div><button class="btn" data-day="${upcoming.datum}">Sledeći ispitni dan: ${fmtShort(upcoming.datum)}</button></div>` : ''}</div>`;
    return;
  }
  const k = S.selDay;
  const pl = MY.filter(s => s.plan && s.plan.datum === k).sort((a, b) => a.plan.vreme.localeCompare(b.plan.vreme) || cmpSubj(a, b));
  const list = FILTERED.filter(e => e.datum === k && !(MYMAP.get(e.sifra) && MYMAP.get(e.sifra).plan && MYMAP.get(e.sifra).plan.rokId === e.rokId));
  let h = `<div class="dh"><h2>${cap(fmtDay(k))}</h2><div class="dsub">${pl.length ? `${pl.length} zakazano · ` : ''}${ispita(list.length)} ${S.scope === 'moji' && prof() ? 'sa tvoje liste' : 'u rasporedu'}</div></div>`;
  if (pl.length) {
    h += `<div class="dsec"><h4>Moj plan</h4>`;
    for (const s of pl) h += `<div class="xrow mine ${s.conf || ''}"><div class="xi"><div class="xn">${esc(s.predmet)}</div><div class="xm"><span class="tag mono">${s.plan.vreme}</span><span class="tag">${s.sem}. sem.</span>${rokTag(s.plan.rokId)}</div>${s.conf ? `<div class="note ${s.conf}">${esc(conflictText(s.confWith))}</div>` : ''}</div><button class="btn sm" data-pick="${esc(s.sifra)}">Promeni</button></div>`;
    h += '</div>';
  }
  if (list.length) {
    const slots = byDay(list, e => e.vreme);
    for (const t of Object.keys(slots).sort()) {
      const seen = new Set();
      h += `<div class="tslot"><b>${t}</b>${ispita(slots[t].length)}</div><div class="dsec" style="padding-top:0">`;
      for (const e of slots[t].sort(cmpExam)) {
        if (seen.has(e.sifra)) continue; seen.add(e.sifra);
        const s = MYMAP.get(e.sifra);
        if (s) h += schedRow(s, CAT.get(e.sifra) ? (CAT.get(e.sifra).inst.find(i => i.rokId === e.rokId) || e) : e);
        else h += `<div class="xrow"><div class="xi"><div class="xn">${esc(e.predmet)}</div><div class="xm"><span class="tag">${esc(e.nivo)}</span><span class="tag">${e.sem}. sem.</span><span class="tag">${esc(e.modul)}</span><span class="tag code">${esc(e.sifra)}</span><span class="tag">ak. ${e.akred}</span>${rokTag(e.rokId)}</div></div></div>`;
      }
      h += '</div>';
    }
  }
  const fx = S.showFriends ? (FEX_BY_DATE[k] || []) : [];
  if (fx.length) {
    h += `<div class="dsec"><h4>Prijatelji ovog dana</h4>`;
    for (const x of fx.slice().sort((a, b) => a.vreme.localeCompare(b.vreme))) {
      const m = myInstFor(x);
      const together = m && m.s && m.s.plan && m.s.plan.datum === x.datum && m.s.plan.vreme === x.vreme;
      const act = together ? `<span class="pill ok">Zajedno</span>` : m && m.inst ? `<button class="btn primary sm" data-fjoin2="${esc(m.inst.id)}" data-fsifra="${esc(m.s.sifra)}">Pridruži se</button>` : '';
      h += `<div class="xrow">${avatarHtml(x.f, 34)}<div class="xi"><div class="xn">${esc(x.n)}</div><div class="xm"><span class="tag mono">${x.vreme}</span><span class="tag">${esc(fullName(x.f))}</span></div></div>${act}</div>`;
    }
    h += '</div>';
  }
  if (!list.length && !pl.length && !fx.length) h += `<div class="empty">Nema ispita ovog dana.</div>`;
  p.innerHTML = h;
}

function renderView() {
  if (S.view !== 'plan') S.calView = S.view;
  if (route === 'plan' && S.view !== 'plan') { location.hash = 'kalendar'; route = 'kalendar'; setRouteUi(); }
  else if (route === 'kalendar' && S.view === 'plan') { location.hash = 'plan'; route = 'plan'; setRouteUi(); }
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === S.view));
  $('#calSeg').hidden = S.view === 'plan';
  document.querySelector('#sec-planer .toolbar').hidden = S.view === 'plan';
  $('#navbtns').hidden = $('#todayBtn').hidden = S.view === 'lista' || S.view === 'plan';

// ================= Čarobnjak (prvi put) i podešavanja (kasnije) =================
// mode 'onboard': koraci profil → studije → … → gotovo. mode 'settings': tabovi Profil / Studije / Ispiti / Privatnost.
const W = { step: 0, d: null, first: false, q: '', mode: 'onboard', tab: 'profil', note: '' };
const STEP_LABEL = { profil: 'Profil', nivo: 'Studije', akred: 'Akreditacija', godina: 'Godina', modul: 'Modul', ispiti: 'Ispiti', kraj: 'Gotovo' };
const TAB_LABEL = window.__auth ? { profil: 'Profil', studije: 'Studije', ispiti: 'Ispiti', privatnost: 'Privatnost', nalog: 'Nalog' } : { profil: 'Profil', studije: 'Studije', ispiti: 'Ispiti', privatnost: 'Privatnost' };
const FAKULTET_DEFAULT = 'Elektronski fakultet u Nišu';
const keyOf = d => [d.nivo, d.akred, d.godina, d.modul].join('|');
function uniqSubjects(fn) { const m = new Map(); for (const e of S.exams) if (fn(e) && !m.has(e.sifra)) m.set(e.sifra, e); return [...m.values()]; }
function nivoOpts() {
  return uniq(S.exams.map(e => e.nivo)).sort((a, b) => (a === 'OAS' ? -1 : b === 'OAS' ? 1 : a.localeCompare(b)))
    .map(v => ({ v, n: uniqSubjects(e => e.nivo === v).length }));
}
function akredOpts(nivo) {
  return uniq(S.exams.filter(e => e.nivo === nivo).map(e => e.akred)).sort((a, b) => b - a).map(v => {
    const subs = uniqSubjects(e => e.nivo === nivo && e.akred === v);
    const pref = Object.entries(subs.reduce((m, e) => (m[e.sifra[0]] = (m[e.sifra[0]] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1])[0];
    const sems = uniq(subs.map(e => e.sem)).sort((a, b) => a - b);
    return { v, n: subs.length, pref: pref ? pref[0] : '', ex: subs.find(e => e.sem === sems[0]), sems };
  });
}
function godinaOpts(nivo, akred) {
  const max = Math.max(0, ...S.exams.filter(e => e.nivo === nivo && e.akred == akred).map(e => e.sem));
  return Array.from({ length: Math.max(1, Math.ceil(max / 2)) }, (_, i) => i + 1);
}
function modulOpts(nivo, akred, godina) {
  const subs = uniqSubjects(e => e.nivo === nivo && e.akred == akred && e.sem <= godina * 2 && e.modul !== 'SVI');
  const by = {}; for (const e of subs) (by[e.modul] = by[e.modul] || []).push(e);
  return Object.keys(by).sort().map(v => {
    const list = by[v].sort((a, b) => (subjType(a.sifra) === 'O' ? 0 : 1) - (subjType(b.sifra) === 'O' ? 0 : 1) || a.sem - b.sem);
    return { v, n: list.length, ex: list.filter(e => subjType(e.sifra) === 'O').slice(0, 3).map(e => e.predmet) };
  });
}
function wizSteps() {
  const d = W.d, st = ['profil', 'nivo', 'akred'];
  if (!(d.nivo && d.akred) || godinaOpts(d.nivo, d.akred).length > 1) st.push('godina');
  if (!(d.nivo && d.akred && d.godina) || modulOpts(d.nivo, d.akred, d.godina).length) st.push('modul');
  st.push('ispiti', 'kraj');
  return st;
}
const needsModul = d => !!(d.nivo && d.akred && d.godina && modulOpts(d.nivo, d.akred, d.godina).length);
function wizValid(step) {
  const d = W.d;
  if (step === 'profil') return !!(d.ime.trim() && d.prezime.trim());
  if (step === 'nivo') return !!d.nivo;
  if (step === 'akred') return !!d.akred;
  if (step === 'godina') return !!d.godina;
  if (step === 'modul') return !!d.modul;
  if (step === 'studije') return !!(d.nivo && d.akred && d.godina && (d.modul || !needsModul(d)));
  return true;
}
// pametni podrazumevani izbor: obavezni i završni predmeti iz tekuće godine
function defaultRemaining(cat) {
  const g = W.d.godina, set = new Set();

}
function openWizard(first, startAt) {

    if (field === 'godina' && d.modul && !modulOpts(d.nivo, d.akred, d.godina).some(o => o.v === d.modul)) d.modul = null;
  }
  if (d.nivo && d.akred && !d.godina) { const g = godinaOpts(d.nivo, d.akred); if (g.length === 1) d.godina = g[0]; }

// Javna kartica svakog korisnika: people/<uid> (piše samo on). Prijateljstvo = oboje imaju jedno drugo u `friends`.
const F = { people: new Map(), mine: null, ready: false, err: null, view: 'list', tab: 'friends', q: '', detail: null, confirmRemove: null };
let FR = { friends: [], outgoing: [], incoming: [] }, FEX = [], FEX_BY_DATE = {};

// ---- avatari ----
const FOTO_RE = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/;
function hueOf(str) { let h = 0; for (const ch of String(str || '?')) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function initials(p) { const a = (p.ime || '').trim(), b = (p.prezime || '').trim(); return ((a[0] || '') + (b[0] || '')).toUpperCase() || '?'; }
const fullName = p => [p.ime, p.prezime].filter(Boolean).join(' ').trim() || 'Bez imena';
function avatarHtml(p, size = 28, title) {
  const st = `width:${size}px;height:${size}px;font-size:${Math.max(9, Math.round(size * 0.38))}px`;
  const t = title ? ` title="${esc(title)}"` : '';
  if (p.foto && FOTO_RE.test(p.foto)) return `<img class="av" src="${p.foto}" alt=""${t} style="${st}">`;
  return `<span class="av" style="${st};--h:${hueOf(p.uid || fullName(p))}"${t} aria-hidden="true">${esc(initials(p))}</span>`;
}
function avatarStack(people, size = 22, max = 3) {
  if (!people.length) return '';
  const shown = people.slice(0, max).map(p => avatarHtml(p, size, fullName(p))).join('');
  return `<span class="avs" title="${esc(people.map(fullName).join(', '))}">${shown}${people.length > max ? `<span class="av more" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.4)}px">+${people.length - max}</span>` : ''}</span>`;
}

// ---- tuđi podaci su nepouzdani: uzimamo samo očekivana polja ----
const str = (v, n) => (typeof v === 'string' ? v.slice(0, n) : '');
function sanitizePerson(uid, v) {
  const plan = {}, remaining = {};
  if (v && typeof v.plan === 'object' && v.plan) for (const [k, e] of Object.entries(v.plan).slice(0, 200)) {
    if (e && /^\d{4}-\d{2}-\d{2}$/.test(e.datum) && /^\d{2}:\d{2}$/.test(e.vreme)) plan[str(k, 20)] = { n: str(e.n, 120) || k, s: +e.s || 0, rokId: str(e.rokId, 80), datum: e.datum, vreme: e.vreme };
  }
  if (v && typeof v.remaining === 'object' && v.remaining) for (const [k, n] of Object.entries(v.remaining).slice(0, 300)) remaining[str(k, 20)] = str(n, 120) || k;
  return {
    uid, ime: str(v.ime, 40), prezime: str(v.prezime, 40), indeks: str(v.indeks, 20), fakultet: str(v.fakultet, 80),
    foto: FOTO_RE.test(v.foto || '') && v.foto.length < 120000 ? v.foto : '',
    nivo: str(v.nivo, 4), akred: +v.akred || null, godina: +v.godina || null, modul: str(v.modul, 6),
    friends: Array.isArray(v.friends) ? v.friends.filter(x => typeof x === 'string').slice(0, 500) : [],
    share: v.share !== false, plan, remaining,
    pub: v.pub && typeof v.pub.x === 'string' && typeof v.pub.y === 'string' && v.pub.x.length < 64 && v.pub.y.length < 64 ? { x: v.pub.x, y: v.pub.y } : null,
    chats: sanitizeChats(v.chats),
    groups: Array.isArray(v.groups) ? v.groups.filter(g => typeof g === 'string' && /^fak-[a-z0-9-]{1,40}$/.test(g)).slice(0, 20) : [],
    leftChats: Array.isArray(v.leftChats) ? v.leftChats.filter(g => typeof g === 'string').slice(0, 500) : [],
    act: v.act && typeof v.act === 'object' ? Object.fromEntries(Object.entries(v.act).filter(([k, t]) => typeof t === 'number' && k.length < 200).slice(0, 500)) : {}
  };
}
function sanitizeChats(chats) {
  const out = {}; if (!chats || typeof chats !== 'object') return out;
  const ids = a => Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.length < 80).slice(0, 500) : [];
  for (const [cid, m] of Object.entries(chats).slice(0, 200)) {
    if (!/^(dm|g)-[A-Za-z0-9_-]{1,160}$/.test(cid) || !m || typeof m !== 'object') continue;
    const keys = {};
    if (m.keys && typeof m.keys === 'object') for (const [kv, ks] of Object.entries(m.keys).slice(0, 8)) {
      if (!ks || typeof ks !== 'object') continue; keys[kv] = {};
      for (const [u, w] of Object.entries(ks).slice(0, 500)) if (w && typeof w.iv === 'string' && typeof w.ct === 'string' && w.ct.length < 200) keys[kv][u] = { iv: w.iv, ct: w.ct };
    }
    out[cid] = { kind: m.kind === 'dm' ? 'dm' : 'group', name: str(m.name, 60), members: ids(m.members), admins: ids(m.admins), mode: m.mode === 'admins' ? 'admins' : 'all', kv: +m.kv || 1, keys, created: +m.created || 0 };
  }
  return out;
}
function publicBody(p) {
  const share = p.share !== false, plan = {}, remaining = {};
  if (share) {
    for (const [k, e] of Object.entries(p.plan || {})) plan[k] = { ...e, n: (p.remaining[k] || {}).n || k, s: (p.remaining[k] || {}).s || 0 };
    for (const [k, e] of Object.entries(p.remaining || {})) remaining[k] = e.n;
  }
  return { uid: Me.uid, ime: p.ime || '', prezime: p.prezime || '', indeks: p.indeks || '', fakultet: p.fakultet || '', foto: p.foto || '',
    nivo: p.nivo || '', akred: p.akred || 0, godina: p.godina || 0, modul: p.modul || '', friends: p.friends || [], share, plan, remaining,
    pub: p.ck && p.ck.pub ? { x: p.ck.pub.x, y: p.ck.pub.y } : null,
    chats: Object.fromEntries(Object.entries(p.chatsOwned || {}).map(([cid, m]) => [cid, { kind: m.kind, name: m.name || '', members: m.members || [], admins: m.admins || [], mode: m.mode || 'all', kv: m.kv || 1, keys: m.keys || {}, created: m.created || 0 }])),
    groups: p.groups || [], leftChats: p.leftChats || [], act: p.act || {},
    updatedAt: new Date().toISOString() };
}

function subscribePeople() {
  if (Me.mode !== 'db') return;
  const timer = setTimeout(() => { if (!F.ready) { F.err = 'timeout'; renderFriendsUi(); } }, 10000);
  Store.db.collection('people').onSnapshot(snap => {
    clearTimeout(timer); F.ready = true; F.err = null;
    F.people = new Map(); F.mine = null;
    for (const d of snap.docs) { const v = d.data() || {}; if (d.id === Me.uid) F.mine = v; else F.people.set(d.id, sanitizePerson(d.id, v)); }
    deriveFriends(); refreshSoon(); renderFriendsUi(); onPeopleChanged();
    const p = prof();
    if (p && p.onboarded && !snap.metadata.fromCache && (!F.mine || F.mine.ime !== p.ime || (F.mine.friends || []).length !== (p.friends || []).length)) Me.save();
  }, err => { clearTimeout(timer); F.err = err && err.code || 'unavailable'; renderFriendsUi(); });
}

let refreshTimer = 0;
function refreshSoon() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 120); }
function deriveFriends() {
  const p = prof(), my = new Set((p && p.friends) || []), ignored = new Set((p && p.ignored) || []);
  const isMutual = u => { const o = F.people.get(u); return o && o.friends.includes(Me.uid); };
  FR.friends = [...my].filter(isMutual).map(u => F.people.get(u)).sort((a, b) => fullName(a).localeCompare(fullName(b), 'sr'));
  FR.outgoing = [...my].filter(u => !isMutual(u)).map(u => F.people.get(u) || { uid: u, ime: 'Nepoznat', prezime: 'korisnik', friends: [], plan: {}, remaining: {} });
  FR.incoming = [...F.people.values()].filter(o => o.friends.includes(Me.uid) && !my.has(o.uid) && !ignored.has(o.uid));
  FEX = [];
  for (const f of FR.friends) for (const [sifra, e] of Object.entries(f.plan)) FEX.push({ f, sifra, n: e.n, key: fold(e.n), datum: e.datum, vreme: e.vreme, rokId: e.rokId });
  FEX_BY_DATE = byDay(FEX);
}
const sameSubject = (s, sifra, name) => sifra === s.sifra || fold(name) === fold(s.predmet);
// prijatelji koji imaju isti predmet (zakazan ili na listi)
function friendsWithSubject(s) {
  return FR.friends.filter(f => Object.entries(f.plan).some(([k, e]) => sameSubject(s, k, e.n)) || Object.entries(f.remaining).some(([k, n]) => sameSubject(s, k, n)));
}
// prijatelji koji su isti predmet zakazali u istom terminu
function friendsOnTerm(s, inst) {
  return uniq(FEX.filter(x => x.datum === inst.datum && x.vreme === inst.vreme && sameSubject(s, x.sifra, x.n)).map(x => x.f));
}
function myInstFor(x) {
  const s = MY.find(s => sameSubject(s, x.sifra, x.n)); if (!s) return null;
  const inst = s.inst.find(i => i.datum === x.datum && i.vreme === x.vreme) || s.inst.find(i => i.rokId === x.rokId && i.datum === x.datum);
  return inst ? { s, inst } : { s, inst: null };
}

// ---- izmene prijateljstva (pišemo samo svoj profil) ----
function setFriends(fn, msg) {
  const p = prof(); if (!p) { toast('Prvo podesi svoj profil.'); return; }
  p.friends = fn(new Set(p.friends || []));
  p.friends = [...p.friends];
  Me.save(); deriveFriends(); refresh(); renderFriendsUi();
  if (msg) toast(msg);
}
function addFriend(uid) { const o = F.people.get(uid); setFriends(s => s.add(uid), o && o.friends.includes(Me.uid) ? `${fullName(o)} je sada tvoj prijatelj.` : `Zahtev je poslat: ${o ? fullName(o) : ''}.`); }
function removeFriend(uid) { const o = F.people.get(uid); setFriends(s => (s.delete(uid), s), `${o ? fullName(o) : 'Korisnik'} je uklonjen iz prijatelja.`); }
function ignoreRequest(uid) { const p = prof(); if (!p) return; p.ignored = uniq([...(p.ignored || []), uid]); Me.save(); deriveFriends(); renderFriendsUi(); refresh(); }

}
function commonCount(o) { return MY.filter(s => Object.entries(o.plan).some(([k, e]) => sameSubject(s, k, e.n)) || Object.entries(o.remaining).some(([k, n]) => sameSubject(s, k, n))).length; }

function renderFriendDetail(b) {
  const o = F.people.get(F.detail);
  if (!o) { F.view = 'list'; renderFriendsUi(); return; }
  const mutual = FR.friends.includes(o);
  let h = `<button class="btn ghost sm" data-fback><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 12H4M10 18L4 12L10 6"/></svg> Svi prijatelji</button>
    <div class="phead">${avatarHtml(o, 72)}<div><h3>${esc(fullName(o))}</h3><div class="muted">${esc([o.indeks && 'indeks ' + o.indeks, o.fakultet].filter(Boolean).join(' · '))}</div><div class="muted">${esc([o.nivo, o.akred && 'ak. ' + o.akred, o.godina && o.godina + '. godina', o.modul && 'modul ' + o.modul].filter(Boolean).join(' · '))}</div></div></div>`;
  if (!mutual) { b.innerHTML = h + `<div class="empty">Plan vidiš kad oboje potvrdite prijateljstvo.</div>`; return; }
  if (!o.share) { b.innerHTML = h + `<div class="empty">${esc(o.ime || 'Ovaj korisnik')} ne deli svoj plan.</div>`; return; }
  const plan = Object.entries(o.plan).map(([k, e]) => ({ sifra: k, ...e })).sort((a, b) => a.datum.localeCompare(b.datum) || a.vreme.localeCompare(b.vreme));
  const common = plan.filter(x => MY.some(s => sameSubject(s, x.sifra, x.n)));
  const other = plan.filter(x => !common.includes(x));
  const commonUnplanned = Object.entries(o.remaining).filter(([k, n]) => !o.plan[k] && MY.some(s => sameSubject(s, k, n)));
  const xrow = x => {
    const m = myInstFor(x), d = parseIso(x.datum);

// ================= Poruke (chat) =================
// Model:
//  - Svaki korisnik piše SAMO u svoj prostor box/<uid>/c/<cid> (pravilo {self}) → pošiljalac je autentičan.
//  - Privatni četovi (DM i grupe) su šifrovani (AES-GCM). Ključ grupe je za svakog člana umotan
//    ECDH(P-256) ključem između vlasnika i člana. Metapodaci grupe su u javnoj kartici vlasnika (people/<uid>.chats).
//  - Fakultetski četovi su javni (bez šifrovanja), učlanjenje: people/<uid>.groups.
//  - Online status i „kuca…" idu preko `room` sposobnosti.
const C = {
  on: false, assets: null, room: null, priv: null, pairCache: new Map(), keyCache: new Map(),
  boxes: new Map(), subs: new Map(), dec: new Map(), online: new Set(), typing: new Map(),
  mini: null, full: false, active: null, info: false, reply: null, edit: null, pollDraft: null,
  q: '', newChat: null, seenAct: new Map(), renderTimer: 0, myBox: new Map(), writing: new Map(), pendingWrite: new Set(),
  mobilePane: 'list', lastTypingEmit: 0, preview: null

const REACTIONS = ['👍', '❤️', '😂', '😮', '😢', '🎉'];

// ---------- pomoćne ----------
const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };

const enc = new TextEncoder(), dec = new TextDecoder();

const fmtSize = n => n > 1048576 ? `${(n / 1048576).toFixed(1)} MB` : n > 1024 ? `${Math.round(n / 1024)} KB` : `${n} B`;
const blobUrl = id => window.__blobUrl ? window.__blobUrl(id) : '/_blob/' + encodeURIComponent(id);
const slug = s => fold(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'fakultet';
function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]"'])/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`).replace(/\n/g, '<br>');
}
function personById(uid) { if (uid === Me.uid) return { uid, ...(prof() || {}) }; return F.people.get(uid) || { uid, ime: 'Nepoznat', prezime: 'korisnik' }; }
const firstName = uid => { const p = personById(uid); return p.ime || fullName(p); };

// ---------- kriptografija ----------
const ECDH = { name: 'ECDH', namedCurve: 'P-256' };
async function ensureKeys() {
  const p = prof(); if (!p || !window.crypto || !crypto.subtle) return false;
  if (!p.ck || !p.ck.priv || !p.ck.pub) {

    p.ck = { priv: await crypto.subtle.exportKey('jwk', kp.privateKey), pub: await crypto.subtle.exportKey('jwk', kp.publicKey) };
    Me.save();

}
const pubOf = uid => uid === Me.uid ? (prof() && prof().ck && prof().ck.pub) : (F.people.get(uid) || {}).pub;
async function pairKey(uid) {
  const jwk = pubOf(uid); if (!jwk || !C.priv) return null;
  const k = uid + '|' + jwk.x;
  if (!C.pairCache.has(k)) C.pairCache.set(k, (async () => {
    const pub = await crypto.subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: jwk.x, y: jwk.y }, ECDH, false, []);
    return crypto.subtle.deriveKey({ name: 'ECDH', public: pub }, C.priv, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  })().catch(() => null));

}

// ključ četa (verzija kv) koji je vlasnik `ko` umotao za mene
async function chatKey(ko, cid, kv) {
  const meta = chatMeta(ko, cid); if (!meta) return null;
  const w = meta.keys && meta.keys[kv] && meta.keys[kv][Me.uid]; if (!w) return null;
  const k = `${ko}|${cid}|${kv}|${w.ct.slice(0, 16)}`;
  if (!C.keyCache.has(k)) C.keyCache.set(k, (async () => {
    const pk = await pairKey(ko); if (!pk) return null;
    const raw = await aesDec(pk, w);
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  })().catch(() => null));
  return C.keyCache.get(k);
}
async function wrapKeyFor(uid, raw) { const pk = await pairKey(uid); return pk ? aesEnc(pk, raw) : null; }

// ---------- četovi ----------
function ownedChats() { return (prof() && prof().chatsOwned) || {}; }
function chatMeta(owner, cid) { return owner === Me.uid ? ownedChats()[cid] : ((F.people.get(owner) || {}).chats || {})[cid]; }
function facultyList() {
  const set = new Map();
  const add = f => { if (f && f.trim()) set.set(slug(f), f.trim()); };
  add(prof() && prof().fakultet);
  for (const o of F.people.values()) add(o.fakultet);
  return [...set.entries()].map(([s, name]) => ({ cid: 'fak-' + s, name }));
}
// svi četovi u kojima sam član
function myChats() {
  const p = prof(); if (!p) return [];
  const left = new Set(p.leftChats || []), out = new Map();
  const consider = (owner, cid, m) => {
    if (!m || !Array.isArray(m.members) || !m.members.includes(Me.uid) || left.has(cid)) return;
    const prev = out.get(cid);
    if (prev && prev.kind === 'dm' && prev.owner < owner) return; // DM: važi kopija vlasnika sa manjim id-jem
    out.set(cid, { cid, owner, kind: m.kind === 'dm' ? 'dm' : 'group', name: m.name || '', members: m.members, admins: m.admins || [], mode: m.mode === 'admins' ? 'admins' : 'all', kv: m.kv || 1, created: m.created || 0 });
  };
  for (const [cid, m] of Object.entries(ownedChats())) consider(Me.uid, cid, m);
  for (const o of F.people.values()) for (const [cid, m] of Object.entries(o.chats || {})) consider(o.uid, cid, m);
  for (const cid of p.groups || []) {
    const f = facultyList().find(x => x.cid === cid);
    const members = [Me.uid, ...[...F.people.values()].filter(o => (o.groups || []).includes(cid)).map(o => o.uid)];
    out.set(cid, { cid, owner: null, kind: 'fak', name: f ? f.name : cid.replace(/^fak-/, ''), members, admins: [], mode: 'all', kv: 0 });
  }

}
const chatById = cid => myChats().find(c => c.cid === cid) || null;
function chatTitle(c) {
  if (c.kind === 'dm') { const o = c.members.find(u => u !== Me.uid); return fullName(personById(o)); }
  return c.name || c.members.filter(u => u !== Me.uid).map(firstName).join(', ') || 'Grupa';
}
function chatAvatar(c, size = 40) {

  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px`;
  if (c.kind === 'fak') return `<span class="av grp fak" style="${st}"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"><path d="M3.0916 10.3634L9.78281 13.5004C11.2038 14.1665 12.7963 14.1665 14.2173 13.5004L20.9084 10.3634C22.3639 9.68105 22.3639 7.31899 20.9084 6.63664L14.2172 3.49965C12.7962 2.83345 11.2037 2.83345 9.78272 3.49965L3.0916 6.63659C1.63614 7.31895 1.63613 9.68101 3.0916 10.3634Z"/><path d="M2 8.5V14"/><path d="M19 11.5V16.6254C19 17.6334 18.4965 18.5772 17.6147 19.0656C16.1463 19.8787 13.796 21 12 21C10.204 21 7.8537 19.8787 6.38533 19.0656C5.5035 18.5772 5 17.6334 5 16.6254V11.5"/></g></svg></span>`;

function canWrite(c) { if (!c) return false; if (c.kind === 'fak' || c.kind === 'dm' || c.mode === 'all') return true; return c.owner === Me.uid || c.admins.includes(Me.uid); }
function isAdmin(c, uid) { return c.owner === uid || c.admins.includes(uid); }
function lastAct(c) { let t = 0; for (const u of c.members) { const p = u === Me.uid ? prof() : F.people.get(u); const a = p && p.act && p.act[c.cid]; if (a > t) t = a; } return t || c.created || 0; }
function othersAct(c) { let t = 0; for (const u of c.members) { if (u === Me.uid) continue; const p = F.people.get(u); const a = p && p.act && p.act[c.cid]; if (a > t) t = a; } return t; }
function isUnread(c) { const r = ((prof() || {}).readAt || {})[c.cid] || 0; return othersAct(c) > r && !(C.active === c.cid && chatVisible()); }
function unreadCount() { return myChats().filter(isUnread).length; }
const chatVisible = () => (C.full || !!C.mini) && document.visibilityState === 'visible';

// ---------- moj prostor (box) ----------
function boxRef(uid, cid) { return Store.db.doc(`box/${uid}/c/${cid}`); }
async function loadMyBox(cid) {
  if (C.myBox.has(cid)) return C.myBox.get(cid);
  let v = C.boxes.get(`${Me.uid}|${cid}`);
  if (!v) { try { const s = await boxRef(Me.uid, cid).get(); v = s.exists ? s.data() : null; } catch { v = null; } }
  const box = { cid, msgs: Array.isArray(v && v.msgs) ? JSON.parse(JSON.stringify(v.msgs)) : [], st: v && v.st ? JSON.parse(JSON.stringify(v.st)) : null };
  C.myBox.set(cid, box); return box;
}
// jedno pisanje po dokumentu; nagomilane izmene idu u sledeći upis
async function writeMyBox(cid) {
  if (C.writing.get(cid)) { C.pendingWrite.add(cid); return; }
  C.writing.set(cid, true);
  const box = C.myBox.get(cid);
  while (box.msgs.length > MAX_MSGS) box.msgs.shift();
  while (box.msgs.length > 1 && JSON.stringify(box).length > MAX_BOX_BYTES) box.msgs.shift();
  try { await boxRef(Me.uid, cid).set({ cid, msgs: box.msgs, st: box.st || null, at: Date.now() }); }
  catch (e) { toast(e && e.code === 'quota_exceeded' ? 'Baza poruka je puna. Obriši stare poruke ili grupe.' : 'Poruka nije poslata. Proveri vezu i pokušaj ponovo.'); }
  C.writing.set(cid, false);
  if (C.pendingWrite.delete(cid)) writeMyBox(cid);
}
// stanje (glasovi, reakcije, pročitano) – šifrovano kao i poruke
async function myState(c) {
  const box = await loadMyBox(c.cid);
  if (!box.st) return { votes: {}, reacts: {}, read: 0 };
  if (box.st.p) return box.st.p;
  const key = await chatKey(box.st.ko, c.cid, box.st.kv);
  if (!key) return { votes: {}, reacts: {}, read: 0 };
  try { return JSON.parse(dec.decode(await aesDec(key, box.st))); } catch { return { votes: {}, reacts: {}, read: 0 }; }
}
async function sealFor(c, obj) {
  if (c.kind === 'fak') return { p: obj };
  const key = await chatKey(c.owner, c.cid, c.kv);
  if (!key) throw { code: 'no_key' };
  return { ko: c.owner, kv: c.kv, ...(await aesEnc(key, enc.encode(JSON.stringify(obj)))) };
}
async function setMyState(c, fn) {

  await writeMyBox(c.cid);
}
async function sendMessage(c, body) {
  if (!canWrite(c)) { toast('U ovoj grupi pišu samo administratori.'); return false; }
  try {
    const box = await loadMyBox(c.cid);
    const id = rid(10), ts = Date.now();
    box.msgs.push({ id, ts, ...(await sealFor(c, body)) });
    C.dec.delete(`${Me.uid}|${c.cid}|${id}`);
    renderChatsSoon();

    const p = prof(); p.act = { ...(p.act || {}), [c.cid]: ts }; p.readAt = { ...(p.readAt || {}), [c.cid]: ts }; Me.save();
    return true;
  } catch (e) {
    toast(e && e.code === 'no_key' ? 'Ključ za ovaj čet još nije stigao. Vlasnik grupe treba da otvori aplikaciju.' : 'Poruka nije poslata.');
    return false;
  }
}
async function editMessage(c, id, fn) {

  const i = box.msgs.findIndex(m => m.id === id); if (i < 0) return;
  const body = await decryptMsg(c, Me.uid, box.msgs[i]); if (!body) return;

async function decryptMsg(c, from, m) {
  const k = `${from}|${c.cid}|${m.id}`, sig = (m.ct || '').slice(-12) + (m.p ? JSON.stringify(m.p).length : '');
  const hit = C.dec.get(k); if (hit && hit.sig === sig) return hit.body;
  let body = null;
  try {
    if (m.p && c.kind === 'fak') body = m.p;
    else if (m.ct && m.iv && c.kind !== 'fak') { const key = await chatKey(m.ko, c.cid, m.kv); if (key) body = JSON.parse(dec.decode(await aesDec(key, m))); }
  } catch { body = null; }

    body = { t: str(body.t, 10) || 'text', text: str(body.text, 4000), att: body.att && typeof body.att === 'object' ? { id: str(body.att.id, 40), name: str(body.att.name, 160), type: str(body.att.type, 60), size: +body.att.size || 0 } : null,
      poll: body.poll && Array.isArray(body.poll.opts) ? { q: str(body.poll.q, 200), opts: body.poll.opts.slice(0, 10).map(o => str(o, 100)), multi: !!body.poll.multi } : null,
      reply: str(body.reply, 40), edited: +body.edited || 0, del: !!body.del, url: /^https:\/\/meet\.jit\.si\/[A-Za-z0-9-]+$/.test(body.url || '') ? body.url : '', sys: str(body.sys, 200) };
  }

}
async function decryptState(c, from, st) {

  } catch {}

}

function wantedSubs() {
  const want = new Set(), cids = uniq([C.full && C.active, C.mini].filter(Boolean));
  for (const cid of cids) {
    const c = chatById(cid); if (!c) continue;
    let mem = c.members.slice();
    if (mem.length > MAX_SUBS) mem = mem.sort((a, b) => (b === Me.uid) - (a === Me.uid) || ((personById(b).act || {})[cid] || 0) - ((personById(a).act || {})[cid] || 0)).slice(0, MAX_SUBS);
    for (const u of mem) want.add(`${u}|${cid}`);
  }
  return want;
}
function syncSubs() {
  if (!C.on) return;
  const want = wantedSubs();
  for (const [k, un] of C.subs) if (!want.has(k)) { un(); C.subs.delete(k); C.boxes.delete(k); }
  for (const k of want) if (!C.subs.has(k)) {
    const [u, cid] = k.split('|');
    C.subs.set(k, boxRef(u, cid).onSnapshot(s => { C.boxes.set(k, s.exists ? s.data() : null); renderChatsSoon(); }, () => { C.subs.delete(k); }));
  }
}

// ---------- vremenska linija ----------
async function timeline(c) {
  const items = [], states = new Map();
  for (const u of c.members) {
    const v = C.boxes.get(`${u}|${c.cid}`); if (!v) continue;
    const st = await decryptState(c, u, v.st); if (st) states.set(u, st);
    for (const m of (Array.isArray(v.msgs) ? v.msgs : []).slice(-MAX_MSGS)) {
      if (!m || typeof m.id !== 'string' || !(m.ts > 0)) continue;
      const body = await decryptMsg(c, u, m);
      if (c.mode === 'admins' && c.kind === 'group' && !isAdmin(c, u) && !(body && body.sys)) continue; // samo admini
      items.push({ from: u, id: m.id, ts: m.ts, body });
    }
  }
  items.sort((a, b) => a.ts - b.ts || a.id.localeCompare(b.id));
  // glasovi i reakcije
  const votes = {}, reacts = {};
  for (const [u, st] of states) {
    for (const [mid, arr] of Object.entries(st.votes || {})) if (Array.isArray(arr)) (votes[mid] = votes[mid] || {})[u] = arr.filter(x => Number.isInteger(x)).slice(0, 10);
    for (const [mid, e] of Object.entries(st.reacts || {})) if (REACTIONS.includes(e)) (reacts[mid] = reacts[mid] || {})[u] = e;
  }
  return { items, votes, reacts, states };
}

function bindNewChat(conv) {

async function newKeysFor(members) {
  const raw = crypto.getRandomValues(new Uint8Array(32)), keys = {};
  for (const u of members) { const w = await wrapKeyFor(u, raw); if (w) keys[u] = w; }
  return { raw: b64(raw), keys };
}
async function createChat(members, name, mode) {
  const p = prof();
  if (!(await ensureKeys())) { toast('Ovaj pregledač ne podržava šifrovanje poruka.'); return null; }
  const isDm = members.length === 1;
  let cid;
  if (isDm) {
    const other = members[0];
    const existing = myChats().find(c => c.kind === 'dm' && c.members.includes(other));
    if (existing) return existing.cid;
    cid = 'dm-' + [Me.uid, other].sort().join('-').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 120);
  } else cid = 'g-' + rid(14);
  const all = uniq([Me.uid, ...members]);
  const { raw, keys } = await newKeysFor(all);
  p.chatsOwned = { ...(p.chatsOwned || {}), [cid]: { kind: isDm ? 'dm' : 'group', name: isDm ? '' : (name || '').trim().slice(0, 60), members: all, admins: [], mode: mode === 'admins' ? 'admins' : 'all', kv: 1, keys: { 1: keys }, raw: { 1: raw }, created: Date.now() } };
  p.leftChats = (p.leftChats || []).filter(x => x !== cid);
  Me.save();
  if (!isDm) { const c = chatById(cid); if (c) sendMessage(c, { t: 'sys', sys: `${firstName(Me.uid)} je napravio/la grupu` }); }
  return cid;
}
// vlasnik: dopuni ključeve za članove kojima fali (npr. nisu imali javni ključ kad su dodati)
async function ensureWrapped() {
  const p = prof(); if (!p || !p.chatsOwned || !C.priv) return;
  let changed = false;
  for (const [cid, m] of Object.entries(p.chatsOwned)) {
    const raw = m.raw && m.raw[m.kv]; if (!raw) continue;
    const ks = (m.keys[m.kv] = m.keys[m.kv] || {});
    for (const u of m.members) if (!ks[u] && pubOf(u)) { const w = await wrapKeyFor(u, unb64(raw)); if (w) { ks[u] = w; changed = true; } }
    // članovi koji su napustili grupu
    const leftUs = m.members.filter(u => u !== Me.uid && ((F.people.get(u) || {}).leftChats || []).includes(cid));
    if (leftUs.length && m.kind === 'group') { await rotateMembers(cid, m.members.filter(u => !leftUs.includes(u)), false); changed = true; }
  }
  if (changed) Me.save();
}
async function rotateMembers(cid, members, save = true) {
  const p = prof(), m = p.chatsOwned[cid]; if (!m) return;
  const kv = (m.kv || 1) + 1, { raw, keys } = await newKeysFor(members);
  m.members = members; m.admins = (m.admins || []).filter(u => members.includes(u));
  m.kv = kv; m.keys = { ...m.keys, [kv]: keys }; m.raw = { ...m.raw, [kv]: raw };
  // čuvamo poslednjih 5 verzija ključa (starije poruke ostaju čitljive)
  const vs = Object.keys(m.keys).map(Number).sort((a, b) => b - a);
  for (const v of vs.slice(5)) { delete m.keys[v]; delete m.raw[v]; }
  C.keyCache.clear();
  if (save) Me.save();
}

const ALLOWED = /^(image\/(png|jpeg|gif|webp|svg\+xml)|video\/(mp4|webm|quicktime)|application\/pdf|text\/(plain|csv|markdown)|application\/json)$/;
function fileType(f) {
  if (f.type && ALLOWED.test(f.type)) return f.type;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  return { md: 'text/markdown', csv: 'text/csv', txt: 'text/plain', json: 'application/json', pdf: 'application/pdf', mov: 'video/quicktime', mp4: 'video/mp4', webm: 'video/webm' }[ext] || '';
}
async function sendFiles(c, files) {
  if (!C.assets) { toast('Slanje fajlova ti trenutno nije dostupno (potreban je pristup za korišćenje aplikacije).'); return; }
  for (const f of files) {
    const type = fileType(f);
    if (!type) { toast(`„${f.name}" nije podržan. Šalji slike, video, PDF ili tekst (Word i PowerPoint sačuvaj kao PDF).`); continue; }
    if (f.size > 20 * 1048576) { toast(`„${f.name}" je veći od 20 MB.`); continue; }
    toast(`Šaljem ${f.name}…`);
    try {
      const r = await C.assets.upload(f, { type });
      await sendMessage(c, { t: /^image\//.test(type) ? 'img' : /^video\//.test(type) ? 'video' : 'file', att: { id: r.id, name: f.name.slice(0, 160), type: r.contentType || type, size: r.sizeBytes || f.size } });
    } catch (e) { toast(e && e.code === 'quota_exceeded' ? 'Prostor za fajlove je pun.' : `„${f.name}" nije poslat. Pokušaj ponovo.`); }
  }
}
async function openPreview(id, type, name) {
  const url = blobUrl(id);
  const dlg = $('#previewDlg'), body = $('#previewBody');
  $('#previewTitle').textContent = name || 'Pregled';
  $('#previewOpen').href = url;
  body.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
  if (!dlg.open) dlg.showModal();
  try {
    if (/^image\//.test(type)) body.innerHTML = `<img class="pimg" src="${url}" alt="${esc(name)}">`;
    else if (/^video\//.test(type)) body.innerHTML = `<video class="pimg" src="${url}" controls autoplay></video>`;
    else if (type === 'application/pdf') {
      const lib = await loadPdfJs();
      const data = new Uint8Array(await (await fetch(url)).arrayBuffer());
      const pdf = await lib.getDocument({ data, isEvalSupported: false }).promise;
      body.innerHTML = `<div class="pdfpages"></div><div class="muted" style="text-align:center;padding:8px">${pdf.numPages} ${pdf.numPages === 1 ? 'strana' : 'strana'}${pdf.numPages > 30 ? ' · prikazano prvih 30' : ''}</div>`;
      const host = body.querySelector('.pdfpages');
      for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) {
        if (!dlg.open) break;
        const page = await pdf.getPage(i), vp = page.getViewport({ scale: 1.4 });
        const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; host.appendChild(cv);
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      }
    } else {
      const t = await (await fetch(url)).text();
      body.innerHTML = `<pre class="ptext">${esc(t.slice(0, 200000))}</pre>`;
    }
  } catch { body.innerHTML = `<div class="empty"><strong>Pregled nije uspeo</strong>Otvori fajl u novom tabu.</div>`; }
}

async function initRoom() {
  try { C.room = await window.claude.use('room'); } catch { C.room = null; }
  if (!C.room) return;
  try { C.room.presence({ app: 'planer' }); } catch {}
  C.room.onPeers(peers => {
    C.online = new Set(peers.filter(p => p.kind === 'viewer' && !p.isMe && p.by).map(p => p.by));
    renderChatBadges(); renderFriendsUi(); if (C.full || C.mini) renderChatsSoon();
  });
  C.room.on('typing', m => {
    if (!m.by || m.isMe || !m.data || typeof m.data.cid !== 'string') return;
    const c = chatById(m.data.cid); if (!c || !c.members.includes(m.by)) return;
    if (!C.typing.has(c.cid)) C.typing.set(c.cid, new Map());
    C.typing.get(c.cid).set(m.by, Date.now());
    renderChatsSoon(); setTimeout(renderChatsSoon, 4200);
  });
  C.room.on('call', m => {
    if (!m.by || m.isMe || !m.data) return;
    const c = chatById(m.data.cid); if (!c || !c.members.includes(m.by)) return;
    const url = String(m.data.url || ''); if (!/^https:\/\/meet\.jit\.si\/[A-Za-z0-9-]+$/.test(url)) return;
    toast(`${firstName(m.by)} započinje video poziv${c.kind !== 'dm' ? ' u „' + chatTitle(c) + '"' : ''}.`, { label: 'Otvori čet', fn: () => openMini(c.cid) });
  });
}
function emitTyping(cid) {
  if (!C.room || Date.now() - C.lastTypingEmit < 2500) return;
  C.lastTypingEmit = Date.now();
  C.room.emit('typing', { cid }).catch(() => {});
}
async function startCall(c) {
  const url = `https://meet.jit.si/PlanerIspita-${rid(16).replace(/[^A-Za-z0-9]/g, '')}`;
  const ok = await sendMessage(c, { t: 'call', url });
  if (!ok) return;

  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; document.body.appendChild(a); a.click(); a.remove();
}

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Ne mogu da učitam ' + src)); document.head.appendChild(s); }); }
function loadPdfJs() {
  if (!pdfLibPromise) pdfLibPromise = (async () => {
    await loadScript(PDFJS + 'pdf.min.js');
    await loadScript(PDFJS + 'pdf.worker.min.js'); // radi u glavnoj niti (bez zasebnog workera)
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    return window.pdfjsLib;
  })().catch(e => { pdfLibPromise = null; throw e; });
  return pdfLibPromise;
}

async function handleFile(file) {
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { showUpErr('Izabrani fajl nije PDF. Izaberi PDF dokument sa rasporedom ispita.'); return; }
  renderUpload('parsing');
  try {
    const lib = await loadPdfJs();
    const data = new Uint8Array(await file.arrayBuffer());
    const pdf = await lib.getDocument({ data, isEvalSupported: false }).promise;
    const lines = await pdfToLines(pdf);
    const { rows, bad } = parseLines(lines);
    if (!rows.length) { UP = null; renderUpload(); showUpErr('U ovom PDF-u nisam našao nijedan red rasporeda. Očekujem kolone: Nivo, Akred., Sem., Modul, Šifra, Predmet, Datum, Vreme. Ako je PDF skeniran (slika), tekst se ne može pročitati.'); return; }
    const g = guessMeta(file.name, rows);
    UP = { fileName: file.name, rows, bad, rok: g.rok, godina: g.godina };
    renderUpload();
  } catch (err) {
    UP = null; renderUpload();
    showUpErr('PDF nije mogao da se pročita: ' + (err && err.message ? err.message : 'nepoznata greška') + '. Proveri da li je fajl ispravan i pokušaj ponovo.');
  }
}
function showUpErr(msg) { const el = $('#upErr'); if (el) el.innerHTML = `<div class="banner err">${esc(msg)}</div>`; }

async function saveUpload() {
  const id = rokId(UP.godina, UP.rok);
  const existing = S.rokovi.find(r => r.meta.id === id);
  const dates = UP.rows.map(r => r[6]).sort();
  const meta = { id, rok: UP.rok, godina: UP.godina, fileName: UP.fileName, uploadedAt: new Date().toISOString(), count: UP.rows.length, od: dates[0], do: dates[dates.length - 1], chunks: Math.ceil(UP.rows.length / CHUNK) };
  const rows = UP.rows;
  renderUpload('saving');
  try {
    await Store.saveRok(meta, rows, existing ? existing.meta.chunks : 0);
    S.rokovi = S.rokovi.filter(r => r.meta.id !== id).concat([{ meta, rows }]);
    rebuild();
    const d = parseIso(meta.od); S.y = d.getFullYear(); S.m = d.getMonth(); S.selDay = null;
    $('#uploadDlg').close();
    derive(); refresh();
    toast(`Sačuvano: ${rokName(id)} · ${ispita(rows.length)}`);
    if (!prof()) setTimeout(() => openWizard(true, null), 400);
  } catch (err) {
    renderUpload();
    const code = err && err.code;
    showUpErr(code === 'quota_exceeded' ? 'Baza je puna. Obriši neki stari rok pa pokušaj ponovo.'
      : code === 'local_full' ? 'Pregledač nema više mesta za čuvanje. Obriši neki stari rok pa pokušaj ponovo.'
      : code === 'not_granted' || code === 'revoked' ? (HOSTED ? 'Rokove može da dodaje samo administrator.' : 'Nemaš dozvolu za čuvanje u ovoj aplikaciji. Zamoli vlasnika da ti da pristup za izmene.')
      : 'Čuvanje nije uspelo (' + (err && (err.message || code) || 'greška') + '). Pokušaj ponovo.');
  }
}

        : `<button class="btn danger sm" data-ask="${esc(meta.id)}">Obriši</button>`}
    </div>`).join('') + `</div>
    <div class="actions"><button class="btn primary" data-open-upload><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"><path d="M18.18 8.03933L18.6435 7.57589C19.4113 6.80804 20.6563 6.80804 21.4241 7.57589C22.192 8.34374 22.192 9.58868 21.4241 10.3565L20.9607 10.82M18.18 8.03933C18.18 8.03933 18.238 9.02414 19.1069 9.89309C19.9759 10.762 20.9607 10.82 20.9607 10.82M20.9607 10.82L16.7001 15.0806C16.4115 15.3692 16.2672 15.5135 16.1081 15.6376C15.9204 15.7839 15.7173 15.9094 15.5025 16.0118C15.3203 16.0986 15.1268 16.1632 14.7396 16.2922L13.5 16.7054L13.099 16.8391L12.6979 16.9728C12.5074 17.0363 12.2973 16.9867 12.1553 16.8447C12.0133 16.7027 11.9637 16.4926 12.0272 16.3021L12.1609 15.901L12.2946 15.5L12.7078 14.2604C12.8368 13.8732 12.9014 13.6797 12.9882 13.4975C13.0906 13.2827 13.2161 13.0796 13.3624 12.8919C13.4865 12.7328 13.6308 12.5885 13.9194 12.2999L18.18 8.03933M13.099 16.8391L12.1609 15.901"/><path d="M8 13H10.5"/><path d="M8 9H14.5"/><path d="M8 17H9.5"/><path d="M19.8284 3.17157C18.6569 2 16.7712 2 13 2H11C7.22876 2 5.34315 2 4.17157 3.17157C3 4.34315 3 6.22876 3 10V14C3 17.7712 3 19.6569 4.17157 20.8284C5.34315 22 7.22876 22 11 22H13C16.7712 22 18.6569 22 19.8284 20.8284C20.7715 19.8853 20.9554 18.4796 20.9913 16"/></g></svg> Dodaj rok (PDF)</button></div>`;
}
function openManage() { if (!S.isAdmin) return; confirmId = null; go('admin'); renderManage(); }
$('#manageBody').addEventListener('click', async e => {
  const ask = e.target.closest('[data-ask]'); if (ask) { confirmId = ask.dataset.ask; renderManage(); return; }
  if (e.target.closest('[data-cancel]')) { confirmId = null; renderManage(); return; }
  const del = e.target.closest('[data-del]');
  if (del) {
    const r = S.rokovi.find(r => r.meta.id === del.dataset.del); if (!r) return;
    del.disabled = true; del.textContent = 'Brišem…';
    try {
      await Store.deleteRok(r.meta);
      S.rokovi = S.rokovi.filter(x => x !== r); confirmId = null; rebuild(); derive(); refresh(); renderManage();
      toast('Obrisano: ' + rokLabel(r.meta.rok) + ' ' + r.meta.godina);
    } catch (err) { confirmId = null; renderManage(); toast('Brisanje nije uspelo. Pokušaj ponovo.'); }
  }
});

// ================= Navigacija =================
// Sekcije aplikacije. Nove celine (npr. „predmeti" sa blanketima po ispitu, „instruktori" za časove)
// dodaju se ovde + jedna stavka u traci i jedan <section class="page">.
const ROUTES = {
  plan: { title: 'Moj plan', sec: 'planer', sub: () => '' },
  kalendar: { title: 'Kalendar', sec: 'planer', sub: () => '' },
  poruke: { title: 'Poruke', sec: 'poruke', sub: () => 'Privatne poruke i grupe su šifrovane' },
  prijatelji: { title: 'Prijatelji', sec: 'prijatelji', sub: () => { const n = FR.friends.length, on = FR.friends.filter(f => C.online.has(f.uid)).length; return `${num(n, 'prijatelj', 'prijatelja', 'prijatelja')}${on ? ` · ${on} online` : ''}`; } },
  admin: { title: 'Administracija', sec: 'admin', sub: () => 'Ispitni rokovi i termini koje vide svi korisnici' },
  podesavanja: { title: 'Podešavanja', sec: 'podesavanja', sub: () => (prof() && prof().ime ? fullName(prof()) : 'Profil, studije i aplikacija') }
};
const hashRoute = () => { const h = location.hash.slice(1), b = h.split('-')[0]; return ROUTES[b] ? b : null; };
const hashSection = () => { const h = location.hash.slice(1); return h.startsWith('podesavanja-') ? h.slice(12) : null; };
let route = hashRoute() || (lsGet('raspored-ispita:start') === 'kalendar' ? 'kalendar' : 'plan');
if (route === 'plan') S.view = 'plan'; else if (route === 'kalendar' && S.view === 'plan') S.view = 'mesec';
function go(r) { const b = r.split('-')[0]; if (!ROUTES[b]) r = 'plan'; if (location.hash.slice(1) !== r) location.hash = r; else applyRoute(); }
function setRouteUi() {
  const sec = ROUTES[route].sec;
  document.querySelectorAll('.page').forEach(el => { el.hidden = el.id !== 'sec-' + sec; });
  document.querySelectorAll('[data-route]').forEach(a => { if (a.dataset.route === route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#pageTitle').textContent = ROUTES[route].title;
  document.body.dataset.route = route;
  $('#filtersToggle').hidden = sec !== 'planer';
}
function applyRoute() {
  let r = hashRoute() || 'plan';
  if (r === 'admin' && S.loaded && !S.isAdmin) { location.hash = 'plan'; return; }
  const changed = r !== route; route = r;
  if (r === 'plan') S.view = 'plan';
  if (r === 'kalendar' && S.view === 'plan') S.view = S.calView || 'mesec';
  setRouteUi();
  if (r === 'poruke') openFull(C.pendingCid || null); else if (C.full) closeFull();
  C.pendingCid = null;
  if (r === 'prijatelji') { if (changed && !F.keep) { F.view = 'list'; if (FR.incoming.length) F.tab = 'requests'; } F.keep = false; renderFriendsUi(); }
  if (r === 'admin') { if (!S.isAdmin) { location.hash = 'plan'; return; } renderManage(); }
  if (r === 'podesavanja') enterSettings(hashSection());
  saveUi(); refresh();
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', applyRoute);

// ---- administrator: samo on menja ispitne rokove i termine ----
// claude.ai: vlasnik artifakta. Supabase: email iz tabele `admins`. Bez baze (lokalno): korisnik sam sebi.
async function resolveAdmin() {
  if (Store.mode !== 'db') return true;
  try { const u = await window.claude.use('user'); return !!(u && typeof u.isOwner === 'function' && await u.isOwner()); } catch { return false; }
}

// ================= Start =================
function pickInitialMonth() {
  const nx = plannedList().find(s => s.plan.datum >= todayIso);
  const src = nx ? nx.plan.datum : (FILTERED.find(e => e.datum >= todayIso) || S.exams.find(e => e.datum >= todayIso) || S.exams[S.exams.length - 1] || {}).datum;
  if (!src) return;
  const d = parseIso(src); S.y = d.getFullYear(); S.m = d.getMonth();
}
(async function start() {
  renderSide(); renderView(); renderDay();
  await Store.init();
  await Me.init(Store.db);
  try { S.rokovi = await Store.loadAll(); }
  catch (err) {
    S.rokovi = [];
    $('#bannerArea').innerHTML = `<div class="banner err" style="margin-bottom:14px">Sačuvani rasporedi trenutno nisu dostupni. Proveri vezu i osveži stranicu.</div>`;
  }
  try { await Me.load(); }
  catch (err) { $('#bannerArea').insertAdjacentHTML('beforeend', `<div class="banner err" style="margin-bottom:14px">Tvoj plan trenutno nije dostupan. Osveži stranicu za koji trenutak.</div>`); Me.loadFailed = true; }
  S.isAdmin = await resolveAdmin();
  $('#adminNav').hidden = !S.isAdmin;
  rebuild(); derive(); deriveFriends(); applyFilters(); pickInitialMonth(); S.loaded = true;
  setRouteUi(); refresh();
  subscribePeople();
  await initChat();
  if (route === 'poruke') openFull(); else if (route === 'admin') { if (S.isAdmin) renderManage(); else go('plan'); } else if (route === 'podesavanja') enterSettings(hashSection());
  if (!Me.loadFailed && (!prof() || !prof().onboarded) && S.exams.length) openWizard(true, null);
  else if (prof() && prof().onboarded && !prof().ime) { openSettings('profil'); W.note = 'Novo: dopuni profil imenom, a po želji i brojem indeksa i slikom, da bi te prijatelji pronašli.'; renderSettings(); }
})();
window.addEventListener('pagehide', () => { if (Me.dirty) Me.flush(); });
})();
</script>
